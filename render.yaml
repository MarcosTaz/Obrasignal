services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 preload:APP
    envVars:
      - key: POLL_SECONDS
        value: "300"
      - key: TED_DAYS
        value: "30"
      - key: TED_MAX_PAGES
        value: "60"
