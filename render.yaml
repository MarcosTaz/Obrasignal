services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Two worker processes preserve process isolation and runtime-leader election.
    # Keep the measured baseline at four gthreads per worker until production load
    # evidence justifies increasing concurrency; auth discovery is moved out of the
    # request hot path instead of masking starvation with unmeasured overcommit.
    # Pin the two exact company-controlled browser origins at the serving boundary
    # as well as in the Render blueprint env. This prevents a stale dashboard env
    # from overriding the canonical production origin while preserving strict CORS.
    startCommand: OBRASIGNAL_CORS_ORIGIN=https://obrasignal.com OBRASIGNAL_CORS_FALLBACK_ORIGIN=https://marcostaz.github.io gunicorn --bind 0.0.0.0:$PORT --workers 2 --worker-class gthread --threads 4 --timeout 180 production_entrypoint:APP
    healthCheckPath: /api/v1/health
    # SQLite remains one persistent store on one Render instance. WAL plus short
    # bounded writer transactions allow both HTTP workers to share it safely.
    disk:
      name: obrasignal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OBRASIGNAL_AUTH_MODE
        value: "provider"
      - key: OBRASIGNAL_JWT_ISSUER
        sync: false
      - key: OBRASIGNAL_JWT_AUDIENCE
        value: "authenticated"
      # Public signing keys are safe to cache for longer than the five-minute
      # default. Unknown key IDs still force refresh, so provider key rotation is
      # preserved while normal customer requests avoid repeated network latency.
      - key: OBRASIGNAL_JWKS_CACHE_SECONDS
        value: "3600"
      - key: OBRASIGNAL_JWKS_STALE_MAX_SECONDS
        value: "86400"
      - key: OBRASIGNAL_CORS_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_CORS_FALLBACK_ORIGIN
        value: "https://marcostaz.github.io"
      - key: OBRASIGNAL_WEB_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_DB
        value: "/var/data/obrasignal.db"
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      # Public-procurement feeds do not need one-minute polling. Five minutes
      # materially lowers writer pressure while remaining operationally fresh.
      - key: POLL_SECONDS
        value: "300"
      - key: TED_DAYS
        value: "30"
      - key: TED_MAX_PAGES
        value: "4"