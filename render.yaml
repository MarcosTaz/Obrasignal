services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 api:APP
    envVars:
      # Poll frequently enough to make the radar near-real-time without
      # pretending that upstream procurement portals publish instantaneously.
      - key: POLL_SECONDS
        value: "60"
      - key: TED_DAYS
        value: "30"
      - key: TED_MAX_PAGES
        value: "60"
