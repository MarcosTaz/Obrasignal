services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Global WSGI boundary guarantees browser preflight/CORS before auth hooks.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 cors_app:APP
    healthCheckPath: /api/v1/health
    # SQLite is currently the application's datastore. Keep it on a Render
    # persistent disk so authenticated profiles and opportunity state survive
    # deploys/restarts. This is intentionally single-instance for now.
    disk:
      name: obrasignal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Production authentication MUST be explicit; secret JWT provider values
      # are configured in the Render dashboard/environment, never committed here.
      - key: OBRASIGNAL_AUTH_MODE
        value: "provider"
      - key: OBRASIGNAL_JWT_ISSUER
        sync: false
      # Supabase user access tokens use the authenticated audience.
      - key: OBRASIGNAL_JWT_AUDIENCE
        value: "authenticated"
      # Native Supabase JWKS is derived from the canonicalized issuer. Keeping a
      # second manually configured URL created a stale-key/configuration failure
      # mode during asymmetric-key migration, so no Supabase JWKS override is
      # declared by the production blueprint.
      # Official customer Web origin. Infrastructure URLs are not customer truth.
      - key: OBRASIGNAL_CORS_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_WEB_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_DB
        value: "/var/data/obrasignal.db"
      - key: POLL_SECONDS
        value: "60"
      - key: TED_DAYS
        value: "30"
      # Keep the first production sync bounded; subsequent 60s polls keep it fresh.
      - key: TED_MAX_PAGES
        value: "4"
