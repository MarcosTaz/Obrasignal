services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Two HTTP workers prevent the elected ingestion leader from becoming a
    # single availability point. Cross-process runtime_leader locking guarantees
    # that only one worker starts ingestion and push schedulers.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 180 production_entrypoint:APP
    healthCheckPath: /api/v1/health
    # SQLite remains one persistent store on one Render instance. WAL plus short
    # bounded writer transactions allow both HTTP workers to share it safely.
    disk:
      name: obrasignal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OBRASIGNAL_AUTH_MODE
        value: "provider"
      - key: OBRASIGNAL_JWT_ISSUER
        sync: false
      - key: OBRASIGNAL_JWT_AUDIENCE
        value: "authenticated"
      - key: OBRASIGNAL_CORS_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_CORS_FALLBACK_ORIGIN
        value: "https://marcostaz.github.io"
      - key: OBRASIGNAL_WEB_ORIGIN
        value: "https://obrasignal.com"
      - key: OBRASIGNAL_DB
        value: "/var/data/obrasignal.db"
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: POLL_SECONDS
        value: "60"
      - key: TED_DAYS
        value: "30"
      - key: TED_MAX_PAGES
        value: "4"