services:
  - type: web
    name: obrasignal
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Explicitly launch the native API facade so /api/v1 routes and JWT auth are served.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 api:APP
    healthCheckPath: /api/v1/health
    envVars:
      # Production authentication MUST be explicit; secret JWT provider values
      # are configured in the Render dashboard/environment, never committed here.
      - key: OBRASIGNAL_AUTH_MODE
        value: "provider"
      - key: OBRASIGNAL_JWT_ISSUER
        sync: false
      - key: OBRASIGNAL_JWT_AUDIENCE
        sync: false
      - key: OBRASIGNAL_JWKS_URL
        sync: false
      # Production web client origin. This is not a secret.
      - key: OBRASIGNAL_CORS_ORIGIN
        value: "https://marcostaz.github.io"
      # Poll frequently enough to make the radar near-real-time without
      # pretending that upstream procurement portals publish instantaneously.
      - key: POLL_SECONDS
        value: "60"
      - key: TED_DAYS
        value: "30"
      - key: TED_MAX_PAGES
        value: "60"
