name: ObraSignal Tenant B Admin Confirm One-Shot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      API_URL: https://obrasignal.onrender.com/api/v1
      TARGET_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Confirm/provision tenant B with server-side Supabase admin credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::ADMIN_CONFIRM_BLOCKED Configure SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_ROLE_KEY as an Actions secret.'
            exit 1
          fi
          python scripts/provision_ephemeral_tenant.py

      - name: Prove two-tenant production isolation immediately
        shell: bash
        run: |
          set -euo pipefail
          python scripts/live_tenant_isolation_runner.py
