name: ObraSignal Canonical Domain Readiness

on:
  workflow_run:
    workflows: ["ObraSignal Web Preview"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * *"

permissions:
  contents: read

concurrency:
  group: canonical-domain-readiness
  cancel-in-progress: true

env:
  CANONICAL_URL: https://obrasignal.com/
  TARGET_BUILD: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  canonical-domain:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require DNS, HTTPS and exact build on canonical domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python scripts/canonical_domain_readiness.py; then
              exit 0
            fi
            if [ "$attempt" = 12 ]; then
              echo "Canonical domain did not converge to the exact build."
              exit 1
            fi
            echo "Waiting for Pages/CDN convergence ($attempt/12)…"
            sleep 15
          done
