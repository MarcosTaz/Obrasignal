name: ObraSignal Push Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: push-production-acceptance
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  API_URL: https://obrasignal.onrender.com/api/v1

jobs:
  closed-app-push-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact backend build
        env:
          TARGET_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/health" > /tmp/health.json \
              && TARGET_BUILD="$TARGET_BUILD" python - <<'PY'
          import json, os
          health=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health.get('ok') is True
          assert health.get('build') == os.environ['TARGET_BUILD']
          PY
            then exit 0; fi
            test "$attempt" != 24 || { echo "Production never served exact target build."; exit 1; }
            sleep 10
          done

      - name: Verify authenticated push preference contract
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_KEY E2E_EMAIL E2E_PASSWORD; do
            test -n "${!name}" || { echo "Missing required E2E secret: $name"; exit 1; }
          done
          BASE_URL="${SUPABASE_URL%/}"; BASE_URL="${BASE_URL%/rest/v1}"
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )"
          echo "probe=auth"
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' \
            --data "$BODY" > /tmp/auth.json
          TOKEN="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/auth.json', encoding='utf-8'))['access_token'])
          PY
          )"
          AUTH="Authorization: Bearer $TOKEN"

          echo "probe=unauthenticated-push-status"
          unauth="$(curl --max-time 20 --silent --output /tmp/push-unauth.json --write-out '%{http_code}' "$API_URL/push/status")"
          test "$unauth" = "401"

          echo "probe=authenticated-push-status"
          curl --fail --silent --show-error --max-time 20 -H "$AUTH" "$API_URL/push/status" > /tmp/push-before.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/push-before.json',encoding='utf-8'))
          assert p.get('account_id')
          pref=p.get('preference') or {}
          assert pref.get('local_hour') in (7,8)
          assert isinstance(p.get('devices'), list)
          json.dump(pref, open('/tmp/pref-before.json','w',encoding='utf-8'))
          PY

          cleanup() {
            python - <<'PY' >/tmp/pref-restore.json
          import json
          p=json.load(open('/tmp/pref-before.json',encoding='utf-8'))
          print(json.dumps({'enabled':bool(p.get('enabled')),'timezone':p.get('timezone') or 'Europe/Lisbon','local_hour':p.get('local_hour',8),'local_minute':p.get('local_minute',0)}))
          PY
            curl --max-time 20 --silent --show-error -X POST "$API_URL/push/preference" -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/pref-restore.json >/dev/null || true
          }
          trap cleanup EXIT

          echo "probe=push-preference-write"
          printf '%s' '{"enabled":true,"timezone":"Europe/Lisbon","local_hour":8,"local_minute":0}' >/tmp/pref-test.json
          curl --fail --silent --show-error --max-time 20 -X POST "$API_URL/push/preference" -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/pref-test.json > /tmp/pref-after.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/pref-after.json',encoding='utf-8'))['preference']
          assert p['enabled'] is True and p['timezone']=='Europe/Lisbon' and p['local_hour']==8
          PY

          echo "probe=invalid-device-contract"
          bad="$(curl --max-time 20 --silent --output /tmp/bad-token.json --write-out '%{http_code}' -X POST "$API_URL/push/device" -H "$AUTH" -H 'Content-Type: application/json' --data '{"token":"not-a-token","platform":"ios","timezone":"Europe/Lisbon"}')"
          test "$bad" = "400"
          grep -q 'invalid_push_token' /tmp/bad-token.json
          echo "Closed-app push server contract PASS."
