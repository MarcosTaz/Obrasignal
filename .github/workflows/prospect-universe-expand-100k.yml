name: ObraSignal add 100k prospect candidates

on:
  push:
    branches: [ops/prospect-universe-300k]
    paths:
      - 'ops/prospecting/build_100k_expansion_candidates.py'
      - '.github/workflows/prospect-universe-expand-100k.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build historical all-market candidate pool
        env:
          TARGET: '250000'
          OUT_DIR: prospect_expansion_output
        run: python ops/prospecting/build_100k_expansion_candidates.py
      - name: Validate candidate pool
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('prospect_expansion_output/obrasignal_expansion_candidates.csv')
          with p.open(encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows) >= 120000, len(rows)
          countries={r['country'] for r in rows}
          assert len(countries) >= 28, len(countries)
          print('rows',len(rows),'countries',len(countries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: obrasignal-expansion-candidates
          path: |
            prospect_expansion_output/obrasignal_expansion_candidates.csv
            prospect_expansion_output/obrasignal_expansion_candidates_summary.json
          retention-days: 30
