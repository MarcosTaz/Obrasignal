name: ObraSignal Production Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build and verify on EAS
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches: [main]
    paths:
      - '.eas-production-once'

concurrency:
  group: obrasignal-production-build-${{ github.event_name == 'push' && 'android' || inputs.platform }}
  cancel-in-progress: false

jobs:
  android-production-build:
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all' }}
    name: EAS production build (android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Record exact revision
        run: |
          echo "ObraSignal production Android source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo '::error::MOBILE_BLOCKED EXPO_TOKEN is not configured.'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo project before native build
        run: npx expo-doctor

      - name: Build and wait for production binary
        run: eas build --platform android --profile production --non-interactive --wait

  ios-production-build:
    # iOS remains explicitly manual: Apple distribution credentials must be
    # deliberately activated and must never be inferred from an Android build.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'ios' || inputs.platform == 'all') }}
    name: EAS production build (ios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Record exact revision
        run: |
          echo "ObraSignal production iOS source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo '::error::MOBILE_BLOCKED EXPO_TOKEN is not configured.'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo project before native build
        run: npx expo-doctor

      - name: Build and wait for production binary
        run: eas build --platform ios --profile production --non-interactive --wait
