name: ObraSignal Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-production.yml'

jobs:
  production-build:
    name: EAS production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Require canonical npm lock
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo 'BLOCKED: mobile/package-lock.json is required for an EAS production build.' >&2
            exit 1
          }

      - name: Install canonical locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production binaries
        run: eas build --platform all --profile production --non-interactive --no-wait
