name: Apply Q070 Completion

on:
  push:
    branches: [codex/q070-shared-families]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/q070-shared-families
      - name: Promote Q070 and activate Q080
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('master_execution_queue.py')
          s = p.read_text()
          s = s.replace('CURRENT_ITEM_ID = "Q070_SHARED_FAMILIES"', 'CURRENT_ITEM_ID = "Q080_EVIDENCE_GRAPH_V1"', 1)
          old = '''    _q("Q070_SHARED_FAMILIES", "Harden TED/eForms and OCDS shared-coverage families", "SIGNAL", "ACTIVE", "PRODUCTION",
       ("Q040_CANADA_BUYS", "Q050_US_SAM"),
       "Maximise supported markets per maintained connector and remove country-specific duplication; country-specific external gates such as Brazil transport reliability or Chile credentials must not freeze independent shared-family hardening."),
    _q("Q080_EVIDENCE_GRAPH_V1", "Proof / Evidence Graph v1", "COMMAND", "QUEUED", "PRODUCTION",
       ("Q020_SIGNAL_CONTRACT_V1",),
       "Material recommendations need traceable WHY / SHOW ME / WHAT IF evidence before higher autonomy is safe."),
'''
          new = '''    _q("Q070_SHARED_FAMILIES", "Harden TED/eForms and OCDS shared-coverage families", "SIGNAL", "DONE", "PRODUCTION",
       ("Q040_CANADA_BUYS", "Q050_US_SAM"),
       "Canonical TED/eForms/OCDS family fitness registry, immutable architecture contracts, shared family runtime composition, runtime deduplication across Germany/Estonia/Ecuador/UK and exact-head Python+Mobile CI completed; materially different transports remain intentionally separate."),
    _q("Q080_EVIDENCE_GRAPH_V1", "Proof / Evidence Graph v1", "COMMAND", "ACTIVE", "PRODUCTION",
       ("Q020_SIGNAL_CONTRACT_V1",),
       "Material recommendations need traceable WHY / SHOW ME / WHAT IF evidence before higher autonomy is safe."),
'''
          if old not in s:
              raise SystemExit('Q070/Q080 queue block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('test_master_execution_queue.py')
          s = p.read_text()
          if 'CURRENT_ITEM_ID == "Q070_SHARED_FAMILIES"' not in s:
              raise SystemExit('master queue active expectation not found')
          s = s.replace('CURRENT_ITEM_ID == "Q070_SHARED_FAMILIES"', 'CURRENT_ITEM_ID == "Q080_EVIDENCE_GRAPH_V1"', 1)
          old_test = '''def test_single_master_priority_continues_after_shared_families():
    ready = executable_after_current()
    assert ready == next_executable_after_current()
    assert "Q030_BR_PNCP_PCA" not in {item.id for item in ready}
    assert "Q060_CHILE_MERCADOPUBLICO" not in {item.id for item in ready}
    assert all(item.state == "QUEUED" for item in ready)
    assert ready[0].id == "Q080_EVIDENCE_GRAPH_V1"
    assert next_item_after_current().id == "Q080_EVIDENCE_GRAPH_V1"
'''
          new_test = '''def test_single_master_priority_continues_after_evidence_graph():
    ready = executable_after_current()
    assert ready == next_executable_after_current()
    assert "Q030_BR_PNCP_PCA" not in {item.id for item in ready}
    assert "Q060_CHILE_MERCADOPUBLICO" not in {item.id for item in ready}
    assert all(item.state == "QUEUED" for item in ready)
    assert ready[0].id == "Q090_COMPANY_STATE_CONTRACT"
    assert next_item_after_current().id == "Q090_COMPANY_STATE_CONTRACT"
'''
          if old_test not in s:
              raise SystemExit('master queue next expectation block not found')
          s = s.replace(old_test, new_test, 1)
          marker = '    assert "Q030_BR_PNCP_PCA" not in items["Q070_SHARED_FAMILIES"].dependencies\n'
          if marker not in s:
              raise SystemExit('shared-family gate assertion marker missing')
          s = s.replace(marker, marker + '    assert items["Q070_SHARED_FAMILIES"].state == "DONE"\n    assert items["Q080_EVIDENCE_GRAPH_V1"].state == "ACTIVE"\n', 1)
          p.write_text(s)

          p = Path('test_architecture_guardrail_queue.py')
          s = p.read_text()
          s = s.replace('assert CURRENT_ITEM_ID == "Q070_SHARED_FAMILIES"', 'assert items["Q070_SHARED_FAMILIES"].state == "DONE"\n    assert CURRENT_ITEM_ID == "Q080_EVIDENCE_GRAPH_V1"', 1)
          s = s.replace('assert executable_after_current()[0].id == "Q080_EVIDENCE_GRAPH_V1"', 'assert executable_after_current()[0].id == "Q090_COMPANY_STATE_CONTRACT"', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master_execution_queue.py test_master_execution_queue.py test_architecture_guardrail_queue.py
          git diff --cached --quiet || git commit -m "chore(queue): complete Q070 and activate Q080"
          git push origin HEAD:codex/q070-shared-families
