name: Founder Control Center

on:
  pull_request:
    paths:
      - 'founder_control_center/**'
      - '.github/workflows/founder-control-center.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q founder_control_center
      - run: python -m unittest discover -s founder_control_center/tests -v
