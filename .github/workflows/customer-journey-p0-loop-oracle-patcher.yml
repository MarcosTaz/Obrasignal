name: Customer Journey P0 Loop Oracle Patcher

on:
  push:
    branches:
      - integration/customer-journey-current-20260828

permissions:
  contents: write

jobs:
  patch-p0-loop-oracle:
    if: github.ref == 'refs/heads/integration/customer-journey-current-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Scope no-retry assertion to writeWhenReady body
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/p0-regressions.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  assert.doesNotMatch(api, /writeWhenReady[\\s\\S]*for\\s*\\(/);"
          new = "  const writeBody = api.match(/async function writeWhenReady\\(path,options=\\{\\}\\)\\{([\\s\\S]*?)\\n\\}/)?.[1] || '';\n  assert.ok(writeBody);\n  assert.doesNotMatch(writeBody, /for\\s*\\(|while\\s*\\(|attempt\\s*[+\\-]=/);"
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected broad no-retry assertion not found; refusing fuzzy rewrite')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet -- mobile/p0-regressions.test.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/p0-regressions.test.mjs
          git commit -m 'test(mobile): scope P0 write retry oracle'
          git push origin HEAD:integration/customer-journey-current-20260828
