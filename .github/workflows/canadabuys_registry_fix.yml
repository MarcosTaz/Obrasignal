name: Apply CanadaBuys Registry Metadata Fix

on:
  push:
    branches:
      - codex/canadabuys-production
    paths:
      - .github/workflows/canadabuys_registry_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canadabuys-production
      - run: python scripts/fix_canadabuys_registry_metadata.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source_registry.py
          git commit -m "Align CanadaBuys registry with publisher cadence"
          git push origin HEAD:codex/canadabuys-production
