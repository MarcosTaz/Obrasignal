name: CanadaBuys Live Gate

on:
  push:
    branches:
      - codex/canadabuys-production
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Validate live CanadaBuys production connector path
        env:
          OBRASIGNAL_LIVE_CANADABUYS: '1'
        run: PYTHONPATH=. python -m pytest -q test_canada_buys_live_contract.py
