name: ObraSignal UK Contracts Finder daily CSV extraction

on:
  push:
    branches: [ops/prospect-universe-50k]
    paths:
      - 'ops/prospecting/build_uk_contracts_finder_daily_csv.py'
      - 'ops/prospecting/run_uk_contracts_finder_month.py'
      - '.github/workflows/prospect-universe-uk-cf-daily.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract August UK supplier universe
        env:
          OUT_DIR: uk_cf_daily_output
        run: |
          cd ops/prospecting
          python run_uk_contracts_finder_month.py
      - uses: actions/upload-artifact@v4
        with:
          name: obrasignal-uk-contracts-finder-recent
          path: ops/prospecting/uk_cf_daily_output/*
          if-no-files-found: error
          retention-days: 30
