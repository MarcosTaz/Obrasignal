name: ObraSignal UK Contracts Finder daily CSV extraction

on:
  push:
    branches: [ops/prospect-universe-50k]
    paths:
      - 'ops/prospecting/build_uk_contracts_finder_daily_csv.py'
      - '.github/workflows/prospect-universe-uk-cf-daily.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract recent UK supplier universe
        env:
          CF_START_DATE: '2026-08-29'
          CF_END_DATE: '2026-08-29'
          OUT_DIR: uk_cf_daily_output
        run: python ops/prospecting/build_uk_contracts_finder_daily_csv.py
      - uses: actions/upload-artifact@v4
        with:
          name: obrasignal-uk-contracts-finder-recent
          path: uk_cf_daily_output/*
          retention-days: 30
