name: Run Q070 Promotion
on:
  push:
    branches:
      - codex/q070-shared-families
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/q070-shared-families
      - run: python tools/apply_q070_promotion.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master_execution_queue.py test_master_execution_queue.py test_architecture_guardrail_queue.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(queue): complete Q070 and activate Q080"
            git push origin HEAD:codex/q070-shared-families
          fi
