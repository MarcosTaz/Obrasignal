name: Debug Queue Promotion

on:
  push:
    branches: [codex/us-sam-q050]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest
      - name: Capture repository test failure
        shell: bash
        run: |
          set +e
          pytest -q > queue-promotion-debug.txt 2>&1
          echo "$?" > queue-promotion-exit.txt
          cat queue-promotion-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: queue-promotion-debug
          path: |
            queue-promotion-debug.txt
            queue-promotion-exit.txt
