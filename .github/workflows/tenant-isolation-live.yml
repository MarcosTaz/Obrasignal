name: ObraSignal Live Tenant Isolation

on:
  workflow_run:
    workflows: ["ObraSignal Production Smoke"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "11 3 * * 5"

permissions:
  contents: read

concurrency:
  group: live-tenant-isolation
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  E2E_EMAIL_B: ${{ secrets.E2E_EMAIL_B }}
  E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
  API_URL: https://obrasignal.onrender.com/api/v1
  TARGET_BUILD: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  adversarial-a-b:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate isolation probes
        run: python -m py_compile scripts/live_tenant_isolation_e2e.py scripts/live_tenant_isolation_runner.py scripts/provision_ephemeral_tenant.py

      - name: Provision a real second provider identity when B secrets are absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${E2E_EMAIL_B:-}" ] && [ -n "${E2E_PASSWORD_B:-}" ]; then
            echo "Using dedicated permanent tenant B credentials."
          else
            python scripts/provision_ephemeral_tenant.py
          fi

      - name: Prove two-tenant production isolation
        run: python scripts/live_tenant_isolation_runner.py
