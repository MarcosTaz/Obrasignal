name: ObraSignal Radar Production Readiness

on:
  push:
    branches: [main]
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-production-readiness
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  API_URL: https://obrasignal.onrender.com/api/v1

jobs:
  populated-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Authenticate production probe
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_KEY E2E_EMAIL E2E_PASSWORD; do
            test -n "${!name}" || { echo "Missing required production probe secret: $name"; exit 1; }
          done
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )"
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' \
            --data "$BODY" > /tmp/auth.json
          python - <<'PY'
          import json
          token=json.load(open('/tmp/auth.json', encoding='utf-8')).get('access_token')
          assert token
          open('/tmp/access_token','w',encoding='utf-8').write(token)
          PY

      - name: Require exact production build and first-value Radar
        env:
          TARGET_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $(cat /tmp/access_token)"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "$API_URL/health" > /tmp/health.json \
              && TARGET_BUILD="$TARGET_BUILD" python - <<'PY'
          import json, os
          h=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert h.get('ok') is True
          assert h.get('build') == os.environ['TARGET_BUILD']
          PY
            then
              echo "Exact production build is live."
              break
            fi
            test "$attempt" != 30 || { echo "Exact production build never became live."; exit 1; }
            sleep 10
          done

          # The default customer UI starts at 60+ relevance. A generic corpus
          # below that threshold is not first value, so production is green only
          # when the authenticated probe has at least one genuinely visible item.
          for attempt in $(seq 1 36); do
            stats_status="$(curl --silent --show-error --output /tmp/stats.json --write-out '%{http_code}' --max-time 30 -H "$AUTH" "$API_URL/stats" || true)"
            opp_status="$(curl --silent --show-error --output /tmp/opportunities.json --write-out '%{http_code}' --max-time 30 -H "$AUTH" "$API_URL/opportunities?limit=1&minscore=60" || true)"
            if test "$stats_status" = "200" && test "$opp_status" = "200" \
              && python - <<'PY'
          import json
          stats=json.load(open('/tmp/stats.json', encoding='utf-8'))
          opportunities=json.load(open('/tmp/opportunities.json', encoding='utf-8'))
          items=opportunities.get('items') or []
          assert stats.get('account_id') == opportunities.get('account_id')
          assert stats.get('last_sync')
          assert int(stats.get('total') or 0) > 0
          assert int(stats.get('relevant60') or 0) > 0
          assert len(items) > 0
          item=items[0]
          assert item.get('id')
          assert item.get('source')
          assert item.get('title')
          score=item.get('decision_score') if item.get('decision_score') is not None else item.get('score')
          assert float(score or 0) >= 60
          print('radar_total=' + str(stats.get('total')))
          print('radar_relevant60=' + str(stats.get('relevant60')))
          print('last_sync=' + str(stats.get('last_sync')))
          print('sample_source=' + str(item.get('source')))
          print('sample_score=' + str(score))
          PY
            then
              echo "Authenticated production Radar has first-value opportunities at the default relevance threshold."
              exit 0
            fi
            echo "Waiting for first-value production Radar (attempt $attempt/36; stats=$stats_status opportunities=$opp_status)…"
            sleep 10
          done

          echo "Production Radar remained empty, unsynchronized, or below the default relevance threshold."
          echo "stats:"
          cat /tmp/stats.json 2>/dev/null || true
          echo
          echo "opportunities:"
          cat /tmp/opportunities.json 2>/dev/null || true
          echo
          echo "Safe score diagnostics (no profile text or credentials):"
          profile_status="$(curl --silent --show-error --output /tmp/profile.json --write-out '%{http_code}' --max-time 30 -H "$AUTH" "$API_URL/profile" || true)"
          top_status="$(curl --silent --show-error --output /tmp/top.json --write-out '%{http_code}' --max-time 30 -H "$AUTH" "$API_URL/opportunities?limit=20&minscore=0" || true)"
          PROFILE_STATUS="$profile_status" TOP_STATUS="$top_status" python - <<'PY'
          import json, os

          print('profile_http=' + os.environ.get('PROFILE_STATUS', ''))
          if os.environ.get('PROFILE_STATUS') == '200':
              payload=json.load(open('/tmp/profile.json', encoding='utf-8'))
              profile=payload.get('profile') or {}
              summary={
                  'has_name': bool(str(profile.get('name') or '').strip()),
                  'has_activity': bool(str(profile.get('activity') or '').strip()),
                  'contract_interest_count': len(profile.get('contract_interests') or []),
                  'service_count': len(profile.get('services') or []),
                  'capability_tag_count': len(profile.get('capability_tags') or []),
                  'keyword_count': len(profile.get('keywords') or []),
                  'cpv_prefix_count': len(profile.get('cpv_prefixes') or []),
                  'country_count': len(profile.get('countries') or []),
                  'region_count': len(profile.get('regions') or []),
                  'has_min_value': profile.get('min_value') is not None,
                  'has_max_value': profile.get('max_value') is not None,
              }
              print('profile_shape=' + json.dumps(summary, sort_keys=True))

          print('top_http=' + os.environ.get('TOP_STATUS', ''))
          if os.environ.get('TOP_STATUS') == '200':
              payload=json.load(open('/tmp/top.json', encoding='utf-8'))
              items=payload.get('items') or []
              print('top_count=' + str(len(items)))
              for rank, item in enumerate(items, 1):
                  cap=item.get('capability_evidence') or {}
                  cpv=item.get('cpv_evidence') or {}
                  score=item.get('decision_score') if item.get('decision_score') is not None else item.get('score')
                  diagnostic={
                      'rank': rank,
                      'source': item.get('source'),
                      'external_id': item.get('external_id'),
                      'score': score,
                      'decision': item.get('account_decision'),
                      'profile_score': item.get('profile_score'),
                      'lot_score': item.get('lot_score'),
                      'capability_status': cap.get('status'),
                      'capability_matched': bool(cap.get('matched')),
                      'capability_evidence_count': int(cap.get('evidence_count') or 0),
                      'cpv_status': cpv.get('status'),
                      'cpv_strength': cpv.get('strength'),
                      'blocker_count': len(item.get('hard_capability_blockers') or []),
                      'country': item.get('country'),
                      'cpv_present': bool(str(item.get('cpv') or '').strip()),
                      'description_present': bool(str(item.get('description') or '').strip()),
                  }
                  print('top_item=' + json.dumps(diagnostic, sort_keys=True))
          PY
          exit 1
