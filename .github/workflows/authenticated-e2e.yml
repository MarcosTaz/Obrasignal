name: ObraSignal Authenticated E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

concurrency:
  group: authenticated-e2e
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  API_URL: https://obrasignal.onrender.com/api/v1

jobs:
  authenticated-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Require E2E credentials
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_KEY E2E_EMAIL E2E_PASSWORD; do
            test -n "${!name}" || { echo "Missing required E2E secret: $name"; exit 1; }
          done

      - name: Preflight Supabase Auth configuration
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          status="$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" \
            "$BASE_URL/auth/v1/settings")"
          test "$status" = "200" || { echo "Supabase Auth settings probe failed with HTTP $status."; exit 1; }
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/settings.json'))
          external=payload.get('external') or {}
          print(json.dumps({
              'email_provider_enabled': external.get('email'),
              'autoconfirm': payload.get('autoconfirm'),
              'disable_signup': payload.get('disable_signup'),
          }, ensure_ascii=False))
          PY

      - name: Authenticate against Supabase
        run: |
          set -euo pipefail
          echo "Running current authenticated E2E workflow revision."
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          AUTH_URL="${BASE_URL}/auth/v1/token?grant_type=password"
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )"

          # New Supabase publishable keys are API keys, not user JWTs. The
          # documented API-key-only form avoids making the gateway interpret
          # the publishable key as a bearer token.
          status="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$AUTH_URL" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$BODY")"

          if [ "$status" != "200" ]; then
            echo "Supabase authentication (apikey-only) failed with HTTP $status."
            python - <<'PY'
          import json
          try:
              payload=json.load(open('/tmp/auth.json'))
          except Exception:
              payload={}
          safe={k: payload.get(k) for k in ('error','error_code','msg','message') if payload.get(k)}
          print(json.dumps(safe, ensure_ascii=False))
          PY
            exit 1
          fi

          python - <<'PY'
          import json
          payload=json.load(open('/tmp/auth.json'))
          token=payload.get('access_token')
          assert token, 'Supabase did not return an access token'
          open('/tmp/access_token','w').write(token)
          print('Supabase authentication succeeded.')
          PY

      - name: Verify unauthenticated boundary
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/unauth-body --write-out '%{http_code}' --max-time 30 "$API_URL/profile")"
          test "$status" = "401"
          grep -q 'authentication_required' /tmp/unauth-body

      - name: Verify malformed bearer boundary
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/bad-token-body --write-out '%{http_code}' --max-time 30 \
            -H 'Authorization: Bearer definitely-not-a-jwt' "$API_URL/profile")"
          test "$status" = "401"
          grep -q 'authentication_required' /tmp/bad-token-body

      - name: Verify authenticated API identity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            "$API_URL/profile" > /tmp/profile.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/profile.json'))
          assert payload.get('authenticated') is True
          assert payload.get('account_id')
          assert isinstance(payload.get('profile'), dict)
          print('Authenticated API identity verified for account:', payload['account_id'])
          PY

      - name: Verify authenticated profile persistence round-trip
        run: |
          set -euo pipefail
          cp /tmp/profile.json /tmp/profile-original-response.json
          python - <<'PY'
          import json, uuid
          payload=json.load(open('/tmp/profile.json'))
          profile=payload['profile']
          marker=f"__e2e_{uuid.uuid4().hex[:12]}"
          profile['keywords']=list(profile.get('keywords') or [])+[marker]
          json.dump(profile, open('/tmp/profile-write.json','w'), ensure_ascii=False)
          json.dump({'marker':marker}, open('/tmp/profile-marker.json','w'))
          PY
          restore_profile() {
            python - <<'PY'
          import json
          payload=json.load(open('/tmp/profile-original-response.json'))
          json.dump(payload.get('profile') or {}, open('/tmp/profile-restore.json','w'), ensure_ascii=False)
          PY
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$API_URL/profile" \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/profile-restore.json >/tmp/profile-restore-response.json
          }
          trap restore_profile EXIT
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$API_URL/profile" \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/profile-write.json >/tmp/profile-write-response.json
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            "$API_URL/profile" >/tmp/profile-after-write.json
          python - <<'PY'
          import json
          marker=json.load(open('/tmp/profile-marker.json'))['marker']
          payload=json.load(open('/tmp/profile-after-write.json'))
          assert marker in (payload.get('profile') or {}).get('keywords', [])
          assert payload.get('authenticated') is True
          print('Authenticated profile write/read persistence verified.')
          PY

      - name: Verify authenticated opportunity access and account scoping
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $(cat /tmp/access_token)" \
            "$API_URL/opportunities?limit=1" > /tmp/opportunities.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/opportunities.json'))
          assert isinstance(payload.get('items'), list)
          assert payload.get('account_id')
          assert payload['account_id'] != ''
          print('Authenticated opportunity access verified.')
          PY

      - name: Verify authenticated stats and workflow stats
        run: |
          set -euo pipefail
          for endpoint in stats workflow/stats; do
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              "$API_URL/$endpoint" > "/tmp/$(echo "$endpoint" | tr / /_).json"
          done
          python - <<'PY'
          import json
          stats=json.load(open('/tmp/stats.json'))
          workflow=json.load(open('/tmp/workflow_stats.json'))
          assert stats.get('account_id')
          assert workflow.get('account_id') == stats['account_id']
          assert isinstance(workflow.get('counts'), dict)
          print('Account-scoped stats verified.')
          PY

      - name: Verify detail and workflow round-trip when data exists
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          items=json.load(open('/tmp/opportunities.json')).get('items') or []
          if not items:
              print('No opportunity available; detail/workflow round-trip skipped without treating empty data as failure.')
              open('/tmp/tender_id','w').write('')
          else:
              tender_id=str(items[0]['id'])
              open('/tmp/tender_id','w').write(tender_id)
          PY
          if test -s /tmp/tender_id; then
            ID="$(cat /tmp/tender_id)"
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              "$API_URL/opportunities/$ID" > /tmp/detail.json
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              "$API_URL/opportunities/$ID/workflow" > /tmp/workflow.json
            python - <<'PY'
          import json
          detail=json.load(open('/tmp/detail.json'))
          workflow=json.load(open('/tmp/workflow.json'))
          assert detail.get('id')
          assert isinstance(detail.get('workflow'), dict)
          assert workflow.get('status') in {'NEW','REVIEWING','PREPARING','SUBMITTED','WON','LOST'}
          print('Authenticated detail and workflow read verified.')
          PY
            python - <<'PY'
          import json
          workflow=json.load(open('/tmp/workflow.json'))
          json.dump(workflow, open('/tmp/workflow-original.json','w'))
          PY
            restore_workflow() {
              python - <<'PY'
          import json
          w=json.load(open('/tmp/workflow-original.json'))
          json.dump({'status':w.get('status','NEW'),'note':w.get('note')}, open('/tmp/workflow-restore.json','w'))
          PY
              curl --fail --silent --show-error --max-time 30 \
                -X POST "$API_URL/opportunities/$ID/workflow" \
                -H "Authorization: Bearer $(cat /tmp/access_token)" \
                -H 'Content-Type: application/json' \
                --data-binary @/tmp/workflow-restore.json >/tmp/workflow-restore-response.json
            }
            trap restore_workflow EXIT
            python - <<'PY'
          import json
          w=json.load(open('/tmp/workflow-original.json'))
          next_status='REVIEWING' if w.get('status') != 'REVIEWING' else 'PREPARING'
          json.dump({'status':next_status,'note':'__e2e_roundtrip__'}, open('/tmp/workflow-write.json','w'))
          PY
            curl --fail --silent --show-error --max-time 30 \
              -X POST "$API_URL/opportunities/$ID/workflow" \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/workflow-write.json >/tmp/workflow-write-response.json
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $(cat /tmp/access_token)" \
              "$API_URL/opportunities/$ID/workflow" >/tmp/workflow-after-write.json
            python - <<'PY'
          import json
          expected=json.load(open('/tmp/workflow-write.json'))
          actual=json.load(open('/tmp/workflow-after-write.json'))
          assert actual.get('status') == expected['status']
          assert actual.get('note') == expected['note']
          print('Authenticated workflow write/read persistence verified.')
          PY
          fi
