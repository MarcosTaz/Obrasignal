name: ObraSignal Authenticated E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

# Shares E2E_EMAIL with Radar Production Readiness and temporarily mutates the
# profile before restoring it. Serialize all such probes so cleanup can never
# restore stale profile state over another production test's deliberate save.
concurrency:
  group: obrasignal-production-e2e-account
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  API_URL: https://obrasignal.onrender.com/api/v1

jobs:
  authenticated-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact production build
        env:
          TARGET_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/health" > /tmp/health.json \
              && TARGET_BUILD="$TARGET_BUILD" python - <<'PY'
          import json, os
          health=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health.get('ok') is True
          assert health.get('service') == 'obrasignal-api'
          assert health.get('build') == os.environ['TARGET_BUILD']
          PY
            then
              echo "Exact production build ready on attempt $attempt/24."
              exit 0
            fi
            test "$attempt" != 24 || { echo "Production never served exact target build."; exit 1; }
            sleep 10
          done

      - name: Verify authenticated production contract
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_KEY E2E_EMAIL E2E_PASSWORD; do
            test -n "${!name}" || { echo "Missing required E2E secret: $name"; exit 1; }
          done

          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"

          settings_status="$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" "$BASE_URL/auth/v1/settings")"
          test "$settings_status" = "200"

          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )"
          auth_status="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "$BODY")"
          test "$auth_status" = "200"
          python - <<'PY'
          import json
          token=json.load(open('/tmp/auth.json', encoding='utf-8')).get('access_token')
          assert token
          open('/tmp/access_token','w',encoding='utf-8').write(token)
          PY
          AUTH="Authorization: Bearer $(cat /tmp/access_token)"

          unauth_status="$(curl --silent --output /tmp/unauth.json --write-out '%{http_code}' --max-time 30 "$API_URL/profile")"
          test "$unauth_status" = "401"
          grep -q 'authentication_required' /tmp/unauth.json
          malformed_status="$(curl --silent --output /tmp/malformed.json --write-out '%{http_code}' --max-time 30 \
            -H 'Authorization: Bearer definitely-not-a-jwt' "$API_URL/profile")"
          test "$malformed_status" = "401"
          grep -q 'authentication_required' /tmp/malformed.json

          curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/profile" > /tmp/profile-original-response.json
          python - <<'PY'
          import json, uuid
          payload=json.load(open('/tmp/profile-original-response.json', encoding='utf-8'))
          assert payload.get('authenticated') is True
          assert payload.get('account_id')
          assert isinstance(payload.get('profile'), dict)
          profile=dict(payload['profile'])
          marker=f"__e2e_{uuid.uuid4().hex[:12]}"
          profile['keywords']=list(profile.get('keywords') or [])+[marker]
          json.dump(profile, open('/tmp/profile-write.json','w',encoding='utf-8'), ensure_ascii=False)
          json.dump(payload['profile'], open('/tmp/profile-restore.json','w',encoding='utf-8'), ensure_ascii=False)
          json.dump({'marker':marker}, open('/tmp/profile-marker.json','w',encoding='utf-8'))
          PY

          cleanup() {
            set +e
            if test -s /tmp/profile-restore.json; then
              curl --silent --show-error --max-time 30 -X POST "$API_URL/profile" -H "$AUTH" -H 'Content-Type: application/json' \
                --data-binary @/tmp/profile-restore.json >/tmp/profile-restore-response.json
            fi
            if test -s /tmp/workflow-original.json && test -s /tmp/tender_id; then
              ID="$(cat /tmp/tender_id)"
              python - <<'PY'
          import json
          w=json.load(open('/tmp/workflow-original.json', encoding='utf-8'))
          json.dump({'status':w['status'],'note':w.get('note')}, open('/tmp/workflow-restore.json','w',encoding='utf-8'))
          PY
              curl --silent --show-error --max-time 30 -X POST "$API_URL/opportunities/$ID/workflow" \
                -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/workflow-restore.json >/tmp/workflow-restore-response.json
            fi
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --max-time 30 -X POST "$API_URL/profile" -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @/tmp/profile-write.json >/tmp/profile-write-response.json
          curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/profile" > /tmp/profile-after-write.json
          python - <<'PY'
          import json
          marker=json.load(open('/tmp/profile-marker.json', encoding='utf-8'))['marker']
          payload=json.load(open('/tmp/profile-after-write.json', encoding='utf-8'))
          assert marker in (payload.get('profile') or {}).get('keywords', [])
          assert payload.get('authenticated') is True
          PY

          curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/opportunities?limit=1" > /tmp/opportunities.json
          curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/stats" > /tmp/stats.json
          curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/workflow/stats" > /tmp/workflow-stats.json
          python - <<'PY'
          import json
          opportunities=json.load(open('/tmp/opportunities.json', encoding='utf-8'))
          stats=json.load(open('/tmp/stats.json', encoding='utf-8'))
          workflow_stats=json.load(open('/tmp/workflow-stats.json', encoding='utf-8'))
          assert isinstance(opportunities.get('items'), list)
          assert opportunities.get('account_id')
          assert stats.get('account_id') == opportunities['account_id']
          assert workflow_stats.get('account_id') == opportunities['account_id']
          assert isinstance(workflow_stats.get('counts'), dict)
          items=opportunities.get('items') or []
          open('/tmp/tender_id','w',encoding='utf-8').write(str(items[0]['id']) if items else '')
          PY

          if test -s /tmp/tender_id; then
            ID="$(cat /tmp/tender_id)"
            curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/opportunities/$ID" > /tmp/detail.json
            curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/opportunities/$ID/workflow" > /tmp/workflow-envelope.json
            python - <<'PY'
          import json
          allowed={'NEW','REVIEWING','PREPARING','SUBMITTED','WON','LOST'}
          detail=json.load(open('/tmp/detail.json', encoding='utf-8'))
          envelope=json.load(open('/tmp/workflow-envelope.json', encoding='utf-8'))
          workflow=envelope.get('workflow')
          assert detail.get('id')
          assert isinstance(detail.get('workflow'), dict)
          assert isinstance(workflow, dict)
          assert workflow.get('status') in allowed
          assert detail['workflow'].get('status') == workflow.get('status')
          json.dump(workflow, open('/tmp/workflow-original.json','w',encoding='utf-8'))
          next_status='REVIEWING' if workflow.get('status') != 'REVIEWING' else 'PREPARING'
          json.dump({'status':next_status,'note':'__e2e_roundtrip__'}, open('/tmp/workflow-write.json','w',encoding='utf-8'))
          PY
            curl --fail --silent --show-error --max-time 30 -X POST "$API_URL/opportunities/$ID/workflow" \
              -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/workflow-write.json > /tmp/workflow-write-response.json
            curl --fail --silent --show-error --max-time 30 -H "$AUTH" "$API_URL/opportunities/$ID/workflow" > /tmp/workflow-after-write.json
            python - <<'PY'
          import json
          expected=json.load(open('/tmp/workflow-write.json', encoding='utf-8'))
          write_envelope=json.load(open('/tmp/workflow-write-response.json', encoding='utf-8'))
          read_envelope=json.load(open('/tmp/workflow-after-write.json', encoding='utf-8'))
          written=write_envelope.get('workflow') or {}
          actual=read_envelope.get('workflow') or {}
          assert write_envelope.get('ok') is True
          assert written.get('status') == expected['status']
          assert actual.get('status') == expected['status']
          assert actual.get('note') == expected['note']
          PY
          else
            echo "No opportunity available; bounded detail/workflow mutation skipped."
          fi

          echo "Authenticated production contract PASS."
