name: Apply Monetization Addendum

on:
  push:
    branches:
      - codex/canadabuys-production
    paths:
      - .github/workflows/monetization_adenda_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canadabuys-production
      - name: Add gated monetization item to the single master queue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('master_execution_queue.py')
          text = path.read_text()
          needle = '''    _q("Q230_VALUE_CREATED", "Measured and estimated Value Created framework", "COMMAND", "GATED", "PROTOTYPE",\n       ("Q100_OUTCOME_GRAPH_V1", "Q170_COMMAND_NEXT_BEST_ACTION"),\n       "Quantify legitimate opportunity, sourcing, mobilization, liquidity, risk-avoidance and idle-capacity recovery value without fabricated ROI or double counting."),\n'''
          addition = needle + '''    _q("Q237_TRANSACTION_MONETIZATION_ARCHITECTURE", "Trust-aligned ancillary revenue and transaction monetization architecture", "STRATEGY", "GATED", "RESEARCH",\n       ("Q218_TRADE_LOOP_PILOT", "Q235_MICROWORKS_ACTION_PILOT", "Q230_VALUE_CREATED"),\n       "Preserve modular Quote/Supplier/Transaction/Referral/Partner/Commission/FinancingRoute/InsuranceRoute/Booking/Conversion contracts and test SaaS→transaction→partner→network monetization only after measurable customer value. No pay-to-rank; commercial compensation must be technically separated from recommendation economics, auditable, disclosure-capable and legally gated."),\n'''
          if 'Q237_TRANSACTION_MONETIZATION_ARCHITECTURE' in text:
              raise SystemExit('queue item already present')
          if needle not in text:
              raise SystemExit('canonical insertion point not found')
          path.write_text(text.replace(needle, addition, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add master_execution_queue.py
          git commit -m "Register gated transaction monetization architecture"
          git push origin HEAD:codex/canadabuys-production
