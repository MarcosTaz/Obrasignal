name: Qatar Ashghal Live Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'qatar_ashghal.py'
      - 'test_qatar_ashghal.py'
      - 'source_registry.py'
      - '.github/workflows/qatar_ashghal_live.yml'

env:
  OBRASIGNAL_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OBRASIGNAL_TEST_SHA }}
      - name: Confirm exact revision under test
        run: test "$(git rev-parse HEAD)" = "$OBRASIGNAL_TEST_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3'
      - name: Fetch parse filter identity normalize
        run: |
          python - <<'PY'
          from qatar_ashghal import fetch_open_tenders, normalize_construction_tenders

          raw = fetch_open_tenders(timeout=20)
          assert raw, 'official source returned no parsed tenders'
          signals = normalize_construction_tenders(raw)
          assert signals, 'no construction/public-works signals classified'
          ids = [s['external_id'] for s in signals]
          assert len(ids) == len(set(ids)), 'publisher identity collision'
          for signal in signals:
              assert signal['source'] == 'QA_ASHGHAL'
              assert signal['signal_type'] == 'TENDER'
              assert signal['source_reference'] == signal['external_id']
              assert signal['country'] == 'QAT'
              assert signal['title']
              assert signal['publication_date']
              assert signal['deadline']
          print(f'LIVE_OK raw={len(raw)} construction={len(signals)} sample={ids[:5]}')
          PY
