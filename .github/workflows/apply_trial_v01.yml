name: Apply Trial v0.1

on:
  push:
    branches: [codex/trial-policy-v01]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/trial-policy-v01
      - name: Apply value-aware evaluation integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing patch target in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count))

          p=Path('account_registry.py')
          s=p.read_text()
          s=s.replace("from auth_context import configured_identity, InvalidTokenError\n", "from auth_context import configured_identity, InvalidTokenError\nfrom evaluation_policy import (\n    ensure_evaluation_schema, evaluation_access_state, evaluation_summary, evaluation_metrics,\n    mark_evaluation_paid, mark_post_conversion_churn,\n)\n")
          s=s.replace("    for name, statement in migrations.items():\n        if name not in columns:\n            conn.execute(statement)\n    conn.commit()\n", "    for name, statement in migrations.items():\n        if name not in columns:\n            conn.execute(statement)\n    ensure_evaluation_schema(conn)\n    conn.commit()\n",1)
          s=s.replace("def ensure_account(conn, account_id, status='active', plan='pilot'):", "def ensure_account(conn, account_id, status='active', plan='evaluation'):")
          old="""    trial_ends_at = (now + timedelta(days=14)).isoformat()\n    conn.execute(\n        \"\"\"INSERT INTO accounts(account_id, status, plan, created_at, trial_ends_at, subscription_status)\n           VALUES(?, ?, ?, ?, ?, 'trial')\"\"\",\n        (account_id, status, plan, now.isoformat(), trial_ends_at),\n    )\n"""
          new="""    conn.execute(\n        \"\"\"INSERT INTO accounts(account_id, status, plan, created_at, subscription_status,\n           evaluation_type, evaluation_status, evaluation_value_status)\n           VALUES(?, ?, ?, ?, 'none', 'self_service', 'ONBOARDING', 'EXPOSURE_PENDING')\"\"\",\n        (account_id, status, plan, now.isoformat()),\n    )\n"""
          if old not in s: raise SystemExit('ensure_account legacy trial block not found')
          s=s.replace(old,new,1)
          old="""    if account.get(\"plan\") == \"pilot\":\n        expires = account.get(\"trial_ends_at\")\n"""
          new="""    evaluation = evaluation_access_state(account, now=now)\n    if evaluation is not None:\n        return evaluation\n    # Backward compatibility: accounts created before Trial Policy v0.1 keep\n    # their original fixed legacy pilot window until an explicit migration.\n    if account.get(\"plan\") == \"pilot\":\n        expires = account.get(\"trial_ends_at\")\n"""
          if old not in s: raise SystemExit('subscription_state insertion target not found')
          s=s.replace(old,new,1)
          old="""         store, product_id, original_transaction_id, str(account_id)),\n    )\n    conn.commit()\n\n\ndef subscription_state"""
          new="""         store, product_id, original_transaction_id, str(account_id)),\n    )\n    if plan == 'pro' and subscription_status in {'active', 'trial', 'grace_period', 'cancelled'}:\n        mark_evaluation_paid(conn, account_id)\n    elif plan == 'expired' or subscription_status == 'expired':\n        mark_post_conversion_churn(conn, account_id)\n    conn.commit()\n\n\ndef subscription_state"""
          if old not in s: raise SystemExit('update_subscription target not found')
          s=s.replace(old,new,1)
          s=s.replace("'message': 'O período de acesso terminou. Ativa o ObraSignal Pro para continuar.'", "'message': 'A avaliação terminou. Ativa o ObraSignal Pro para continuar.'")
          old="""        state = subscription_state(account)\n        return jsonify({**state, 'account_id': identity.account_id, 'trial_ends_at': account.get('trial_ends_at'), 'management_url': None})\n"""
          new="""        state = subscription_state(account)\n        evaluation = evaluation_summary(conn, account)\n        metrics = evaluation_metrics(conn, account)\n        return jsonify({**state, 'account_id': identity.account_id,\n                        'trial_ends_at': account.get('trial_ends_at'),\n                        'evaluation': evaluation, 'evaluation_metrics': metrics,\n                        'management_url': None})\n"""
          if old not in s: raise SystemExit('billing_status target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('company_profile.py'); s=p.read_text()
          old="""    _persist_profile_db(normalized, account)\n\n    return normalized\n"""
          new="""    _persist_profile_db(normalized, account)\n    # A successfully validated and durably persisted company profile is the\n    # authoritative profile_ready event for the evaluation lifecycle.\n    try:\n        from account_registry import ensure_account\n        from evaluation_policy import record_evaluation_event\n        conn = _profile_db()\n        try:\n            ensure_account(conn, account)\n            record_evaluation_event(conn, account, 'profile_ready')\n        finally:\n            conn.close()\n    except Exception:\n        # Profile persistence must not fail because evaluation telemetry fails.\n        # The missing event remains observable/recoverable via billing status.\n        pass\n\n    return normalized\n"""
          if old not in s: raise SystemExit('company profile target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('opportunity_match_pipeline.py'); s=p.read_text()
          old="""    record_decision(\n        conn,\n        row.get(\"source\") or \"UNKNOWN\",\n"""
          new="""    record_decision(\n        conn,\n        row.get(\"source\") or \"UNKNOWN\",\n"""
          # insert lifecycle events just before final return, after decision durability
          marker="""    )\n    return evaluation\n"""
          addition="""    )\n    # Real normalized market data has reached the account-specific decision path.\n    # Only QUALIFIED/REVIEW produces the first relevant shortlist activation event.\n    try:\n        from account_registry import ensure_account\n        from evaluation_policy import record_evaluation_event\n        ensure_account(conn, account_id)\n        record_evaluation_event(conn, account_id, 'market_data_available', metadata={'source': row.get('source')})\n        if evaluation['decision'] in {'QUALIFIED', 'REVIEW'}:\n            record_evaluation_event(conn, account_id, 'first_shortlist_generated', metadata={\n                'source': row.get('source'),\n                'external_id': row.get('external_id') or str(row.get('id')),\n            })\n    except Exception:\n        # Decisioning remains primary; evaluation telemetry must degrade gracefully.\n        pass\n    return evaluation\n"""
          if marker not in s: raise SystemExit('opportunity pipeline return target not found')
          p.write_text(s.replace(marker,addition,1))

          p=Path('mobile/components/BillingGate.js'); s=p.read_text()
          s=s.replace("useState({ configured: false, pro: false, plan: 'pilot', expiresAt: null, managementUrl: null })", "useState({ configured: false, pro: false, plan: 'evaluation', expiresAt: null, managementUrl: null, evaluation: null, metrics: null })")
          s=s.replace("plan: server?.plan || (hasProEntitlement(info) ? 'pro' : 'pilot'),", "plan: server?.plan || (hasProEntitlement(info) ? 'pro' : 'evaluation'),")
          s=s.replace("managementUrl: info?.managementURL || null,\n      });", "managementUrl: info?.managementURL || null,\n        evaluation: server?.evaluation || null,\n        metrics: server?.evaluation_metrics || null,\n      });")
          s=s.replace("<Text style={styles.blockedTitle}>O período de teste terminou</Text>", "<Text style={styles.blockedTitle}>A avaliação terminou</Text>")
          s=s.replace("{expired ? <View style={styles.blocked}", "{expired ? <View style={styles.blocked}")
          old=""" : children}\n    {!expired && <Pressable style={styles.planPill} onPress={openPaywall} accessibilityRole=\"button\" accessibilityLabel=\"Plano ObraSignal\"><Text style={styles.planText}>{billing.pro ? 'PRO' : billing.plan === 'pilot' ? 'PILOT' : 'PLANO'}</Text></Pressable>}\n"""
          new=""" : <>{billing.plan === 'evaluation' && billing.evaluation ? <View style={styles.evalCard}>\n      <Text style={styles.evalTitle}>AVALIAÇÃO OBRASIGNAL</Text>\n      <Text style={styles.evalText}>{billing.evaluation.status === 'EVALUATION_ACTIVE' ? `${billing.evaluation.days_remaining} dias restantes` : 'A janela de 21 dias ainda não começou'}</Text>\n      <Text style={styles.evalMeta}>{billing.evaluation.activated_at ? `Começou em ${new Date(billing.evaluation.activated_at).toLocaleDateString()}` : 'Começa quando o perfil estiver pronto, houver dados de mercado e a primeira shortlist relevante for gerada.'}</Text>\n      <Text style={styles.evalMeta}>{billing.metrics?.exposure_event_count || 0} exposições de valor registadas · sem estimativas económicas inventadas</Text>\n    </View> : null}{children}</>}\n    {!expired && <Pressable style={styles.planPill} onPress={openPaywall} accessibilityRole=\"button\" accessibilityLabel=\"Plano ObraSignal\"><Text style={styles.planText}>{billing.pro ? 'PRO' : billing.plan === 'evaluation' ? 'AVALIAÇÃO' : billing.plan === 'pilot' ? 'PILOT LEGADO' : 'PLANO'}</Text></Pressable>}\n"""
          if old not in s: raise SystemExit('BillingGate render target not found')
          s=s.replace(old,new,1)
          s=s.replace("  planPill:{", "  evalCard:{margin:12,padding:12,borderRadius:12,backgroundColor:'#0D1B30',borderWidth:1,borderColor:'#355A8A'},\n  evalTitle:{fontSize:10,fontWeight:'900',letterSpacing:1,color:COLORS.blue},\n  evalText:{fontSize:15,fontWeight:'900',color:COLORS.text,marginTop:4},\n  evalMeta:{fontSize:10,lineHeight:15,color:COLORS.muted,marginTop:3},\n  planPill:{")
          p.write_text(s)

          p=Path('BILLING_SETUP.md'); s=p.read_text()
          section="""\n\n## ObraSignal Evaluation v0.1 — separate from store trials\n\nObraSignal's own evaluation access is not a Google Play/App Store subscription trial and must not be configured as one implicitly. New self-service accounts receive a 21-day value-aware evaluation **only after** `profile_ready + market_data_available + first_relevant_shortlist_generated`. Onboarding therefore does not consume evaluation days. Enterprise accounts may be explicitly configured for a 30-day assisted pilot. A controlled extension is capped at 7 days and is never granted merely for inactivity.\n\nRevenueCat continues to govern paid `pro` entitlement. Active paid entitlement takes precedence over evaluation state. Existing legacy pilot accounts keep their pre-v0.1 `trial_ends_at` window unless a separate migration is explicitly approved.\n\nDo not create a 21-day store free-trial offer merely because the ObraSignal Evaluation is 21 days. Store trials are a separate future commercial experiment and require their own price/renewal disclosures.\n\nTrial Policy v0.1 is **VALIDATION REQUIRED** and must be reviewed after 10 paying customers and again after 25 paying customers, or earlier if evidence clearly shows the baseline is wrong.\n"""
          if '## ObraSignal Evaluation v0.1' not in s: p.write_text(s+section)

          p=Path('master_execution_queue.py'); s=p.read_text()
          needle='''    _q("Q050_US_SAM", "SAM.gov federal construction opportunities connector", "SIGNAL", "ACTIVE", "PRODUCTION",\n'''
          item='''    _q("Q045_TRIAL_POLICY_V01", "21-day value-aware evaluation and enterprise pilot policy v0.1", "STRATEGY", "DONE", "PRODUCTION",\n       ("Q040_CANADA_BUYS",),\n       "Replace signup-clock legacy trial for new accounts with auditable value-aware activation, preserve legacy accounts and RevenueCat paid precedence; policy remains VALIDATION REQUIRED while Q050 stays ACTIVE."),\n'''
          if 'Q045_TRIAL_POLICY_V01' not in s:
              if needle not in s: raise SystemExit('master queue insertion target not found')
              p.write_text(s.replace(needle,item+needle,1))
          PY

          cat > tests/test_billing.py <<'PY'
          from datetime import datetime, timedelta, timezone
          import sqlite3
          import pytest

          from account_registry import ensure_account, get_account, subscription_state, update_subscription
          from evaluation_policy import (
              DEFAULT_EVALUATION_DAYS, ENTERPRISE_PILOT_DAYS, MAX_VALUE_EXTENSION_DAYS,
              configure_enterprise_pilot, evaluation_metrics, grant_evaluation_extension,
              record_evaluation_event,
          )

          def db():
              conn=sqlite3.connect(':memory:'); conn.row_factory=sqlite3.Row; return conn

          def activate(conn, account_id, *, base=None):
              base=base or datetime.now(timezone.utc)
              record_evaluation_event(conn, account_id, 'profile_ready', occurred_at=base)
              record_evaluation_event(conn, account_id, 'market_data_available', occurred_at=base+timedelta(seconds=1))
              return record_evaluation_event(conn, account_id, 'first_shortlist_generated', occurred_at=base+timedelta(seconds=2))

          def test_new_account_does_not_lose_days_during_onboarding():
              conn=db(); ensure_account(conn,'acct-new'); account=get_account(conn,'acct-new')
              assert account['trial_ends_at'] is None
              assert account['evaluation_activated_at'] is None
              assert account['evaluation_ends_at'] is None
              state=subscription_state(account)
              assert state['plan']=='evaluation' and state['active'] is True
              assert state['evaluation_status']=='ONBOARDING'

          def test_evaluation_activates_only_on_value_ready_condition_for_21_days():
              conn=db(); ensure_account(conn,'acct-eval')
              base=datetime(2026,8,25,10,0,tzinfo=timezone.utc)
              record_evaluation_event(conn,'acct-eval','profile_ready',occurred_at=base)
              record_evaluation_event(conn,'acct-eval','market_data_available',occurred_at=base+timedelta(seconds=1))
              assert get_account(conn,'acct-eval')['evaluation_activated_at'] is None
              summary=record_evaluation_event(conn,'acct-eval','first_shortlist_generated',occurred_at=base+timedelta(seconds=2))
              assert summary['status']=='EVALUATION_ACTIVE'
              start=datetime.fromisoformat(summary['activated_at'])
              end=datetime.fromisoformat(summary['ends_at'])
              assert end-start==timedelta(days=DEFAULT_EVALUATION_DAYS)
              assert summary['activation_reason']=='profile_ready+market_data_available+first_relevant_shortlist_generated'

          def test_paid_entitlement_is_not_overwritten_by_request_initialization():
              conn=db(); ensure_account(conn,'acct-paid')
              expires=(datetime.now(timezone.utc)+timedelta(days=30)).isoformat()
              update_subscription(conn,'acct-paid',plan='pro',subscription_status='active',entitlement_expires_at=expires,store='play_store',product_id='obrasignal_pro_monthly')
              ensure_account(conn,'acct-paid')
              state=subscription_state(get_account(conn,'acct-paid'))
              assert state['plan']=='pro' and state['active'] is True
              assert get_account(conn,'acct-paid')['evaluation_status']=='PAID'

          def test_expired_evaluation_is_blocked():
              conn=db(); ensure_account(conn,'acct-expired'); activate(conn,'acct-expired')
              past=(datetime.now(timezone.utc)-timedelta(seconds=1)).isoformat()
              conn.execute('UPDATE accounts SET evaluation_ends_at=? WHERE account_id=?',(past,'acct-expired')); conn.commit()
              state=subscription_state(get_account(conn,'acct-expired'))
              assert state['active'] is False and state['plan']=='expired'
              assert state['evaluation_status']=='EXPIRED'

          def test_extension_is_capped_and_inactive_user_is_not_eligible():
              conn=db(); ensure_account(conn,'acct-ext'); activate(conn,'acct-ext')
              with pytest.raises(ValueError,match='extension_not_eligible'):
                  grant_evaluation_extension(conn,'acct-ext',days=7,reason='inactive',real_usage=False,insufficient_value_exposure=True,user_inactive=True)
              out=grant_evaluation_extension(conn,'acct-ext',days=MAX_VALUE_EXTENSION_DAYS,reason='source coverage delayed',real_usage=True,insufficient_value_exposure=True,user_inactive=False)
              assert out['extension_days']==MAX_VALUE_EXTENSION_DAYS
              with pytest.raises(ValueError,match='extension_limit_exceeded'):
                  grant_evaluation_extension(conn,'acct-ext',days=1,reason='again',real_usage=True,insufficient_value_exposure=True)

          def test_enterprise_pilot_is_30_days_when_explicitly_configured():
              conn=db(); ensure_account(conn,'acct-enterprise'); configure_enterprise_pilot(conn,'acct-enterprise')
              summary=activate(conn,'acct-enterprise',base=datetime(2026,8,25,10,0,tzinfo=timezone.utc))
              assert datetime.fromisoformat(summary['ends_at'])-datetime.fromisoformat(summary['activated_at'])==timedelta(days=ENTERPRISE_PILOT_DAYS)
              assert summary['type']=='enterprise'

          def test_existing_legacy_account_migration_preserves_trial_state():
              conn=db()
              conn.execute('''CREATE TABLE accounts(account_id TEXT PRIMARY KEY,status TEXT NOT NULL DEFAULT 'active',plan TEXT NOT NULL DEFAULT 'pilot',created_at TEXT NOT NULL,trial_ends_at TEXT,entitlement_expires_at TEXT,store TEXT,product_id TEXT,original_transaction_id TEXT,subscription_status TEXT NOT NULL DEFAULT 'trial',billing_synced_at TEXT)''')
              end=(datetime.now(timezone.utc)+timedelta(days=5)).isoformat()
              conn.execute("INSERT INTO accounts(account_id,status,plan,created_at,trial_ends_at,subscription_status) VALUES(?,?,?,?,?,'trial')",('legacy','active','pilot',datetime.now(timezone.utc).isoformat(),end)); conn.commit()
              ensure_account(conn,'legacy'); account=get_account(conn,'legacy')
              assert account['plan']=='pilot' and account['trial_ends_at']==end
              assert account['evaluation_status'] is None
              state=subscription_state(account); assert state['plan']=='pilot' and state['active'] is True

          def test_revenuecat_paid_precedence_over_unexpired_evaluation_and_metrics_are_auditable():
              conn=db(); ensure_account(conn,'acct-precedence'); activate(conn,'acct-precedence')
              expires=(datetime.now(timezone.utc)+timedelta(days=30)).isoformat()
              update_subscription(conn,'acct-precedence',plan='pro',subscription_status='active',entitlement_expires_at=expires,store='app_store',product_id='obrasignal_pro_monthly')
              state=subscription_state(get_account(conn,'acct-precedence'))
              assert state['plan']=='pro' and state['source']=='app_store'
              metrics=evaluation_metrics(conn,get_account(conn,'acct-precedence'))
              assert metrics['TRIAL_TO_PAID']==1
              assert metrics['VALUE_EXPOSURE_RATE']==1
              assert metrics['measured_value_event_count']==0
              assert metrics['estimated_value_event_count']==0
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add account_registry.py evaluation_policy.py company_profile.py opportunity_match_pipeline.py mobile/components/BillingGate.js BILLING_SETUP.md TRIAL_POLICY_V01.md master_execution_queue.py tests/test_billing.py
          git commit -m "Implement value-aware evaluation policy v0.1"
          git push origin HEAD:codex/trial-policy-v01
