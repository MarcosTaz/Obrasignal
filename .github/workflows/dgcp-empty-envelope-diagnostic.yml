name: DGCP Empty Envelope Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Print bounded current-day process envelope
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import date
          today = date.today().isoformat()
          url = 'https://datosabiertos.dgcp.gob.do/api-dgcp/v1/procesos?' + urllib.parse.urlencode({
              'startdate': today, 'enddate': today, 'page': 1, 'limit': 1000,
          })
          req = urllib.request.Request(url, headers={'User-Agent':'ObraSignal-DGCP-envelope-diagnostic/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          assert isinstance(payload, dict)
          assert payload.get('code') == 200 and payload.get('hasError') is False
          PY
