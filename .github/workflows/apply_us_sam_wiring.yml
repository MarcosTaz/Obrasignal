name: Apply US SAM Wiring

on:
  push:
    branches: [codex/us-sam-q050]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/us-sam-q050
      - name: Apply wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('source_registry.py'); s=p.read_text()
          marker='''    "CA_CANADABUYS": _source(\n'''
          entry='''    "US_SAM": _source(\n        country="USA",\n        source_id="us_sam_contract_opportunities",\n        kind="OFFICIAL_PUBLIC_DAILY_CSV_SNAPSHOT",\n        access="public_contract_opportunities_full_csv",\n        status="ready",\n        priority=1,\n        legal_reuse="GREEN",\n        machine_access="VERIFIED",\n        expected_refresh_minutes=1440,\n        stale_after_minutes=4320,\n        capabilities=("incremental_sync", "contacts", "set_asides"),\n        signal_types=("TENDER",),\n        adapter="SAMGovConnector",\n        realtime_capable=False,\n    ),\n'''
          if '"US_SAM": _source(' not in s:
              if marker not in s: raise SystemExit('source registry insertion target missing')
              p.write_text(s.replace(marker, entry+marker, 1))

          p=Path('preload.py'); s=p.read_text()
          imp='from canada_buys_runtime import install_canadabuys_runtime\n'
          if 'from us_sam_runtime import install_us_sam_runtime' not in s:
              if imp not in s: raise SystemExit('preload import target missing')
              s=s.replace(imp, imp+'from us_sam_runtime import install_us_sam_runtime\n',1)
          block='''install_canadabuys_runtime(\n    _app,\n    source_enabled=_global_source_enabled,\n    record_blocked=_record_blocked_global_source,\n)\n'''
          add=block+'''\ninstall_us_sam_runtime(\n    _app,\n    source_enabled=_global_source_enabled,\n    record_blocked=_record_blocked_global_source,\n)\n'''
          if 'install_us_sam_runtime(' not in s:
              if block not in s: raise SystemExit('preload Canada wiring target missing')
              s=s.replace(block,add,1)
          p.write_text(s)

          Path('US_SAM_EVIDENCE.md').write_text('''# US SAM — Q050 evidence\n\nStatus: IMPLEMENTATION IN PROGRESS.\n\n## Official contract\n\n- SAM.gov Contract Opportunities is the official U.S. federal opportunity source.\n- Publisher-native construction classification is NAICS sector 23; ObraSignal admits only six-digit NAICS codes beginning with `23`.\n- Public full extract: `ContractOpportunitiesFullCSV.csv`; live probe on 2026-08-25 returned HTTP 200, 248,581,349 bytes, 47 columns, ETag and Last-Modified metadata.\n- Publisher fields include NoticeId, solicitation number, organization hierarchy, posted date, notice/base type, archive metadata, set-aside, response deadline, NAICS, classification code, place of performance, contacts, links and description.\n- `NoticeId` is the connector identity. Solicitation number is preserved but is not assumed globally unique.\n- `Award$` is award information and is never presented as current tender value.\n- Full CSV is treated as an active daily snapshot. Disappearance does not prove cancellation and therefore fails closed.\n- GSA API v2 requires an API key and only returns the latest active opportunity version; it is not required for the no-key v0.1 production path.\n\n## Production semantics\n\n- Source ID: `US_SAM`.\n- Opt-in only through `OBRASIGNAL_GLOBAL_SOURCES=US_SAM`.\n- Conditional GET uses ETag/Last-Modified.\n- CSV is parsed streaming to avoid loading the ~250 MB file into memory.\n- Actionable notice types in v0.1: Presolicitation, Solicitation, Combined Synopsis/Solicitation, Sources Sought.\n- No keyword filtering as the primary construction gate.\n- No fabricated contract value or currency.\n''')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source_registry.py preload.py US_SAM_EVIDENCE.md
          git diff --cached --quiet || git commit -m "Integrate SAM.gov connector into production gates"
          git push origin HEAD:codex/us-sam-q050
