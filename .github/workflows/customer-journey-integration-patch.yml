name: Customer Journey Integration Patcher

on:
  pull_request:
    paths:
      - '.github/workflows/customer-journey-integration-patch.yml'
      - 'mobile/App.js'

permissions:
  contents: write

jobs:
  patch-mobile-journey:
    if: ${{ github.head_ref == 'integration/customer-journey-current-20260828' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply exact idempotent customer-journey presentation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('mobile/App.js')
          text=path.read_text(encoding='utf-8')
          replacements=[
            ("const STATES=[['NEW','Novo'],['REVIEWING','Em análise'],['PREPARING','A preparar'],['SUBMITTED','Proposta enviada'],['WON','Ganho'],['LOST','Perdido']];",
             "const STATES=[['NEW','Novo'],['REVIEWING','Em análise'],['PREPARING','A preparar'],['SUBMITTED','Proposta enviada'],['WON','Ganho reportado'],['LOST','Perdido reportado']];"),
            ("ListEmptyComponent={<Text style={s.empty}>Sem resultados com estes filtros. Reduz a relevância mínima ou ajusta os critérios da empresa.</Text>}",
             "ListEmptyComponent={<Text style={s.empty}>Não há oportunidades nesta vista. Isto pode dever-se aos filtros atuais ou a não existirem oportunidades que passem os critérios. Não baixes critérios só para criar resultados; ajusta-os apenas se a realidade comercial mudou ou volta a atualizar o Radar mais tarde.</Text>}")
          ]
          changed=False
          for old,new in replacements:
              if old in text:
                  assert text.count(old)==1, f'expected one occurrence: {old[:60]}'
                  text=text.replace(old,new)
                  changed=True
              else:
                  assert new in text, f'neither old nor expected replacement present: {old[:60]}'
          if changed:
              path.write_text(text, encoding='utf-8')
          Path('/tmp/customer-journey-changed').write_text('1' if changed else '0')
          PY
          if [ "$(cat /tmp/customer-journey-changed)" = 0 ]; then
            echo 'Journey patch already materialized.'
            exit 0
          fi
          python - <<'PY'
          import base64,json,os,subprocess
          path='mobile/App.js'
          body={
            'message':'fix(journey): make mobile empty/outcome states truth preserving',
            'content':base64.b64encode(open(path,'rb').read()).decode('ascii'),
            'branch':os.environ['GITHUB_HEAD_REF'],
            'sha':subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip(),
          }
          json.dump(body,open('/tmp/app-put.json','w',encoding='utf-8'),separators=(',',':'))
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/mobile/App.js" --input /tmp/app-put.json
