name: ObraSignal Neon JWKS Readiness
on:
  pull_request:
    paths:
      - 'tests/neon_public_jwks_ready.py'
      - '.github/workflows/neon-jwks-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jwks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/neon_public_jwks_ready.py
