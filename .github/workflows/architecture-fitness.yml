name: ObraSignal Architecture Fitness

on:
  pull_request:
    paths:
      - 'architecture_audit.py'
      - 'master_execution_queue.py'
      - 'capability_registry.py'
      - 'source_registry.py'
      - 'app.py'
      - 'api.py'
      - 'cors_app.py'
      - 'render.yaml'
      - 'docs/adr/**'
      - '.github/workflows/architecture-fitness.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OBRASIGNAL_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OBRASIGNAL_TEST_SHA }}
          persist-credentials: false
      - name: Confirm exact revision under test
        run: test "$(git rev-parse HEAD)" = "$OBRASIGNAL_TEST_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run strict architecture audit
        run: python architecture_audit.py --strict
