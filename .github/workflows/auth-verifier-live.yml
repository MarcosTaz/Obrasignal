name: ObraSignal JWT Verifier Live Gate

on:
  pull_request:
    paths:
      - 'auth_context_jwt.py'
      - 'tests/test_supabase_jwt_compat.py'
      - 'tests/test_jwt_verifier_adversarial.py'
      - '.github/workflows/auth-verifier-live.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OBRASIGNAL_TEST_SHA: f7bea402889146843ff8b2d7ade1c81b01cbfec2

jobs:
  verify-real-supabase-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OBRASIGNAL_TEST_SHA }}
      - name: Confirm exact revision under test
        run: test "$(git rev-parse HEAD)" = "$OBRASIGNAL_TEST_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt

      - name: Require live-test credentials
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_KEY E2E_EMAIL E2E_PASSWORD; do
            test -n "${!name}" || { echo "Missing required live-test secret: $name"; exit 1; }
          done

      - name: Acquire real Supabase access token
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )"
          status="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$BODY")"
          test "$status" = "200" || { echo "Supabase authentication failed with HTTP $status"; exit 1; }
          python - <<'PY'
          import json
          token=json.load(open('/tmp/auth.json')).get('access_token')
          assert token, 'Supabase did not return an access token'
          open('/tmp/access_token','w').write(token)
          PY
          )"

      - name: Verify real token through branch verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit
          from auth_context_jwt import JwtVerifier

          configured = os.environ['SUPABASE_URL'].strip().rstrip('/')
          parsed = urlsplit(configured)
          project_url = urlunsplit((parsed.scheme, parsed.netloc, parsed.path, '', ''))
          verifier = JwtVerifier(project_url)
          token = open('/tmp/access_token', encoding='utf-8').read().strip()
          identity = verifier.verify(token)
          assert identity.authenticated if hasattr(identity, 'authenticated') else True
          assert identity.account_id
          assert identity.subject == identity.account_id
          assert identity.claims.get('aud') == 'authenticated'
          print('LIVE_JWT_VERIFICATION_OK')
          print('algorithm_and_signature=verified')
          print('issuer=verified')
          print('audience=verified')
          print('subject_present=true')
          PY
