name: CanadaBuys Validation

on:
  push:
    branches:
      - codex/canadubuys-production
      - codex/canadabuys-production
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Run CanadaBuys deterministic suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q test_canada_buys.py 2>&1 | tee canadabuys-pytest.txt
      - name: Run CanadaBuys live production path
        env:
          OBRASIGNAL_LIVE_CANADABUYS: '1'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q test_canada_buys_live_contract.py 2>&1 | tee canadabuys-live.txt
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-validation
          path: |
            canadabuys-pytest.txt
            canadabuys-live.txt
          retention-days: 1
