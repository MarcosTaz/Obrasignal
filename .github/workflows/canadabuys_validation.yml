name: CanadaBuys Validation

on:
  push:
    branches:
      - codex/canadabuys-production
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest requests
      - run: python -m pytest -q test_canada_buys.py
