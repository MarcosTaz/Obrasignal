name: CanadaBuys Validation

on:
  push:
    branches:
      - codex/canadabuys-production
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Run all CanadaBuys deterministic suites
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q test_canada_buys.py test_canada_buys_fail_closed.py test_canada_buys_identity_contract.py test_canada_buys_no_value.py test_canada_buys_runtime.py test_canada_buys_timezone.py 2>&1 | tee canadabuys-pytest.txt
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-pytest
          path: canadabuys-pytest.txt
          retention-days: 1
