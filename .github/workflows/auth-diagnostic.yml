name: ObraSignal Auth Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check password input without exposing it
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, hashlib
          password=os.environ['E2E_PASSWORD']
          print('password_present:', bool(password))
          print('password_byte_length:', len(password.encode()))
          print('password_has_outer_whitespace:', password != password.strip())
          print('password_has_cr_or_lf:', '\r' in password or '\n' in password)
          print('password_sha256:', hashlib.sha256(password.encode()).hexdigest())
          PY

      - name: Probe Auth configuration
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          status="$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_KEY" "$BASE_URL/auth/v1/settings")"
          test "$status" = "200"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/settings.json'))
          ext=p.get('external') or {}
          print('email_provider_enabled:', ext.get('email'))
          print('disable_signup:', p.get('disable_signup'))
          print('autoconfirm:', p.get('autoconfirm'))
          PY

      - name: Test target account
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          python - <<'PY'
          import json, os
          open('/tmp/body.json','w').write(json.dumps({
              'email': 'obrasignal.pt@gmail.com',
              'password': os.environ['E2E_PASSWORD']
          }))
          PY
          status="$(curl --silent --show-error --output /tmp/auth-target.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @/tmp/body.json)"
          echo "target_http_status=$status"
          if [ "$status" = "200" ]; then
            echo 'TARGET_AUTH_OK'
            exit 0
          fi
          cat /tmp/auth-target.json
          exit 1

      - name: Test secondary known account with same password
        if: failure()
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          python - <<'PY'
          import json, os
          open('/tmp/body-secondary.json','w').write(json.dumps({
              'email': 'marcostrigomoutinho@gmail.com',
              'password': os.environ['E2E_PASSWORD']
          }))
          PY
          status="$(curl --silent --show-error --output /tmp/auth-secondary.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @/tmp/body-secondary.json)"
          echo "secondary_http_status=$status"
          if [ "$status" = "200" ]; then
            echo 'SECONDARY_AUTH_OK_SAME_PASSWORD'
          else
            echo 'SECONDARY_AUTH_NOT_OK'
          fi
          exit 1
