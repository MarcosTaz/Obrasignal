name: ObraSignal Play Store Submit One-Shot

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact finished Android EAS production build ID to submit
        required: true
        type: string
      expected_git_sha:
        description: Exact Git commit SHA that EAS must associate with the build
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit-android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      BUILD_ID: ${{ inputs.build_id }}
      EXPECTED_GIT_SHA: ${{ inputs.expected_git_sha }}
      EAS_PROJECT_ID: c277466b-a418-45f7-b070-4fc3f96386b7
      ANDROID_PACKAGE: pt.obrasignal.app
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_git_sha }}

      - name: Verify checked-out source
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA" || {
            echo "::error::Checked out source does not match expected release SHA."
            exit 1
          }
          echo "PLAY_SUBMISSION_SOURCE=$EXPECTED_GIT_SHA"

      - name: Require EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo '::error::MOBILE_BLOCKED EXPO_TOKEN is not configured.'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify exact Android build provenance before submission
        run: |
          set -euo pipefail
          test -n "$BUILD_ID"
          test -n "$EXPECTED_GIT_SHA"
          eas build:view "$BUILD_ID" --json > /tmp/eas-build.json
          python - <<'PY'
          import json, os

          target = json.load(open('/tmp/eas-build.json', encoding='utf-8'))
          if not isinstance(target, dict):
              raise SystemExit('Refusing submission: EAS build:view did not return one build object')

          build_id = str(target.get('id') or '')
          status = str(target.get('status') or '').upper().replace('-', '_')
          platform = str(target.get('platform') or '').upper()
          profile = str(target.get('buildProfile') or target.get('profile') or '').lower()
          git_sha = str(target.get('gitCommitHash') or '')
          project_id = str((target.get('app') or {}).get('id') or '')
          app_identifier = str(target.get('appIdentifier') or '')

          if build_id != os.environ['BUILD_ID']:
              raise SystemExit(f"Refusing submission: wrong build id {build_id or 'missing'}")
          if status != 'FINISHED':
              raise SystemExit(f"Refusing submission: build status is {status or 'missing'}")
          if platform != 'ANDROID':
              raise SystemExit(f"Refusing submission: wrong platform {platform or 'missing'}")
          if profile != 'production':
              raise SystemExit(f"Refusing submission: wrong build profile {profile or 'missing'}")
          if git_sha != os.environ['EXPECTED_GIT_SHA']:
              raise SystemExit(f"Refusing submission: wrong git commit {git_sha or 'missing'}")
          if project_id != os.environ['EAS_PROJECT_ID']:
              raise SystemExit(f"Refusing submission: wrong EAS project {project_id or 'missing'}")
          if app_identifier != os.environ['ANDROID_PACKAGE']:
              raise SystemExit(f"Refusing submission: wrong Android package {app_identifier or 'missing'}")

          print(
              'PLAY_BUILD_PROVENANCE_VERIFIED '
              f"id={build_id} source={git_sha} project={project_id} package={app_identifier}"
          )
          PY

      - name: Submit exact production build to Google Play internal track
        run: eas build:submit --platform android --id "$BUILD_ID" --profile production --non-interactive --wait
