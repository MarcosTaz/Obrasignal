name: WarrantyGuard Factory

on:
  pull_request:
    paths:
      - 'factories/warrantyguard/**'
      - '.github/workflows/warrantyguard.yml'
  push:
    branches:
      - 'factory/warrantyguard-*'
    paths:
      - 'factories/warrantyguard/**'
      - '.github/workflows/warrantyguard.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: factories/warrantyguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WarrantyGuard completion slice
        run: npm run verify
      - name: Package verified source outside source tree
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="$RUNNER_TEMP/warrantyguard-source-v${VERSION}-${GITHUB_SHA}.tar.gz"
          SHA_FILE="$RUNNER_TEMP/PACKAGE_SHA256.txt"
          tar -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" | tee "$SHA_FILE"
          echo "WARRANTYGUARD_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "WARRANTYGUARD_SHA_FILE=$SHA_FILE" >> "$GITHUB_ENV"
      - name: Clean extraction and independent re-verification
        run: |
          EXTRACT_DIR="$RUNNER_TEMP/warrantyguard-clean-extract"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$WARRANTYGUARD_ARCHIVE" -C "$EXTRACT_DIR"
          cd "$EXTRACT_DIR"
          npm run verify
      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: warrantyguard-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/warrantyguard-source-*.tar.gz
            ${{ runner.temp }}/PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
