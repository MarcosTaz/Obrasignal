name: WarrantyGuard Factory

on:
  pull_request:
    paths:
      - 'factories/warrantyguard/**'
      - '.github/workflows/warrantyguard.yml'
  push:
    branches:
      - 'factory/warrantyguard-*'
    paths:
      - 'factories/warrantyguard/**'
      - '.github/workflows/warrantyguard.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: factories/warrantyguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify assisted-local Factory
        run: npm run verify
