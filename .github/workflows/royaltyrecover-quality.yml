name: RoyaltyRecover Quality

on:
  push:
    branches:
      - royaltyrecover/company-web-app
    paths:
      - 'factories/royaltyrecover/**'
      - '.github/workflows/royaltyrecover-quality.yml'
  pull_request:
    paths:
      - 'factories/royaltyrecover/**'
      - '.github/workflows/royaltyrecover-quality.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: RoyaltyRecover tests
        working-directory: factories/royaltyrecover
        run: python -m unittest -v
      - name: Validate SQLite schema
        working-directory: factories/royaltyrecover
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path('schema.sql').read_text(encoding='utf-8')
          conn = sqlite3.connect(':memory:')
          conn.executescript(sql)
          tables = {row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {
              'organizations', 'licensors', 'licensees', 'agreements', 'agreement_versions',
              'clauses', 'audit_rights', 'royalty_rules', 'royalty_tiers', 'sales_records',
              'royalty_statements', 'payments', 'calculation_runs', 'expected_royalties',
              'variances', 'evidence', 'findings', 'deadlines', 'information_requests',
              'reviews', 'recovery_actions', 'claims', 'outcomes', 'recovered_amounts', 'audit_events'
          }
          missing = sorted(required - tables)
          if missing:
              raise SystemExit(f'missing tables: {missing}')
          violations = list(conn.execute('PRAGMA foreign_key_check'))
          if violations:
              raise SystemExit(f'foreign key violations: {violations}')
          print(f'schema ok: {len(tables)} tables')
          PY
      - name: Full application startup and readiness smoke
        working-directory: factories/royaltyrecover
        env:
          ROYALTYRECOVER_API_KEYS_JSON: '{"ORG-SMOKE":"smoke-secret"}'
          ROYALTYRECOVER_DB_PATH: /tmp/royaltyrecover-smoke.db
        run: |
          rm -f /tmp/royaltyrecover-smoke.db /tmp/royaltyrecover-smoke.db-wal /tmp/royaltyrecover-smoke.db-shm
          python - <<'PY'
          from application import app
          client = app.test_client()
          headers = {'X-RoyaltyRecover-API-Key':'smoke-secret'}
          health = client.get('/health')
          assert health.status_code == 200, health.data
          assert client.get('/app').status_code == 401
          assert client.get('/api/v1/readiness').status_code == 401
          dashboard = client.get('/app', headers=headers)
          assert dashboard.status_code == 200, dashboard.data
          readiness = client.get('/api/v1/readiness', headers=headers)
          assert readiness.status_code == 200, readiness.data
          assert readiness.get_json()['ready'] is True
          assert readiness.get_json()['journal_mode'].lower() == 'wal'
          print('full app startup/readiness ok')
          PY
      - name: Backup and restore smoke
        working-directory: factories/royaltyrecover
        run: |
          python - <<'PY'
          import os
          from backup import backup_repository, verify_backup
          from repository import RoyaltyRepository
          source = '/tmp/royaltyrecover-smoke.db'
          destination = '/tmp/royaltyrecover-smoke-backup.db'
          if os.path.exists(destination):
              os.unlink(destination)
          repo = RoyaltyRepository.file(source)
          try:
              result = backup_repository(repo, destination)
          finally:
              repo.close()
          verified = verify_backup(destination, result.sha256)
          assert verified.integrity == 'ok'
          restored = RoyaltyRepository.file(destination)
          try:
              assert restored.integrity_status()['ready'] is True
          finally:
              restored.close()
          print('backup/restore smoke ok')
          PY
      - name: Gunicorn configuration smoke
        working-directory: factories/royaltyrecover
        env:
          ROYALTYRECOVER_API_KEYS_JSON: '{"ORG-SMOKE":"smoke-secret"}'
          ROYALTYRECOVER_DB_PATH: /tmp/royaltyrecover-gunicorn.db
        run: gunicorn --check-config application:app
      - name: Build assisted-pilot container
        run: docker build -f factories/royaltyrecover/Dockerfile -t royaltyrecover:ci .
      - name: Run assisted-pilot container smoke
        run: |
          mkdir -p /tmp/royaltyrecover-container-data
          chmod 777 /tmp/royaltyrecover-container-data
          docker run -d --rm --name royaltyrecover-ci \
            -p 18080:8080 \
            -v /tmp/royaltyrecover-container-data:/data \
            -e 'ROYALTYRECOVER_API_KEYS_JSON={"ORG-SMOKE":"smoke-secret"}' \
            royaltyrecover:ci
          cleanup() { docker stop royaltyrecover-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep '"claim_generation":false'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/app)" = "401"
          curl --fail --silent -H 'X-RoyaltyRecover-API-Key: smoke-secret' http://127.0.0.1:18080/api/v1/readiness | grep '"ready":true'
