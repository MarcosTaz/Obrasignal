name: ObraSignal Private Neon Invited E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invited-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: neon-auth-private-test
    env:
      OS_TEST_EMAIL: ${{ secrets.OS_TEST_EMAIL }}
      OS_TEST_INVITE: ${{ secrets.OS_TEST_INVITE }}
      OS_TEST_PASSWORD: ${{ secrets.OS_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require private synthetic credentials
        shell: bash
        run: |
          if [[ -z "$OS_TEST_EMAIL" || -z "$OS_TEST_INVITE" || -z "$OS_TEST_PASSWORD" ]]; then
            echo "BLOCKED: missing private synthetic test credentials"
            exit 1
          fi
      - name: Invited registration and login
        run: python tests/neon_invited_positive_smoke.py
