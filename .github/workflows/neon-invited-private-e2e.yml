name: ObraSignal Private Neon Invited E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invited-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: neon-auth-private-test
    env:
      OS_NEON_TEST_DATABASE_URL: ${{ secrets.OS_NEON_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require isolated test database connection
        shell: bash
        run: |
          if [[ -z "$OS_NEON_TEST_DATABASE_URL" ]]; then
            echo "BLOCKED: OS_NEON_TEST_DATABASE_URL not set in protected environment"
            exit 1
          fi
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
      - name: Synthetic invitation, signup, signin and session proof
        run: python -m tests.neon_invited_automated_private_e2e
