name: ObraSignal Auth Credentials Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Check application Supabase credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          BASE_URL="${SUPABASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          status="$(curl --silent --show-error --output /tmp/auth.json --write-out '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$(python - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['E2E_EMAIL'], 'password': os.environ['E2E_PASSWORD']}))
          PY
          )")"
          python - <<'PY'
          import json
          try:
              payload=json.load(open('/tmp/auth.json'))
          except Exception:
              payload={}
          safe={k: payload.get(k) for k in ('error','error_code','msg','message') if payload.get(k)}
          print(json.dumps(safe, ensure_ascii=False))
          PY
          test "$status" = "200"
          echo "Application Supabase credentials authenticated successfully."
