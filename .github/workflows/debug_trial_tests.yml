name: Debug Trial Tests

on:
  push:
    branches: [codex/trial-policy-v01]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest
      - name: Run focused billing tests
        shell: bash
        run: |
          set +e
          pytest -q tests/test_billing.py > trial-test-output.txt 2>&1
          code=$?
          cat trial-test-output.txt
          echo "$code" > trial-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: trial-test-debug
          path: |
            trial-test-output.txt
            trial-test-exit.txt
