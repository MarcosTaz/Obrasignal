name: Customer Journey UI Patcher

on:
  push:
    branches:
      - integration/customer-journey-current-20260828

permissions:
  contents: write

jobs:
  patch-customer-journey-ui:
    if: github.ref == 'refs/heads/integration/customer-journey-current-20260828'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Apply exact idempotent customer journey UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/App.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { ActivityIndicator, FlatList, Linking, Pressable, RefreshControl, SafeAreaView, ScrollView, StyleSheet, Switch, Text, TextInput, View } from 'react-native';",
                  "import { ActivityIndicator, FlatList, Linking, Platform, Pressable, RefreshControl, SafeAreaView, ScrollView, StyleSheet, Switch, Text, TextInput, View } from 'react-native';",
              ),
              (
                  "useEffect(()=>{if(!settings.notifications){setNotice('');return}let active=true;(async()=>{setNotice('A verificar alertas…');try{const delivered=await syncUnreadOpportunityAlerts();if(active)setNotice(delivered>0?`${delivered} alerta(s) novo(s).`:'Notificações activadas.')}catch(_){if(active)setNotice('Notificações activadas; push requer a aplicação nativa.')}})();return()=>{active=false}},[settings.notifications]);",
                  "useEffect(()=>{if(!settings.notifications){setNotice('');return}let active=true;(async()=>{setNotice('A verificar alertas…');try{if(Platform.OS==='web'){if(active)setNotice('Notificações push requerem a aplicação nativa.');return}const granted=await configureNotifications();if(!active)return;if(!granted){setNotice('Notificações não activadas. Autoriza as notificações nas definições do dispositivo.');return}const delivered=await syncUnreadOpportunityAlerts();if(active)setNotice(delivered>0?`${delivered} alerta(s) novo(s).`:'Notificações activadas.')}catch(_){if(active)setNotice('Não foi possível verificar as notificações. Tenta novamente mais tarde.')}})();return()=>{active=false}},[settings.notifications]);",
              ),
              (
                  "ListEmptyComponent={<Text style={s.empty}>Não há oportunidades nesta vista. Isto pode dever-se aos filtros atuais ou a não existirem oportunidades que passem os critérios. Não baixes critérios só para criar resultados; ajusta-os apenas se a realidade comercial mudou ou volta a atualizar o Radar mais tarde.</Text>}",
                  "ListEmptyComponent={radarError?null:<Text style={s.empty}>Não há oportunidades nesta vista. Isto pode dever-se aos filtros atuais ou a não existirem oportunidades que passem os critérios. Não baixes critérios só para criar resultados; ajusta-os apenas se a realidade comercial mudou ou volta a atualizar o Radar mais tarde.</Text>}",
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit('expected App.js seam not found; refuse fuzzy patch')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- mobile/App.js; then
            echo 'Customer Journey UI patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/App.js
          git commit -m 'fix(journey): distinguish notification and Radar degraded states'
          git push origin HEAD:integration/customer-journey-current-20260828
