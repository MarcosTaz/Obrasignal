name: Taiwan PCC Live Contract

on:
  pull_request:
    paths:
      - 'taiwan_pcc.py'
      - 'test_taiwan_pcc_live.py'
      - '.github/workflows/taiwan_pcc_live.yml'
  workflow_dispatch:

jobs:
  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Live-validate PCC public-viewing snapshot
        run: PYTHONPATH=. TW_PCC_LIVE=1 pytest -q test_taiwan_pcc_live.py
