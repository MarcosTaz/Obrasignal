name: ObraSignal Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: https://obrasignal.onrender.com/api/v1
      EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate web runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo 'Missing EXPO_PUBLIC_API_URL'; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run smoke:web

      - name: Verify generated web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s .smoke-dist/index.html
          grep -q "ObraSignal" .smoke-dist/index.html
          test -n "$(find .smoke-dist -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/.smoke-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          echo "Web preview deployed at $PAGE_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" | grep -q "ObraSignal"; then
              echo "GitHub Pages smoke check passed."
              exit 0
            fi
            echo "Waiting for Pages to become reachable (attempt $attempt/5)…"
            sleep 8
          done
          echo "GitHub Pages deployment did not return the expected ObraSignal page."
          exit 1

      - name: Report deployment URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Web preview deployed at $PAGE_URL"
