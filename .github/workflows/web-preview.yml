name: ObraSignal Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: https://obrasignal.onrender.com/api/v1
  OFFICIAL_WEB_URL: https://obrasignal.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_REVENUECAT_WEB_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_WEB_KEY }}
      EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK: ${{ secrets.EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK }}
      EXPO_PUBLIC_API_URL: https://obrasignal.onrender.com/api/v1
      EXPO_PUBLIC_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate web runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo 'Missing EXPO_PUBLIC_API_URL'; exit 1; }

          if [ -n "${EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK:-}" ]; then
            case "$EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK" in
              https://pay.rev.cat/*) ;;
              *) echo 'EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK must be a production https://pay.rev.cat/... URL'; exit 1 ;;
            esac
            if printf '%s' "$EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK" | grep -qi '/sandbox/'; then
              echo 'Sandbox RevenueCat purchase links are forbidden in the production Web bundle.'
              exit 1
            fi
            echo 'RevenueCat production Web Purchase Link present.'
          fi

          if [ -z "${EXPO_PUBLIC_REVENUECAT_WEB_KEY:-}" ] && [ -z "${EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK:-}" ]; then
            echo '::warning::COMMERCIAL_BLOCKED No automatic Web checkout is configured; evaluation/manual activation remains available.'
          elif [ -n "${EXPO_PUBLIC_REVENUECAT_WEB_KEY:-}" ]; then
            echo 'RevenueCat Web SDK key present.'
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run smoke:web

      - name: Stamp canonical build and private analytics beacon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('../scripts').resolve()))
          from public_web_seo import stamp_public_seo, write_public_discovery_files, validate_public_seo
          p = Path('.smoke-dist/index.html')
          s = p.read_text(encoding='utf-8')
          full_build = os.environ['GITHUB_SHA']
          build = full_build[:7]
          marker = f'<meta name="obrasignal-build" content="{build}">'
          checkout_ready = bool((os.environ.get('EXPO_PUBLIC_REVENUECAT_WEB_KEY') or '').strip() or (os.environ.get('EXPO_PUBLIC_REVENUECAT_PURCHASE_LINK') or '').strip())
          checkout_marker = f'<meta name="obrasignal-commercial-checkout" content="{"configured" if checkout_ready else "blocked"}">'
          if '<meta name="obrasignal-build"' in s:
              s = re.sub(r'<meta name="obrasignal-build"[^>]*>', marker, s, count=1)
          elif '</head>' in s:
              s = s.replace('</head>', f'  {marker}</head>', 1)
          else:
              s = marker + s
          if '<meta name="obrasignal-commercial-checkout"' in s:
              s = re.sub(r'<meta name="obrasignal-commercial-checkout"[^>]*>', checkout_marker, s, count=1)
          elif '</head>' in s:
              s = s.replace('</head>', f'  {checkout_marker}</head>', 1)
          else:
              s = checkout_marker + s
          beacon = f'''<script id="obrasignal-private-traffic">(function(){{try{{var p=new URLSearchParams(location.search||'');var w=window.innerWidth||0;var payload={{event:'page_view',path:location.pathname||'/',referrer:document.referrer||'',utm_source:p.get('utm_source')||'',utm_medium:p.get('utm_medium')||'',utm_campaign:p.get('utm_campaign')||'',timezone:(Intl.DateTimeFormat().resolvedOptions().timeZone||''),language:(navigator.language||''),device:w<760?'mobile':w<1100?'tablet':'desktop',build_id:'{build}'}};fetch('https://obrasignal.onrender.com/api/v1/analytics/event',{{method:'POST',headers:{{'Content-Type':'application/json'}},body:JSON.stringify(payload),credentials:'omit',keepalive:true}}).catch(function(){{}});}}catch(e){{}}}})();</script>'''
          if 'id="obrasignal-private-traffic"' not in s:
              s = s.replace('</body>', beacon + '</body>', 1) if '</body>' in s else s + beacon
          s = stamp_public_seo(s)
          p.write_text(s, encoding='utf-8')
          write_public_discovery_files(Path('.smoke-dist'))
          validate_public_seo(Path('.smoke-dist'))
          Path('.smoke-dist/release-source.txt').write_text(full_build + '\n', encoding='utf-8')
          PY

      - name: Verify generated web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s .smoke-dist/index.html
          test "$(cat .smoke-dist/release-source.txt)" = "$GITHUB_SHA"
          grep -q "ObraSignal" .smoke-dist/index.html
          grep -q "obrasignal-build" .smoke-dist/index.html
          grep -q "obrasignal-commercial-checkout" .smoke-dist/index.html
          grep -q "obrasignal-private-traffic" .smoke-dist/index.html
          grep -q "analytics/event" .smoke-dist/index.html
          grep -q "${GITHUB_SHA:0:7}" .smoke-dist/index.html
          python ../scripts/public_web_seo.py .smoke-dist
          test -n "$(find .smoke-dist -type f | wc -l)"

      - name: Fail closed on missing canonical asset paths
        run: python ../scripts/verify_pages_bundle_paths.py .smoke-dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/.smoke-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in 1 2 3 4 5 6 7 8; do
            marker="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL%/}/release-source.txt" || true)"
            if [ "$marker" = "$GITHUB_SHA" ]; then
              echo "Pages is serving exact build $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for Pages exact build $GITHUB_SHA (attempt $attempt/8)…"
            sleep 10
          done
          echo "Pages is not serving the newly deployed build marker."
          exit 1

      - name: Probe official customer domain
        shell: bash
        run: |
          set -euo pipefail
          marker="$(curl --fail --silent --show-error --location --max-time 20 https://obrasignal.com/release-source.txt 2>/tmp/obrasignal-domain-error || true)"
          if [ "$marker" = "$GITHUB_SHA" ]; then
            body="$(curl --fail --silent --show-error --location --max-time 20 https://obrasignal.com/)"
            printf '%s' "$body" | grep -q 'obrasignal-private-traffic'
            echo "obrasignal.com is serving exact build $GITHUB_SHA with private analytics enabled."
          else
            echo "::warning::PROVIDER_BLOCKED obrasignal.com is not yet serving exact build $GITHUB_SHA. Pages deployment remains valid."
            if [ -s /tmp/obrasignal-domain-error ]; then cat /tmp/obrasignal-domain-error; fi
          fi

      - name: Report deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "ObraSignal Pages deployment: $PAGE_URL"
          echo "Canonical customer domain target: https://obrasignal.com"
