name: ObraSignal Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA authorized for GitHub Pages deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-release
  cancel-in-progress: false

env:
  EXPO_PUBLIC_API_URL: https://obrasignal.onrender.com/api/v1
  RELEASE_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: https://obrasignal.onrender.com/api/v1
      EXPO_PUBLIC_BUILD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0

      - name: Confirm exact revision under build
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET_SHA"

      - name: Refuse stale or non-canonical manual deploy target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          canonical="$(git rev-parse origin/main)"
          test "$canonical" = "$RELEASE_TARGET_SHA" || {
            echo "Refusing Pages release: target $RELEASE_TARGET_SHA is not current canonical main $canonical."
            exit 1
          }
          echo "canonical_web_release_sha=$RELEASE_TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate web runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_URL'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing GitHub Actions secret EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY'; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo 'Missing EXPO_PUBLIC_API_URL'; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run smoke:web

      - name: Stamp release candidate into page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          p = Path('.smoke-dist/index.html')
          s = p.read_text(encoding='utf-8')
          build = os.environ['RELEASE_TARGET_SHA'][:7]
          marker = f'<meta name="obrasignal-build" content="{build}">'
          if '<meta name="obrasignal-build"' in s:
              s = re.sub(r'<meta name="obrasignal-build"[^>]*>', marker, s, count=1)
          elif '</head>' in s:
              s = s.replace('</head>', f'  {marker}</head>', 1)
          else:
              s = marker + s
          if re.search(r'<title>.*?</title>', s, flags=re.S):
              s = re.sub(r'<title>.*?</title>', f'<title>ObraSignal • {build}</title>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify generated web bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_TARGET_SHA:0:7}"
          test -s .smoke-dist/index.html
          grep -q "ObraSignal" .smoke-dist/index.html
          grep -q "obrasignal-build" .smoke-dist/index.html
          grep -q "$expected" .smoke-dist/index.html
          test -n "$(find .smoke-dist -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/.smoke-dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reconfirm target is current canonical main before deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Fail closed on pre-deploy main drift
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags --prune
          canonical="$(git rev-parse origin/main)"
          test "$canonical" = "$TARGET_SHA" || {
            echo "Refusing Pages deployment: main moved from target $TARGET_SHA to $canonical."
            exit 1
          }

      - name: Deploy exact authorized build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify exact deployed Pages build and detect post-deploy drift
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          expected="${TARGET_SHA:0:7}"
          marker="<meta name=\"obrasignal-build\" content=\"${expected}\">"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" > /tmp/web.html \
              && grep -Fq "$marker" /tmp/web.html; then
              echo "GitHub Pages is serving exact authorized Web build $expected."
              git fetch origin main --no-tags --prune
              canonical="$(git rev-parse origin/main)"
              test "$canonical" = "$TARGET_SHA" || {
                echo "Pages deployed $TARGET_SHA but main moved to $canonical during deployment; release is STALE."
                exit 1
              }
              exit 0
            fi
            echo "Waiting for Pages to serve exact build $expected (attempt $attempt/8)…"
            sleep 10
          done
          echo "GitHub Pages is not serving exact authorized Web build $expected."
          exit 1

      - name: Report deployment URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Web release verified at $PAGE_URL"
