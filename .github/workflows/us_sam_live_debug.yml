name: SAM.gov Live Debug

on:
  push:
    branches: [codex/us-sam-q050]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest
      - name: Capture live failure
        shell: bash
        run: |
          set +e
          OBRASIGNAL_RUN_US_SAM_LIVE=1 pytest -vv -s tests/test_us_sam_live.py > us-sam-live-debug.txt 2>&1
          code=$?
          echo "$code" > us-sam-live-exit.txt
          cat us-sam-live-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: us-sam-live-debug
          path: |
            us-sam-live-debug.txt
            us-sam-live-exit.txt
