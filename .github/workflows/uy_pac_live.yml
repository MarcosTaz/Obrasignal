name: Uruguay ARCE PAC Live Discovery Gate

on:
  push:
    branches:
      - research/uy-arce-pac-v0
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Discover public ARCE PAC machine contract
        env:
          OBRASIGNAL_LIVE_UY_PAC: '1'
        run: PYTHONPATH=. python -m pytest -q -s test_uruguay_arce_pac_live.py
