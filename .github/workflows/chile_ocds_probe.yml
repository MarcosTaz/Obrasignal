name: ChileCompra OCDS Probe

on:
  push:
    branches: [codex/chile-mercadopublico-q060]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official no-registration and test-ticket paths
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib
          TICKET='F8537A18-6766-4DEF-9E59-426B4FEE2844'
          urls={
            'ocds_2026_08':'https://api.mercadopublico.cl/APISOCDS/OCDS/listaOCDSAgnoMes/2026/08/0/10',
            'ocds_2026_07':'https://api.mercadopublico.cl/APISOCDS/OCDS/listaOCDSAgnoMes/2026/07/0/10',
            'ocds_2026_06':'https://api.mercadopublico.cl/APISOCDS/OCDS/listaOCDSAgnoMes/2026/06/0/10',
            'ocds_2025_12':'https://api.mercadopublico.cl/APISOCDS/OCDS/listaOCDSAgnoMes/2025/12/0/10',
            'classic_active':f'https://api.mercadopublico.cl/servicios/v1/publico/licitaciones.json?estado=activas&ticket={TICKET}',
            'classic_date':f'https://api.mercadopublico.cl/servicios/v1/publico/licitaciones.json?fecha=24082026&ticket={TICKET}',
          }
          report={}
          for name,url in urls.items():
            item={'url':url.replace(TICKET,'TEST_TICKET')}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ObraSignal ChileCompra probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as r:
                raw=r.read()
                item.update(status=r.status,content_type=r.headers.get('Content-Type'),content_length=len(raw))
              obj=json.loads(raw.decode('utf-8-sig','replace'))
              item['top_type']=type(obj).__name__
              item['top_keys']=list(obj)[:40] if isinstance(obj,dict) else None
              if isinstance(obj,dict):
                for key in ('Cantidad','cantidad','total','Total','status','detail'):
                  if key in obj:item[key]=obj[key]
              item['sample']=obj
            except Exception as e:
              item['error']=repr(e)
            report[name]=item
          pathlib.Path('chile-ocds-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)[:2000000])
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='sample'} for k,v in report.items()},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chile-ocds-probe
          path: chile-ocds-probe.json
