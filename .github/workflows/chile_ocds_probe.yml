name: ChileCompra OCDS Probe

on:
  push:
    branches: [codex/chile-mercadopublico-q060]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe detailed live tender contract
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, pathlib, time
          TICKET='F8537A18-6766-4DEF-9E59-426B4FEE2844'
          codes=['1002588-92-LE26','1002592-4-LP26','1002-66-LP26']
          report={}
          for i,code in enumerate(codes):
            if i: time.sleep(2)
            urls={
              'classic':f'https://api.mercadopublico.cl/servicios/v1/publico/licitaciones.json?codigo={code}&ticket={TICKET}',
              'ocds':f'https://api.mercadopublico.cl/APISOCDS/OCDS/tender/{code}',
            }
            for kind,url in urls.items():
              key=f'{code}:{kind}'; item={'url':url.replace(TICKET,'TEST_TICKET')}
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'ObraSignal ChileCompra probe/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read(); item.update(status=r.status,content_type=r.headers.get('Content-Type'),content_length=len(raw))
                obj=json.loads(raw.decode('utf-8-sig','replace'))
                item['sample']=obj
                item['top_keys']=list(obj)[:50] if isinstance(obj,dict) else None
              except urllib.error.HTTPError as e:
                item.update(error=f'HTTP {e.code}',headers=dict(e.headers),body=e.read().decode('utf-8','replace')[:2000])
              except Exception as e:item['error']=repr(e)
              report[key]=item
          pathlib.Path('chile-ocds-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)[:3000000])
          print(json.dumps({k:{kk:vv for kk,vv in v.items() if kk!='sample'} for k,v in report.items()},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chile-ocds-probe
          path: chile-ocds-probe.json
