name: Peru OECE Live Gate

on:
  push:
    branches:
      - feature/pe-oece-shared-bulk-v0
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Validate live Peru OECE bulk index
        env:
          OBRASIGNAL_LIVE_OECE: '1'
        run: PYTHONPATH=. python -m pytest -q test_peru_oece_live.py
