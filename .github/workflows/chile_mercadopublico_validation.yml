name: Chile Mercado Publico Validation

on:
  push:
    branches: [codex/chile-mercadopublico-q060]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest
      - name: Deterministic connector tests
        run: pytest -q tests/test_chile_mercadopublico.py
      - name: Live contract smoke with documentation test ticket
        env:
          OBRASIGNAL_ALLOW_MERCADOPUBLICO_TEST_TICKET: '1'
        shell: bash
        run: |
          python - <<'PY'
          from chile_mercadopublico import MercadoPublicoConnector, TEST_TICKET, _is_construction, _observation
          c=MercadoPublicoConnector(ticket=TEST_TICKET,min_interval_seconds=0)
          row=c._detail('1002588-92-LE26')
          assert row['CodigoExterno']=='1002588-92-LE26'
          assert _is_construction(row)
          obs=_observation(row)
          assert obs['source']=='CL_MERCADOPUBLICO'
          assert '72131700' in obs['unspsc_codes']
          assert obs['currency']=='CLP'
          print(obs['external_id'], obs['source_status'], obs['value'], obs['currency'])
          PY
