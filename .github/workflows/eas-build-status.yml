name: ObraSignal Android Build Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-build-status.yml'
      - '.eas-build-status-once'

permissions:
  contents: read

jobs:
  verify-android-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Record exact workflow revision
        working-directory: .
        run: |
          set -euo pipefail
          echo "ObraSignal Android proof workflow source: $GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo '::error::MOBILE_BLOCKED EXPO_TOKEN is not configured.'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify exact production build from EAS inventory
        env:
          BUILD_ID: 8fb3b777-a52a-4c9c-b81d-2e87887e6c48
          BUILD_GIT_SHA: 916ed6203ad4f6750e862b9952f982dcbd3e63b9
          EAS_PROJECT_ID: c277466b-a418-45f7-b070-4fc3f96386b7
          ANDROID_PACKAGE: pt.obrasignal.app
        run: |
          set -euo pipefail
          if ! eas build:list --platform android --limit 50 --json --non-interactive > /tmp/eas-builds.json 2> /tmp/eas-builds.err; then
            cat /tmp/eas-builds.err >&2
            echo '::error::EAS Android inventory query failed.'
            exit 1
          fi
          python - <<'PY'
          import json, os

          builds = json.load(open('/tmp/eas-builds.json', encoding='utf-8'))
          if not isinstance(builds, list):
              raise SystemExit('EAS build:list did not return a build list')

          matches = [b for b in builds if str(b.get('id') or '') == os.environ['BUILD_ID']]
          if len(matches) != 1:
              ids = [str(b.get('id') or '') for b in builds]
              raise SystemExit(f"Exact Android build not present in EAS inventory; returned={ids}")
          target = matches[0]

          build_id = str(target.get('id') or '')
          status = str(target.get('status') or '').upper().replace('-', '_')
          platform = str(target.get('platform') or '').upper()
          profile = str(target.get('buildProfile') or target.get('profile') or '').lower()
          git_sha = str(target.get('gitCommitHash') or '')
          project_id = str((target.get('app') or {}).get('id') or '')
          app_identifier = str(target.get('appIdentifier') or '')

          expected = {
              'id': os.environ['BUILD_ID'],
              'status': 'FINISHED',
              'platform': 'ANDROID',
              'profile': 'production',
              'git_sha': os.environ['BUILD_GIT_SHA'],
              'project_id': os.environ['EAS_PROJECT_ID'],
              'app_identifier': os.environ['ANDROID_PACKAGE'],
          }
          actual = {
              'id': build_id,
              'status': status,
              'platform': platform,
              'profile': profile,
              'git_sha': git_sha,
              'project_id': project_id,
              'app_identifier': app_identifier,
          }
          for key, want in expected.items():
              if actual[key] != want:
                  raise SystemExit(f"Wrong {key}: {actual[key] or 'missing'}; expected={want}")

          print(
              'ANDROID_EAS_BUILD_VERIFIED '
              f"id={build_id} source={git_sha} project={project_id} package={app_identifier}"
          )
          PY
