name: PanamaCompraenCifras V2 Live Gate

on:
  push:
    branches:
      - research/pa-panamacompra-v2-gate
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt pytest
      - name: Validate live PanamaCompraenCifras V2 public surfaces
        env:
          OBRASIGNAL_LIVE_PANAMA: '1'
        run: PYTHONPATH=. python -m pytest -q -s test_panama_v2_live.py
