name: ObraSignal Production Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: production-browser-e2e
  cancel-in-progress: true

env:
  PUBLIC_URL: https://obrasignal.com/
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  TARGET_BUILD: ${{ github.sha }}

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium firefox webkit

      - name: Verify production customer journey in browser engines
        run: python scripts/production_browser_e2e.py
