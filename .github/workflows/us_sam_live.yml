name: SAM.gov Live Gate

on:
  push:
    branches: [codex/us-sam-q050]
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install pytest
      - name: Deterministic connector tests
        run: pytest -q tests/test_us_sam.py
      - name: Live official bulk production path
        env:
          OBRASIGNAL_RUN_US_SAM_LIVE: '1'
        run: pytest -q tests/test_us_sam_live.py
