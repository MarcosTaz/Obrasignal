name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP federal Compras.gov.br freshness probe
        run: |
          python - <<'PY'
          import calendar
          import time
          import requests

          BASE = "https://dadosabertos.compras.gov.br"
          CONTRACTS = BASE + "/modulo-contratacoes/1_consultarContratacoes_PNCP_14133"
          ITEMS_ID = BASE + "/modulo-contratacoes/2.1_consultarItensContratacoes_PNCP_14133_Id"
          CATSER = BASE + "/modulo-servico/6_consultarItemServico"
          S = requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal federal-freshness probe/1.0"})

          def get(url, params=None):
              last = ""
              for attempt in range(3):
                  try:
                      r = S.get(url, params=params, timeout=30)
                      if r.status_code in (429,500,502,503,504):
                          last = f"HTTP {r.status_code}"
                          time.sleep(attempt + 1)
                          continue
                      if r.status_code >= 400:
                          return None, r.status_code, (r.text or "")[:180]
                      return r.json(), r.status_code, ""
                  except Exception as exc:
                      last = f"{type(exc).__name__}:{exc}"
                      time.sleep(attempt + 1)
              return None, 0, last

          def rows(payload):
              if isinstance(payload, list): return payload
              if isinstance(payload, dict):
                  for key in ("resultado","data","content","items"):
                      if isinstance(payload.get(key), list): return payload[key]
              return []

          months = [(2026,8),(2026,7),(2026,6),(2026,5),(2026,4),(2026,3),(2026,2),(2026,1)]
          latest_rows = []
          latest_label = None
          for year, month in months:
              last_day = 24 if (year,month)==(2026,8) else calendar.monthrange(year,month)[1]
              start = f"{year:04d}-{month:02d}-01"
              end = f"{year:04d}-{month:02d}-{last_day:02d}"
              for modality in (3,5,6,7):
                  payload, status, err = get(CONTRACTS, {
                      "pagina":1,"tamanhoPagina":10,
                      "dataPublicacaoPncpInicial":start,
                      "dataPublicacaoPncpFinal":end,
                      "codigoModalidade":modality,
                  })
                  result = rows(payload)
                  total = payload.get("totalRegistros") if isinstance(payload,dict) else None
                  print(f"COMPRAS_FRESHNESS={start}..{end}|modalidade={modality}|HTTP={status}|ROWS={len(result)}|TOTAL={total}|ERR={err!r}")
                  if result and latest_label is None:
                      latest_label = f"{start}..{end}|modalidade={modality}"
                      latest_rows = result[:5]
              if latest_label is not None:
                  break

          print("COMPRAS_LATEST_NONEMPTY=" + repr(latest_label))
          if latest_rows:
              print("COMPRAS_LATEST_KEYS=" + ",".join(sorted(latest_rows[0].keys())))
              for row in latest_rows[:3]:
                  print("COMPRAS_LATEST_SAMPLE=" + repr({
                      "idCompra":row.get("idCompra"),
                      "numeroControlePNCP":row.get("numeroControlePNCP"),
                      "modalidade":row.get("modalidadeNome"),
                      "situacao":row.get("situacaoCompraNomePncp"),
                      "publicacao":row.get("dataPublicacaoPncp"),
                      "atualizacao":row.get("dataAtualizacaoPncp") or row.get("dataAualizacaoPncp"),
                      "abertura":row.get("dataAberturaPropostaPncp"),
                      "encerramento":row.get("dataEncerramentoPropostaPncp"),
                      "objeto":str(row.get("objetoCompra") or "")[:160],
                  }))

          catalog_total = catalog_filled = resolved = section5 = item_calls = item_failures = 0
          seen = set()
          for row in latest_rows[:5]:
              purchase_id = row.get("idCompra")
              if not purchase_id: continue
              item_calls += 1
              payload, status, err = get(ITEMS_ID,{"tipo":"idCompra","codigo":purchase_id})
              its = rows(payload)
              print(f"COMPRAS_LATEST_ITEMS={purchase_id}|HTTP={status}|ROWS={len(its)}|ERR={err!r}")
              if not its:
                  item_failures += 1
                  continue
              for item in its:
                  if not isinstance(item,dict): continue
                  catalog_total += 1
                  code = item.get("codItemCatalogo")
                  print("COMPRAS_LATEST_ITEM=" + repr({
                      "materialOuServico":item.get("materialOuServico"),
                      "codigoGrupo":item.get("codigoGrupo"),
                      "codigoClasse":item.get("codigoClasse"),
                      "codItemCatalogo":code,
                      "descricao":str(item.get("descricaoResumida") or item.get("descricaodetalhada") or "")[:120],
                  }))
                  if code in (None,"",0,"0"): continue
                  catalog_filled += 1
                  if str(code) in seen: continue
                  seen.add(str(code))
                  cp, cs, ce = get(CATSER,{"pagina":1,"tamanhoPagina":10,"codigoServico":code})
                  cr = rows(cp)
                  if cr: resolved += 1
                  for svc in cr[:1]:
                      sec = svc.get("codigoSecao")
                      if str(sec).lstrip("0")=="5": section5 += 1
                      print("COMPRAS_CATSER=" + repr({
                          "codigoServico":code,"codigoSecao":sec,"nomeSecao":svc.get("nomeSecao"),"nomeServico":svc.get("nomeServico")
                      }))
          print(f"COMPRAS_CATALOG_TOTAL={catalog_total}|FILLED={catalog_filled}|RESOLVED={resolved}|SECTION5={section5}|ITEM_CALLS={item_calls}|ITEM_FAILURES={item_failures}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
