name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA bounded global-update chain probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import time
          import requests

          CONSULTA="https://pncp.gov.br/api/consulta"
          PNCP="https://pncp.gov.br/api/pncp"
          S=requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA bounded probe/1.2"})

          def get(url,params=None,tries=2,timeout=25):
              last=""
              for a in range(tries):
                  try:
                      r=S.get(url,params=params,timeout=timeout)
                      t=r.text or ""
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"; time.sleep(a+1); continue
                      if r.status_code>=400: return None,r.status_code,t[:250]
                      try: return r.json(),r.status_code,""
                      except Exception: return None,r.status_code,"NON_JSON:"+t[:180]
                  except Exception as exc:
                      last=f"{type(exc).__name__}:{exc}"; time.sleep(a+1)
              return None,0,last

          def rows(p):
              if isinstance(p,list): return p
              if isinstance(p,dict):
                  for k in ("data","resultado","content","items"):
                      if isinstance(p.get(k),list): return p[k]
              return []

          def meta(p):
              if not isinstance(p,dict): return {}
              return {k:p.get(k) for k in ("numeroPagina","paginasRestantes","totalPaginas","totalRegistros","empty") if k in p}

          params={"dataInicio":"20260821","dataFim":"20260821","pagina":1,"tamanhoPagina":10}
          payload,st,er=get(CONSULTA+"/v1/pca/atualizacao",params,tries=2,timeout=30)
          plans=rows(payload)
          print(f"PCA_UPDATE_HTTP={st}|ROWS={len(plans)}|META={meta(payload)!r}|ERR={er!r}")
          if st!=200 or not isinstance(payload,(dict,list)):
              raise SystemExit("PNCP PCA update route failed bounded live probe")
          if plans:
              print("PCA_UPDATE_KEYS="+",".join(sorted(plans[0].keys())))
          for p in plans[:5]: print("PCA_UPDATE_SAMPLE="+repr(p))

          def first(r,*ks):
              for k in ks:
                  v=r.get(k)
                  if v not in (None,""): return v
              return None

          total_items=works=future=failures=0
          categories={}; identities=set(); dup=0; max_update=None; checked=0
          for plan in plans[:5]:
              if not isinstance(plan,dict): continue
              cnpj=first(plan,"cnpj","orgaoEntidadeCnpj")
              ano=first(plan,"anoPca","ano")
              seq=first(plan,"sequencialPca","sequencial")
              if None in (cnpj,ano,seq):
                  print("PCA_UNUSABLE_PLAN_ID="+repr(plan)); continue
              checked+=1
              pp,ps,pe=get(f"{PNCP}/v1/orgaos/{cnpj}/pca/{ano}/{seq}/itens",tries=2,timeout=25)
              its=rows(pp) if not isinstance(pp,list) else pp
              print(f"PCA_ITEMS={cnpj}:{ano}:{seq}|HTTP={ps}|ROWS={len(its)}|ERR={pe!r}")
              if ps!=200 or not isinstance(pp,(dict,list)):
                  failures+=1; continue
              for it in its:
                  if not isinstance(it,dict): continue
                  total_items+=1
                  cid=first(it,"categoriaItemPcaId","categoriaItemPca")
                  cname=first(it,"categoriaItemPcaNome","categoriaItemNome")
                  categories[(str(cid),str(cname))]=categories.get((str(cid),str(cname)),0)+1
                  isworks=str(cid) in {"3","4","8"} or str(cname or "").strip().lower() in {"obras","serviços de engenharia","servicos de engenharia","obras e serviços de engenharia","obras e servicos de engenharia"}
                  if not isworks: continue
                  works+=1
                  ident=(str(cnpj),str(ano),str(seq),str(first(it,"numeroItem","numeroItemPca")))
                  if ident in identities: dup+=1
                  identities.add(ident)
                  des=first(it,"dataDesejada")
                  if des:
                      try:
                          if datetime.fromisoformat(str(des)[:10]).date()>=datetime.now(timezone.utc).date(): future+=1
                      except Exception: pass
                  upd=first(it,"dataAtualizacao")
                  if upd:
                      try:
                          d=datetime.fromisoformat(str(upd).replace("Z","+00:00"))
                          if d.tzinfo is None:d=d.replace(tzinfo=timezone.utc)
                          if max_update is None or d>max_update:max_update=d
                      except Exception: pass
                  sample={k:it.get(k) for k in ("numeroItem","categoriaItemPcaId","categoriaItemPcaNome","classificacaoSuperiorCodigo","classificacaoSuperiorNome","codigoItem","descricao","quantidade","valorUnitario","valorTotal","valorOrcamentoExercicio","dataDesejada","unidadeRequisitante","grupoContratacaoCodigo","grupoContratacaoNome","dataPublicacaoPncp","dataInclusao","dataAtualizacao") if k in it}
                  print(f"PCA_WORK_ITEM={cnpj}:{ano}:{seq}|{sample!r}")

          print(f"PCA_CHAIN_PLANS={checked}|FAILURES={failures}|ITEMS={total_items}|WORKS={works}|FUTURE_WORKS={future}|DUPLICATES={dup}")
          print("PCA_CATEGORIES="+repr(categories))
          print("PCA_MAX_UPDATE="+(max_update.isoformat() if max_update else "None"))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
