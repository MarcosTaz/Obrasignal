name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA verified Works controls
        run: |
          python - <<'PY'
          import requests, time

          BASE="https://pncp.gov.br/api/pncp/v1/orgaos"
          S=requests.Session(); S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA verified Works control/2.0"})
          plans=[
              ("08241804000194",2026,1,"public-indexed-engineering-plan"),
              ("03507548000110",2026,1,"varzea-grande-works-plan"),
              ("05853163000130",2026,2,"public-indexed-civil-works-plan"),
          ]
          works_names={"obra","obras","serviços de engenharia","servicos de engenharia","obras e serviços de engenharia","obras e servicos de engenharia"}
          found=[]

          def get(url,params=None,timeout=20):
              try:
                  t0=time.monotonic(); r=S.get(url,params=params,timeout=timeout); sec=time.monotonic()-t0
                  print(f"PCA_VERIFIED_HTTP={url}|PARAMS={params!r}|HTTP={r.status_code}|SEC={sec:.3f}|BYTES={len(r.content or b'')}")
                  if r.status_code!=200 or not r.content:
                      print("PCA_VERIFIED_BODY="+repr((r.text or "")[:220])); return None
                  return r.json()
              except Exception as exc:
                  print(f"PCA_VERIFIED_EXCEPTION={url}|{type(exc).__name__}:{exc}"); return None

          for cnpj,year,seq,label in plans:
              root=f"{BASE}/{cnpj}/pca/{year}/{seq}"
              agg=get(root+"/valorescategoriaitem")
              print(f"PCA_VERIFIED_AGG={label}|{agg!r}")
              rows=agg if isinstance(agg,list) else (agg.get("data") if isinstance(agg,dict) and isinstance(agg.get("data"),list) else [])
              present=[]
              for row in rows:
                  if not isinstance(row,dict): continue
                  cid=row.get("categoriaItemId") if row.get("categoriaItemId") is not None else row.get("categoriaItemPcaId")
                  name=row.get("categoriaItemNome") or row.get("categoriaItemPcaNome")
                  if str(name or "").strip().lower() in works_names:
                      present.append((cid,name,row))
              print(f"PCA_VERIFIED_WORK_CATEGORIES={label}|"+repr([(c,n) for c,n,_ in present]))
              for cid,cname,_ in present:
                  payload=get(root+"/itens",{"categoria":cid,"pagina":1,"tamanhoPagina":10})
                  items=payload if isinstance(payload,list) else (payload.get("data") if isinstance(payload,dict) and isinstance(payload.get("data"),list) else [])
                  print(f"PCA_VERIFIED_WORK_ITEMS={label}|CATEGORY={cid}:{cname}|ROWS={len(items)}")
                  for item in items[:3]:
                      if not isinstance(item,dict): continue
                      sample={k:item.get(k) for k in (
                          "numeroItem","categoriaItemPcaId","categoriaItemPcaNome","classificacaoSuperiorCodigo","classificacaoSuperiorNome",
                          "codigoItem","descricaoItem","quantidade","quantidadeEstimada","valorUnitario","valorTotal","valorOrcamentoExercicio",
                          "dataDesejada","unidadeRequisitante","grupoContratacaoCodigo","grupoContratacaoNome","dataInclusao","dataAtualizacao"
                      ) if k in item}
                      print(f"PCA_VERIFIED_WORK_ITEM={label}|{sample!r}")
                      found.append((label,cid,cname,sample))
              if found: break

          print(f"PCA_VERIFIED_WORK_FOUND={len(found)}")
          if not found:
              raise SystemExit("Indexed Works PCA controls were not reproduced through production API")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf='%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
