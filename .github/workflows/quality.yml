name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA one-day incremental probe
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import time
          import requests

          S = requests.Session()
          S.headers.update({"Accept": "application/json", "User-Agent": "ObraSignal PNCP-PCA bounded probe/2.0"})
          CONSULT = "https://pncp.gov.br/api/consulta/v1/pca/atualizacao"
          API = "https://pncp.gov.br/api/pncp/v1"

          def request(url, params=None, timeout=25, tries=2):
              last = ""
              for attempt in range(tries):
                  try:
                      r = S.get(url, params=params, timeout=timeout)
                      print(f"PNCP_HTTP={r.status_code}|URL={r.url.split('?')[0]}|CONTENT_TYPE={r.headers.get('content-type')!r}|BYTES={len(r.content)}")
                      if r.status_code in (429, 500, 502, 503, 504):
                          last = f"HTTP {r.status_code}"
                          time.sleep(attempt + 1)
                          continue
                      if r.status_code == 204:
                          return None, 204, ""
                      if r.status_code >= 400:
                          return None, r.status_code, (r.text or "")[:300]
                      try:
                          return r.json(), r.status_code, ""
                      except Exception:
                          return None, r.status_code, "NON_JSON:" + repr((r.text or "")[:300])
                  except Exception as exc:
                      last = f"{type(exc).__name__}:{exc}"
                      time.sleep(attempt + 1)
              return None, 0, last

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "content", "items", "resultado", "lista"):
                      if isinstance(payload.get(key), list):
                          return payload[key]
              return []

          # Publisher-native category domain, not a hard-coded inference table.
          cats, cs, ce = request(API + "/categoriaItemPcas", {"statusAtivo": "true"}, timeout=20)
          cat_rows = rows(cats) or (cats if isinstance(cats, list) else [])
          print(f"PNCP_PCA_CATEGORIES_HTTP={cs}|COUNT={len(cat_rows)}|ERR={ce!r}")
          for cat in cat_rows:
              if isinstance(cat, dict):
                  print("PNCP_PCA_CATEGORY=" + repr({k: cat.get(k) for k in ("id", "nome", "descricao", "statusAtivo")}))

          # Tiny global discovery windows.  yyyyMMdd is the PNCP consultation convention.
          found = []
          found_payload = None
          today = date(2026, 8, 24)
          for offset in range(1, 8):
              day = today - timedelta(days=offset)
              compact = day.strftime("%Y%m%d")
              payload, status, err = request(CONSULT, {
                  "dataInicio": compact,
                  "dataFim": compact,
                  "pagina": 1,
                  "tamanhoPagina": 10,
              }, timeout=25, tries=2)
              result = rows(payload)
              meta = {}
              if isinstance(payload, dict):
                  meta = {k: payload.get(k) for k in ("totalRegistros", "totalPaginas", "paginasRestantes", "numeroPagina", "tamanhoPagina") if k in payload}
              print(f"PNCP_PCA_UPDATE_DAY={compact}|HTTP={status}|ROWS={len(result)}|META={meta!r}|ERR={err!r}")
              if result:
                  found = result
                  found_payload = payload
                  break

          if found:
              print("PNCP_PCA_UPDATE_KEYS=" + ",".join(sorted(found[0].keys())))
              for row in found[:3]:
                  print("PNCP_PCA_UPDATE_SAMPLE=" + repr(row))
          else:
              print("PNCP_PCA_UPDATE_NO_NONEMPTY_DAY=true")

          # Independent official item-detail control from a publicly indexed 2026 PCA.
          control_cnpj, control_year, control_seq = "08241804000194", 2026, 1
          detail_url = f"{API}/orgaos/{control_cnpj}/pca/{control_year}/{control_seq}/itens"
          detail, ds, de = request(detail_url, timeout=25, tries=2)
          detail_rows = rows(detail) or (detail if isinstance(detail, list) else [])
          print(f"PNCP_PCA_DETAIL_HTTP={ds}|ROWS={len(detail_rows)}|ERR={de!r}")
          if detail_rows:
              print("PNCP_PCA_DETAIL_KEYS=" + ",".join(sorted(detail_rows[0].keys())))
              works = []
              for item in detail_rows:
                  if not isinstance(item, dict):
                      continue
                  cat_name = str(item.get("categoriaItemPcaNome") or item.get("categoriaItemPcaNome") or "")
                  if any(token in cat_name.lower() for token in ("obra", "engenharia")):
                      works.append(item)
              print(f"PNCP_PCA_DETAIL_WORKS={len(works)}")
              for item in works[:5]:
                  print("PNCP_PCA_WORK_ITEM=" + repr({
                      "numeroItem": item.get("numeroItem"),
                      "categoriaItemPcaId": item.get("categoriaItemPcaId") or item.get("categoriaItemPcaid"),
                      "categoriaItemPcaNome": item.get("categoriaItemPcaNome"),
                      "classificacaoSuperiorCodigo": item.get("classificacaoSuperiorCodigo"),
                      "classificacaoSuperiorNome": item.get("classificacaoSuperiorNome"),
                      "grupoContratacaoCodigo": item.get("grupoContratacaoCodigo"),
                      "valorTotal": item.get("valorTotal"),
                      "dataDesejada": item.get("dataDesejada"),
                      "dataPublicacaoPncp": item.get("dataPublicacaoPncp"),
                      "dataAtualizacao": item.get("dataAtualizacao"),
                  }))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
