name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP live-smoke production Brazil PNCP PCA connector
        run: |
          python - <<'PY'
          from datetime import timedelta
          from brazil_pncp_pca import (
              OVERLAP_MINUTES,
              SOURCE,
              SIGNAL_TYPE,
              WORK_CATEGORY_IDS,
              _cursor_text,
              _search_identity,
              _search_page,
              fetch_brazil_pncp_pca_plans,
          )

          # Derive the publisher clock from PNCP itself. Advancing the test
          # watermark exactly one overlap window makes the production cutoff
          # equal to the latest observed PCA update, so the full connector path
          # is exercised without hydrating an arbitrary historical backlog.
          top, _ = _search_page(1)
          assert top
          newest = _search_identity(top[0])[3]
          smoke_watermark = _cursor_text(newest + timedelta(minutes=OVERLAP_MINUTES))
          rows, cursor = fetch_brazil_pncp_pca_plans(watermark=smoke_watermark)

          assert cursor
          assert all(row.get("source") == SOURCE for row in rows)
          assert all(row.get("signal_type") == SIGNAL_TYPE for row in rows)
          assert all(str(row.get("category_code")) in WORK_CATEGORY_IDS for row in rows)
          assert all(row.get("external_id") and row.get("source_updated_at") for row in rows)
          assert all(not row.get("deadline") for row in rows)
          print(f"PNCP_PRODUCTION_SMOKE|signals={len(rows)}|cursor={cursor}|watermark={smoke_watermark}")
          if rows:
              sample = rows[0]
              print("PNCP_SAMPLE|" + repr({
                  "external_id": sample.get("external_id"),
                  "category_code": sample.get("category_code"),
                  "target_date": sample.get("target_date"),
                  "value": sample.get("value"),
                  "buyer": sample.get("buyer"),
              }))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
