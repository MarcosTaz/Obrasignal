name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP inspect PNCP PCA frontend discovery contract
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests

          S = requests.Session()
          S.headers.update({"User-Agent": "Mozilla/5.0 ObraSignal source-contract audit/1.0"})
          page = "https://pncp.gov.br/app/pca"
          r = S.get(page, timeout=25)
          print(f"PNCP_APP_HTTP={r.status_code}|CONTENT_TYPE={r.headers.get('content-type')!r}|BYTES={len(r.content)}")
          r.raise_for_status()
          html = r.text

          scripts = []
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I):
              url = urljoin(page, src)
              if url.startswith("https://pncp.gov.br/") or url.startswith("https://www.pncp.gov.br/"):
                  scripts.append(url)
          scripts = list(dict.fromkeys(scripts))[:25]
          print(f"PNCP_APP_SCRIPTS={len(scripts)}")

          needles = ("/pca", "pca?", "pca/", "PCA", "api/consulta", "api/pncp")
          candidates = set()
          for i, url in enumerate(scripts, 1):
              try:
                  js = S.get(url, timeout=25)
                  print(f"PNCP_JS={i}|HTTP={js.status_code}|BYTES={len(js.content)}|PATH={url.split('pncp.gov.br')[-1][:180]}")
                  if js.status_code != 200 or len(js.content) > 12_000_000:
                      continue
                  text = js.text
                  if not any(n in text for n in needles):
                      continue
                  # Extract endpoint-looking string literals, then print only PCA/API candidates.
                  for raw in re.findall(r'["\']([^"\']{3,260})["\']', text):
                      value = raw.replace("\\/", "/")
                      low = value.lower()
                      if ("pca" in low and ("/" in value or "api" in low)) or "api/consulta" in low:
                          if not value.startswith("data:"):
                              candidates.add(value)
                  # Also show short surrounding snippets around PCA service methods.
                  for match in list(re.finditer(r'pca', text, flags=re.I))[:20]:
                      a=max(0, match.start()-180); b=min(len(text), match.end()+260)
                      snippet=re.sub(r'\s+', ' ', text[a:b])
                      if "api" in snippet.lower() or "http" in snippet.lower():
                          print("PNCP_PCA_JS_CONTEXT=" + repr(snippet[:520]))
              except Exception as exc:
                  print(f"PNCP_JS_ERROR={i}|{type(exc).__name__}:{exc}")

          print(f"PNCP_PCA_ENDPOINT_CANDIDATES={len(candidates)}")
          for value in sorted(candidates):
              print("PNCP_PCA_ENDPOINT=" + repr(value[:500]))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
