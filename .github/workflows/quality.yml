name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP Brazil PGC endpoint health probe
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import time
          import requests

          BASE = "https://dadosabertos.compras.gov.br"
          SPEC = BASE + "/v3/api-docs"
          PGC_ORG = BASE + "/modulo-pgc/1_consultarPgcDetalhe"
          PGC_CATALOG = BASE + "/modulo-pgc/2_consultarPgcDetalheCatalogo"
          ORGAO = BASE + "/modulo-uasg/2_consultarOrgao"
          S = requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal Brazil PGC health probe/1.1"})

          def get(url, params=None, tries=3, timeout=30):
              last = ""
              for attempt in range(tries):
                  try:
                      r = S.get(url, params=params, timeout=timeout)
                      if r.status_code in (429,500,502,503,504):
                          last = f"HTTP {r.status_code}"
                          time.sleep(attempt + 1)
                          continue
                      if r.status_code >= 400:
                          return None, r.status_code, (r.text or "")[:300]
                      return r.json(), r.status_code, ""
                  except Exception as exc:
                      last = f"{type(exc).__name__}:{exc}"
                      time.sleep(attempt + 1)
              return None, 0, last

          def rows(payload):
              if isinstance(payload, list): return payload
              if isinstance(payload, dict):
                  for key in ("resultado","data","content","items"):
                      if isinstance(payload.get(key), list): return payload[key]
              return []

          def meta(payload):
              if not isinstance(payload,dict): return {}
              return {k:payload.get(k) for k in ("totalRegistros","totalPaginas","paginasRestantes")}

          spec, ss, se = get(SPEC, tries=2, timeout=20)
          print(f"PGC_SPEC_HTTP={ss}|ERR={se!r}")
          if isinstance(spec,dict):
              paths = spec.get("paths") or {}
              for target in (
                  "/modulo-pgc/1_consultarPgcDetalhe",
                  "/modulo-pgc/2_consultarPgcDetalheCatalogo",
                  "/modulo-uasg/2_consultarOrgao",
              ):
                  op = ((paths.get(target) or {}).get("get") or {})
                  params = [(p.get("name"),p.get("required"),((p.get("schema") or {}).get("type"))) for p in op.get("parameters",[]) if isinstance(p,dict)]
                  print(f"PGC_HEALTH_OPENAPI={target}|{params!r}")

          # The official portal's own 2025 support discussion used this exact PGC org/UASG.
          controls = [
              ("00508903000188", 2025, "090016", "official-support-control-2025"),
              ("00508903000188", 2026, "090016", "same-control-2026"),
              ("00394452000103", 2026, None, "federal-defence-2026"),
          ]
          for org, year, uasg, label in controls:
              params = {"pagina":1,"tamanhoPagina":50,"orgao":org,"anoPcaProjetoCompra":year}
              if uasg: params["codigoUasg"] = uasg
              payload, status, err = get(PGC_ORG, params)
              result = rows(payload)
              print(f"PGC_ORG_CONTROL={label}|HTTP={status}|ROWS={len(result)}|META={meta(payload)!r}|ERR={err!r}")
              if result:
                  print("PGC_ORG_KEYS=" + ",".join(sorted(result[0].keys())))
                  strict = [r for r in result if str(r.get("codigoSecaoServico")).lstrip("0")=="5"]
                  not_executed = [r for r in strict if r.get("statusContratacaoExecucao") is not True]
                  print(f"PGC_ORG_SECTION5={label}|STRICT={len(strict)}|NOT_EXECUTED={len(not_executed)}")
                  for r in strict[:5]:
                      print("PGC_ORG_WORK_SAMPLE=" + repr({
                          "orgao":r.get("orgao"),"codigoUasg":r.get("codigoUasg"),"nomeUasg":r.get("nomeUasg"),
                          "numeroArtefato":r.get("numeroArtefato"),"anoArtefato":r.get("anoArtefato"),"ordemDfd":r.get("ordemDfd"),
                          "secao":r.get("codigoSecaoServico"),"grupo":r.get("codigoGrupoServico"),"nomeGrupo":r.get("nomeGrupoServico"),
                          "item":r.get("codigoItemCatalogo"),"descricaoItem":str(r.get("descricaoItemCatalogo") or "")[:140],
                          "objeto":str(r.get("descricaoObjetoDfd") or "")[:160],"prioridade":r.get("nivelPrioridadeDfd"),
                          "formalizacao":r.get("dataPrevistaFormalizacaoDemanda"),"inicio":r.get("dataInicioProcessoCompra"),"fim":r.get("dataFimProcessoCompra"),
                          "executado":r.get("statusContratacaoExecucao"),"itemPncp":r.get("numeroItemPncp"),
                          "atualizacao":r.get("dataHoraAtualizacaoItem") or r.get("dataHoraAtualizacaoProjetoCompra"),
                      }))

          # Does the catalog route fail regardless of year/data volume?
          for year in (2024,2025,2026):
              payload,status,err = get(PGC_CATALOG,{"pagina":1,"tamanhoPagina":10,"anoPcaProjetoCompra":year,"tipo":"S","codigo":541})
              print(f"PGC_CATALOG_CONTROL=year:{year}|group:541|HTTP={status}|ROWS={len(rows(payload))}|META={meta(payload)!r}|ERR={err!r}")

          # Measure whether org-by-org discovery is operationally bounded.
          opayload, ostatus, oerr = get(ORGAO,{"pagina":1,"tamanhoPagina":500})
          orgs = rows(opayload)
          print(f"UASG_ORGAO_LIST_HTTP={ostatus}|ROWS={len(orgs)}|META={meta(opayload)!r}|ERR={oerr!r}")
          if orgs:
              print("UASG_ORGAO_KEYS=" + ",".join(sorted(orgs[0].keys())))
              for r in orgs[:8]:
                  print("UASG_ORGAO_SAMPLE=" + repr(r))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
