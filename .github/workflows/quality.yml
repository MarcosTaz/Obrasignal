name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP resolve PNCP PCA frontend chunks
        run: |
          python - <<'PY'
          import re, time
          from urllib.parse import urljoin
          import requests

          PAGE = "https://pncp.gov.br/app/pca"
          S = requests.Session()
          S.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Referer": PAGE,
              "Accept": "*/*",
          })

          def get(url, tries=4):
              last=None
              for n in range(tries):
                  try:
                      r=S.get(url, timeout=25)
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"; time.sleep(n+1); continue
                      return r
                  except Exception as e:
                      last=e; time.sleep(n+1)
              print(f"FETCH_FAIL={url}|{last!r}")
              return None

          page=get(PAGE)
          assert page is not None and page.status_code == 200
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', page.text, flags=re.I):
              scripts.append(urljoin(PAGE,src))
          scripts=list(dict.fromkeys(scripts))
          print("SCRIPT_URLS="+repr(scripts))

          assets={}
          for url in scripts:
              r=get(url)
              if r is None: continue
              print(f"SCRIPT_FETCH={url}|HTTP={r.status_code}|BYTES={len(r.content)}")
              if r.status_code==200:
                  assets[url]=r.text

          # Angular/Webpack runtime maps chunk ids to hashed filenames. Extract every local JS path/hash
          # visible in already loaded assets, then fetch bounded same-origin candidates.
          names=set()
          for url,text in assets.items():
              for raw in re.findall(r'["\']([^"\']+\.js)["\']', text):
                  if 0 < len(raw) < 220 and not raw.startswith(("http://","https://","data:")):
                      names.add(urljoin(url,raw))
              for raw in re.findall(r'([A-Za-z0-9._-]{3,120}\.[a-f0-9]{8,32}\.js)', text):
                  names.add(urljoin(url,raw))
          print(f"DIRECT_JS_CANDIDATES={len(names)}")

          # Also parse webpack hash maps of the form id:"hash" and id:"chunk-name" from runtime.
          ids_to_hash={}
          ids_to_name={}
          for text in assets.values():
              for ident,h in re.findall(r'(\d+):["\']([a-f0-9]{8,32})["\']',text):
                  ids_to_hash.setdefault(ident,h)
              for ident,name in re.findall(r'(\d+):["\']([A-Za-z0-9_-]{3,80})["\']',text):
                  if not re.fullmatch(r'[a-f0-9]{8,32}',name): ids_to_name.setdefault(ident,name)
          print(f"WEBPACK_HASH_IDS={len(ids_to_hash)}|NAME_IDS={len(ids_to_name)}")
          for ident,name in list(ids_to_name.items())[:200]:
              if "pca" in name.lower() or "plan" in name.lower() or "contrat" in name.lower():
                  print(f"WEBPACK_RELEVANT={ident}|NAME={name}|HASH={ids_to_hash.get(ident)}")

          # Search loaded bundles for dynamic import contexts around route 'pca'.
          relevant_ids=set()
          for url,text in assets.items():
              for m in re.finditer(r'pca',text,flags=re.I):
                  a=max(0,m.start()-500); b=min(len(text),m.end()+800)
                  sn=text[a:b]
                  if any(x in sn.lower() for x in ("loadchildren","loadcomponent","import(","webpack","route","path:")):
                      print("PCA_ROUTE_CONTEXT="+repr(re.sub(r'\s+',' ',sn)[:1400]))
                      relevant_ids.update(re.findall(r'\b(\d{2,6})\b',sn))
          print("RELEVANT_IDS="+repr(sorted(relevant_ids)[:80]))

          # Construct conventional Angular chunk paths only when both id/hash were actually observed.
          base="https://pncp.gov.br/app/"
          for ident in sorted(relevant_ids):
              h=ids_to_hash.get(ident)
              if not h: continue
              for filename in (f"{ident}.{h}.js", f"{ids_to_name.get(ident,ident)}.{h}.js"):
                  url=urljoin(base,filename)
                  r=get(url,tries=2)
                  if r is None or r.status_code!=200: continue
                  text=r.text
                  print(f"RELEVANT_CHUNK={url}|BYTES={len(r.content)}")
                  for m in re.finditer(r'pca',text,flags=re.I):
                      a=max(0,m.start()-350); b=min(len(text),m.end()+550)
                      sn=re.sub(r'\s+',' ',text[a:b])
                      if "api" in sn.lower() or "http" in sn.lower() or "service" in sn.lower():
                          print("PCA_CHUNK_CONTEXT="+repr(sn[:950]))
                  endpoints=set()
                  for raw in re.findall(r'["\']([^"\']{2,260})["\']',text):
                      value=raw.replace('\\/','/')
                      low=value.lower()
                      if "pca" in low and ("/" in value or "api" in low): endpoints.add(value)
                  for ep in sorted(endpoints): print("PCA_CHUNK_ENDPOINT="+repr(ep[:400]))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
