name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP freeze PNCP PCA search ordering contract
        run: |
          python - <<'PY'
          import re, time, requests

          CHUNK="https://pncp.gov.br/app/default-src_app_pages_pcaPage_planejamento_module_ts.5f0d34fff9039ddc.js"
          SEARCH="https://pncp.gov.br/api/search/"
          S=requests.Session()
          S.headers.update({
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Referer":"https://pncp.gov.br/app/pca",
              "Accept":"application/json, text/plain, */*",
          })

          def get(url, *, params=None, tries=4):
              last=None
              for n in range(tries):
                  try:
                      r=S.get(url,params=params,timeout=25)
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"; time.sleep(n+1); continue
                      return r
                  except Exception as exc:
                      last=exc; time.sleep(n+1)
              raise RuntimeError(f"bounded fetch failed: {last!r}")

          cr=get(CHUNK)
          print(f"CHUNK_HTTP={cr.status_code}|BYTES={len(cr.content)}")
          cr.raise_for_status(); chunk=cr.text
          for needle in ("ordenacao","data_atualizacao_pncp","recentes","relevancia"):
              shown=0
              for m in re.finditer(re.escape(needle),chunk,flags=re.I):
                  a=max(0,m.start()-800); b=min(len(chunk),m.end()+1100)
                  ctx=re.sub(r'\s+',' ',chunk[a:b])
                  print(f"ORDER_CONTEXT_{needle}="+repr(ctx[:1950]))
                  shown+=1
                  if shown>=8: break
          vals=set()
          for raw in re.findall(r'["\']([^"\']{1,140})["\']',chunk):
              low=raw.lower()
              if any(x in low for x in ("ordena","atualizacao","recente","relev")):
                  vals.add(raw)
          print("ORDER_LITERALS="+repr(sorted(vals)[:250]))

          variants=[
              {},
              {"ordenacao":"data_atualizacao_pncp"},
              {"ordenacao":"-data_atualizacao_pncp"},
              {"ordenacao":"data_atualizacao_pncp_desc"},
              {"ordenacao":"mais_recente"},
          ]
          for extra in variants:
              params={"q":"","tipos_documento":"pcaorgao","pagina":1,"tam_pagina":5,**extra}
              try:r=get(SEARCH,params=params)
              except Exception as exc:
                  print(f"ORDER_PROBE_ERROR={extra!r}|{type(exc).__name__}:{exc}"); continue
              print(f"ORDER_PROBE={extra!r}|HTTP={r.status_code}|BYTES={len(r.content)}")
              if r.status_code!=200: continue
              try:data=r.json()
              except Exception:
                  print("ORDER_NON_JSON="+repr((r.text or "")[:300])); continue
              rows=data.get("items",[]) if isinstance(data,dict) else []
              print("ORDER_UPDATES="+repr([x.get("data_atualizacao_pncp") for x in rows]))
              print("ORDER_YEARS="+repr([x.get("ano") for x in rows]))
              print("ORDER_IDS="+repr([x.get("id") for x in rows]))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
