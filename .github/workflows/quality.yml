name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP Brazil PNCP known-works CATSER probe
        run: |
          python - <<'PY'
          import time
          import requests

          S = requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP source-evaluation probe/1.4"})

          def get(url, params=None):
              last = None
              for attempt in range(3):
                  try:
                      r = S.get(url, params=params, timeout=30)
                      if r.status_code in (429, 500, 502, 503, 504):
                          last = f"HTTP {r.status_code}"
                          time.sleep(attempt + 1)
                          continue
                      r.raise_for_status()
                      return r.json(), r.status_code
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                      time.sleep(attempt + 1)
              raise RuntimeError(last)

          def records(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "content", "items", "resultado", "resultados"):
                      if isinstance(payload.get(key), list):
                          return payload[key]
              return []

          known = [
              ("00394452000103", 2026, 14582, "Ponta Grossa command pavilion"),
              ("00394452000103", 2026, 13836, "63rd Infantry photovoltaic plant"),
          ]
          for cnpj, ano, seq, label in known:
              payload, status = get(f"https://pncp.gov.br/api/pncp/v1/orgaos/{cnpj}/compras/{ano}/{seq}/itens")
              items = records(payload)
              print(f"PNCP_KNOWN_WORKS={label}|HTTP={status}|ITEMS={len(items)}")
              for item in items[:5]:
                  cat = item.get("catalogo") if isinstance(item.get("catalogo"), dict) else {}
                  category = item.get("categoriaItemCatalogo") if isinstance(item.get("categoriaItemCatalogo"), dict) else {}
                  code = item.get("catalogoCodigoItem")
                  print("PNCP_KNOWN_WORK_ITEM=" + repr({
                      "numeroItem": item.get("numeroItem"),
                      "materialOuServico": item.get("materialOuServico"),
                      "descricao": str(item.get("descricao") or "")[:240],
                      "catalogoCodigoItem": code,
                      "catalogo": {"id":cat.get("id"),"nome":cat.get("nome"),"descricao":cat.get("descricao"),"url":cat.get("url")},
                      "categoriaItemCatalogo": {"id":category.get("id"),"nome":category.get("nome"),"descricao":category.get("descricao")},
                      "ncmNbsCodigo": item.get("ncmNbsCodigo"),
                  }))
                  if code:
                      try:
                          catser_payload, catser_status = get(
                              "https://dadosabertos.compras.gov.br/modulo-servico/6_consultarItemServico",
                              {"pagina":1,"tamanhoPagina":10,"codigoServico":code},
                          )
                          catser = records(catser_payload)
                          print(f"CATSER_RESOLVE={code}|HTTP={catser_status}|ROWS={len(catser)}")
                          for row in catser[:3]:
                              print("CATSER_ROW=" + repr({k:row.get(k) for k in (
                                  "codigoSecao","nomeSecao","codigoDivisao","nomeDivisao","codigoGrupo","nomeGrupo",
                                  "codigoClasse","nomeClasse","codigoSubclasse","nomeSubclasse","codigoServico","nomeServico","codigoCpc"
                              )}))
                      except Exception as exc:
                          print(f"CATSER_RESOLVE={code}|ERROR={type(exc).__name__}:{exc}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
