name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP resolve PNCP PCA named lazy chunk
        run: |
          python - <<'PY'
          import re, time
          from urllib.parse import urljoin
          import requests

          BASE = "https://pncp.gov.br/app/"
          PAGE = BASE + "pca"
          TARGET = "default-src_app_pages_pcaPage_planejamento_module_ts"
          S = requests.Session()
          S.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Referer": PAGE,
              "Accept": "*/*",
          })

          def get(url, tries=4):
              last=None
              for n in range(tries):
                  try:
                      r=S.get(url, timeout=25)
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"; time.sleep(n+1); continue
                      return r
                  except Exception as exc:
                      last=exc; time.sleep(n+1)
              raise RuntimeError(f"fetch failed {url}: {last!r}")

          page=get(PAGE)
          assert page.status_code == 200
          scripts=[urljoin(PAGE,src) for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page.text,flags=re.I)]
          runtime_url=next(url for url in scripts if "/runtime." in url)
          runtime=get(runtime_url)
          assert runtime.status_code == 200
          text=runtime.text
          print(f"PNCP_RUNTIME={runtime_url}|BYTES={len(runtime.content)}")

          # Webpack uses the chunk name itself as the id in this build.
          # Capture all literal mappings involving the exact observed PCA chunk name.
          for m in re.finditer(re.escape(TARGET), text):
              a=max(0,m.start()-500); b=min(len(text),m.end()+700)
              print("PNCP_RUNTIME_PCA_CONTEXT="+repr(text[a:b]))

          # Common Angular/Webpack production pattern: <chunk-name>.<contenthash>.js.
          # Resolve only hashes associated with the publisher-observed target name.
          hashes=set()
          patterns=(
              re.escape(TARGET)+r'["\']?\s*:\s*["\']([a-f0-9]{8,40})["\']',
              r'["\']'+re.escape(TARGET)+r'["\']\s*:\s*["\']([a-f0-9]{8,40})["\']',
          )
          for pattern in patterns:
              hashes.update(re.findall(pattern,text))
          # If runtime builds the filename through two maps, print every nearby hash and test bounded candidates.
          if not hashes:
              for m in re.finditer(re.escape(TARGET),text):
                  nearby=text[max(0,m.start()-1200):min(len(text),m.end()+1200)]
                  hashes.update(re.findall(r'["\']([a-f0-9]{8,40})["\']',nearby))
          print("PNCP_PCA_CHUNK_HASHES="+repr(sorted(hashes)))

          candidates=[]
          for h in sorted(hashes):
              candidates.extend([
                  BASE + f"{TARGET}.{h}.js",
                  BASE + f"{h}.js",
              ])
          # Also use exact same-origin JS filenames literally present in runtime.
          for raw in re.findall(r'["\']([^"\']+\.js)["\']',text):
              if TARGET in raw:
                  candidates.append(urljoin(runtime_url,raw))
          candidates=list(dict.fromkeys(candidates))[:20]
          print("PNCP_PCA_CHUNK_CANDIDATES="+repr(candidates))

          chunk=None
          chunk_url=None
          for url in candidates:
              try:
                  r=get(url,tries=2)
              except Exception as exc:
                  print(f"PNCP_CHUNK_ERROR={url}|{type(exc).__name__}:{exc}")
                  continue
              print(f"PNCP_CHUNK_TRY={url}|HTTP={r.status_code}|BYTES={len(r.content)}|CTYPE={r.headers.get('content-type')!r}")
              if r.status_code==200 and "javascript" in str(r.headers.get("content-type") or "").lower() and len(r.content)>500:
                  chunk=r.text; chunk_url=url; break

          if chunk is None:
              print("PNCP_PCA_CHUNK_RESOLVED=false")
          else:
              print(f"PNCP_PCA_CHUNK_RESOLVED=true|URL={chunk_url}|BYTES={len(chunk.encode())}")
              endpoints=set()
              for raw in re.findall(r'["\']([^"\']{2,320})["\']',chunk):
                  value=raw.replace('\\/','/')
                  low=value.lower()
                  if "pca" in low and ("/" in value or "api" in low): endpoints.add(value)
              for ep in sorted(endpoints):
                  print("PNCP_PCA_ENDPOINT="+repr(ep[:500]))
              for m in re.finditer(r'pca',chunk,flags=re.I):
                  a=max(0,m.start()-450); b=min(len(chunk),m.end()+750)
                  sn=re.sub(r'\s+',' ',chunk[a:b])
                  if any(token in sn.lower() for token in ("http","api","service","buscar","consulta","planejamento")):
                      print("PNCP_PCA_CHUNK_CONTEXT="+repr(sn[:1250]))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
