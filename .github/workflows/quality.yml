name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA valid-page-size diagnostic
        run: |
          python - <<'PY'
          import time, requests
          URL="https://pncp.gov.br/api/consulta/v1/pca/atualizacao"
          S=requests.Session(); S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA diagnostic/1.4"})
          cases=[
            ("compact_same",{"dataInicio":"20260821","dataFim":"20260821","pagina":1,"tamanhoPagina":10}),
            ("compact_20_21",{"dataInicio":"20260820","dataFim":"20260821","pagina":1,"tamanhoPagina":10}),
            ("compact_21_22",{"dataInicio":"20260821","dataFim":"20260822","pagina":1,"tamanhoPagina":10}),
            ("iso_same",{"dataInicio":"2026-08-21","dataFim":"2026-08-21","pagina":1,"tamanhoPagina":10}),
            ("cnpj_same",{"dataInicio":"20260821","dataFim":"20260821","cnpj":"13128814000158","pagina":1,"tamanhoPagina":10}),
            ("cnpj_20_22",{"dataInicio":"20260820","dataFim":"20260822","cnpj":"13128814000158","pagina":1,"tamanhoPagina":10}),
          ]
          for label,params in cases:
            try:
              t0=time.monotonic(); r=S.get(URL,params=params,timeout=25); sec=time.monotonic()-t0
              raw=r.content or b""; text=raw[:260].decode("utf-8",errors="replace")
              print(f"PCA10={label}|HTTP={r.status_code}|SEC={sec:.3f}|CTYPE={r.headers.get('content-type')!r}|CLEN={r.headers.get('content-length')!r}|BYTES={len(raw)}|TEXT={text!r}")
              if raw:
                try:
                  p=r.json()
                  if isinstance(p,dict):
                    print(f"PCA10_JSON={label}|KEYS={sorted(p.keys())!r}|META="+repr({k:p.get(k) for k in ("numeroPagina","paginasRestantes","totalPaginas","totalRegistros","empty") if k in p}))
                    for k in ("data","resultado","content","items"):
                      if isinstance(p.get(k),list): print(f"PCA10_ROWS={label}|KEY={k}|ROWS={len(p[k])}|FIRST="+repr(p[k][0] if p[k] else None)); break
                  elif isinstance(p,list): print(f"PCA10_LIST={label}|ROWS={len(p)}|FIRST="+repr(p[0] if p else None))
                except Exception as exc: print(f"PCA10_JSON_ERROR={label}|{type(exc).__name__}:{exc}")
            except Exception as exc: print(f"PCA10_EXCEPTION={label}|{type(exc).__name__}:{exc}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
