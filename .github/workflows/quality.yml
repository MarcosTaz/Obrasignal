name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA production identity probe
        run: |
          python - <<'PY'
          import time
          from collections import Counter
          import requests

          SEARCH="https://pncp.gov.br/api/search/"
          API="https://pncp.gov.br/api/pncp/v1"
          S=requests.Session()
          S.headers.update({
              "Accept":"application/json, text/plain, */*",
              "User-Agent":"ObraSignal PNCP production-contract probe/1.1",
              "Referer":"https://pncp.gov.br/app/pca",
          })

          def get(url, params=None, tries=4, timeout=30):
              last=None
              for n in range(tries):
                  try:
                      r=S.get(url,params=params,timeout=timeout)
                      if r.status_code in (429,500,502,503,504):
                          last=f"HTTP {r.status_code}"; time.sleep(n+1); continue
                      return r
                  except Exception as exc:
                      last=exc; time.sleep(n+1)
              raise RuntimeError(f"bounded fetch failed {url}: {last!r}")

          def rows_from(data):
              if isinstance(data,list): return data
              if isinstance(data,dict):
                  for key in ("items","data","content","results","resultados"):
                      if isinstance(data.get(key),list): return data[key]
              return []

          def search(size, page=1):
              r=get(SEARCH,{
                  "q":"",
                  "tipos_documento":"pcaorgao",
                  "ordenacao":"-data",
                  "pagina":page,
                  "tam_pagina":size,
              })
              print(f"SEARCH_SIZE={size}|PAGE={page}|HTTP={r.status_code}|BYTES={len(r.content)}")
              r.raise_for_status(); data=r.json()
              assert isinstance(data,dict) and isinstance(data.get("items"),list)
              print(f"SEARCH_TOTAL={data.get('total')}|ROWS={len(data['items'])}")
              return data

          for size in (10,50,100):
              data=search(size)
              assert 0 < len(data["items"]) <= size

          start=search(10)
          rows=start["items"]
          updates=[str(x.get("data_atualizacao_pncp") or "") for x in rows]
          print("RECENT_UPDATES="+repr(updates))
          assert all(updates[i] >= updates[i+1] for i in range(len(updates)-1))
          assert all(str(row.get("orgao_cnpj") or "").strip() and str(row.get("ano") or "").strip() for row in rows)

          hydrated=False
          for control in rows[:5]:
              cnpj=str(control.get("orgao_cnpj") or "").strip()
              ano=str(control.get("ano") or "").strip()
              consolidated=f"{API}/orgaos/{cnpj}/pca/{ano}/consolidado/unidades"
              cr=get(consolidated,{"pagina":1,"tamanhoPagina":100},tries=3,timeout=40)
              print(f"CONSOLIDATED={cnpj}/{ano}|HTTP={cr.status_code}|BYTES={len(cr.content)}")
              if cr.status_code != 200 or not cr.content:
                  continue
              try: cdata=cr.json()
              except Exception: continue
              units=rows_from(cdata)
              print(f"CONSOLIDATED_TYPE={type(cdata).__name__}|ROWS={len(units)}")
              if units:
                  print("CONSOLIDATED_KEYS="+repr(sorted(units[0].keys())))
              unit=next((u for u in units if str(u.get("sequencialPca") or "").strip()),None)
              if unit is None:
                  continue
              seq=str(unit.get("sequencialPca")).strip()
              numero=str(unit.get("numeroControlePNCP") or "").strip()
              assert str(unit.get("cnpj") or cnpj).strip() == cnpj
              assert str(unit.get("anoPca") or ano).strip() == ano
              print("PCA_IDENTITY="+repr({
                  "cnpj":cnpj,"ano":ano,"sequencialPca":seq,
                  "numeroControlePNCP":numero,"codigoUnidade":unit.get("codigoUnidade"),
                  "dataAtualizacao":unit.get("dataAtualizacao"),"valorTotal":unit.get("valorTotal"),
              }))

              detail=f"{API}/orgaos/{cnpj}/pca/{ano}/{seq}/itens"
              dr=get(detail,{"pagina":1,"tamanhoPagina":100},tries=3,timeout=40)
              print(f"DETAIL={cnpj}/{ano}/{seq}|HTTP={dr.status_code}|BYTES={len(dr.content)}")
              if dr.status_code != 200 or not dr.content:
                  continue
              idata=dr.json(); items=rows_from(idata)
              print(f"DETAIL_TYPE={type(idata).__name__}|ROWS={len(items)}")
              if not items:
                  continue
              print("DETAIL_KEYS="+repr(sorted(items[0].keys())))
              first=items[0]
              assert str(first.get("cnpj") or "") == cnpj
              assert str(first.get("anoPca") or "") == ano
              assert str(first.get("sequencialPca") or "") == seq
              assert str(first.get("numeroItem") or "").strip()
              cats=Counter(str(item.get("categoriaItemPcaId") or item.get("categoriaItemPcaid") or "") for item in items)
              print("CATEGORY_COUNTS="+repr(dict(cats)))
              works=[item for item in items if str(item.get("categoriaItemPcaId") or item.get("categoriaItemPcaid") or "") in {"3","4","8"}]
              print(f"WORKS_ROWS={len(works)}")
              if works:
                  sample=works[0]
                  print("WORKS_SAMPLE="+repr({k:sample.get(k) for k in (
                      "numeroItem","categoriaItemPcaId","categoriaItemPcaid","categoriaItemPcaNome",
                      "classificacaoSuperiorCodigo","classificacaoSuperiorNome","descricao",
                      "quantidade","valorUnitario","valorTotal","dataDesejada","dataAtualizacao",
                      "grupoContratacaoCodigo","grupoContratacaoNome","codigoUnidade","nomeUnidade"
                  )}))
              hydrated=True
              break

          assert hydrated, "could not prove search -> consolidated/unidades -> sequencialPca -> items chain"

          end=search(10)
          start_anchor=(rows[0].get("data_atualizacao_pncp"),rows[0].get("id"))
          end_anchor=(end["items"][0].get("data_atualizacao_pncp"),end["items"][0].get("id"))
          print(f"ANCHOR_START={start_anchor!r}|ANCHOR_END={end_anchor!r}|DRIFT={start_anchor != end_anchor}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
