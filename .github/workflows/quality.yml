name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP Brazil PNCP catalog classification probe
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import requests

          S = requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP source-evaluation probe/1.2"})

          def get(url, params=None):
              r = S.get(url, params=params, timeout=20)
              r.raise_for_status()
              return r.json(), r.status_code

          def records(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "content", "items", "resultado", "resultados"):
                      if isinstance(payload.get(key), list):
                          return payload[key]
              return []

          def summarize_item(item):
              cat = item.get("catalogo") if isinstance(item.get("catalogo"), dict) else {}
              category = item.get("categoriaItemCatalogo") if isinstance(item.get("categoriaItemCatalogo"), dict) else {}
              return {
                  "numeroItem": item.get("numeroItem"),
                  "materialOuServico": item.get("materialOuServico"),
                  "descricao": str(item.get("descricao") or "")[:220],
                  "catalogoCodigoItem": item.get("catalogoCodigoItem"),
                  "catalogo": {"id": cat.get("id"), "nome": cat.get("nome"), "descricao": cat.get("descricao"), "url": cat.get("url")},
                  "categoriaItemCatalogo": {"id": category.get("id"), "nome": category.get("nome"), "descricao": category.get("descricao")},
                  "ncmNbsCodigo": item.get("ncmNbsCodigo"),
                  "ncmNbsDescricao": item.get("ncmNbsDescricao"),
                  "codigoEspecificacaoCompra": item.get("codigoEspecificacaoCompra"),
              }

          end = (date.today() + timedelta(days=30)).strftime("%Y%m%d")
          payload, status = get("https://pncp.gov.br/api/consulta/v1/contratacoes/proposta", {"dataFinal":end,"pagina":1,"tamanhoPagina":3})
          open_rows = records(payload)
          print(f"PNCP_OPEN_HTTP={status}|ROWS={len(open_rows)}")
          for row in open_rows:
              org = row.get("orgaoEntidade") or {}
              cnpj = org.get("cnpj")
              ano = row.get("anoCompra")
              seq = row.get("sequencialCompra")
              if not (cnpj and ano and seq):
                  continue
              items_payload, item_status = get(f"https://pncp.gov.br/api/pncp/v1/orgaos/{cnpj}/compras/{ano}/{seq}/itens")
              items = records(items_payload)
              print(f"PNCP_OPEN_CASE={row.get('numeroControlePNCP')}|HTTP={item_status}|OBJECT={str(row.get('objetoCompra') or '')[:180]}")
              if items:
                  print("PNCP_OPEN_ITEM_KEYS=" + ",".join(sorted(items[0].keys())))
              for item in items[:3]:
                  print("PNCP_OPEN_ITEM=" + repr(summarize_item(item)))

          known = [
              ("00394452000103", 2026, 14582, "Ponta Grossa command pavilion"),
              ("00394452000103", 2026, 13836, "63rd Infantry photovoltaic plant"),
          ]
          for cnpj, ano, seq, label in known:
              items_payload, status = get(f"https://pncp.gov.br/api/pncp/v1/orgaos/{cnpj}/compras/{ano}/{seq}/itens")
              items = records(items_payload)
              print(f"PNCP_KNOWN_WORKS={label}|HTTP={status}|ITEMS={len(items)}")
              if items:
                  print("PNCP_KNOWN_WORK_KEYS=" + ",".join(sorted(items[0].keys())))
              for item in items[:5]:
                  print("PNCP_KNOWN_WORK_ITEM=" + repr(summarize_item(item)))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
