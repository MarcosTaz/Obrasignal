name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m py_compile app.py preload.py api.py sitecustomize.py source_registry.py source_health.py latency_metrics.py latency_health.py decision_log.py opportunity_funnel.py funnel_integration.py sync_funnel_hook.py commercial_score_v2.py geo_profile.py lot_matcher.py
      - run: pytest -q test_profile_matching.py test_deduplication.py test_sync_pipeline.py test_alert_feed.py test_source_registry.py test_ted_ingestion.py test_ted_resilience.py test_source_health.py test_ted_incremental.py test_latency_metrics.py test_latency_health.py test_decision_log.py test_opportunity_funnel.py test_funnel_integration.py test_sync_funnel_hook.py test_commercial_score_v2.py test_geo_profile.py test_lot_matcher.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
