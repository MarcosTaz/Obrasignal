name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA Works classification control
        run: |
          python - <<'PY'
          import requests, time
          URL="https://pncp.gov.br/api/consulta/v1/pca/"
          S=requests.Session(); S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA Works control/1.5"})
          for code in (541,542,543,546,547):
              try:
                  t0=time.monotonic()
                  r=S.get(URL,params={"anoPca":2026,"codigoClassificacaoSuperior":str(code),"pagina":1,"tamanhoPagina":10},timeout=30)
                  sec=time.monotonic()-t0
                  raw=r.content or b""
                  print(f"PCA_CLASS={code}|HTTP={r.status_code}|SEC={sec:.3f}|BYTES={len(raw)}|CTYPE={r.headers.get('content-type')!r}")
                  if r.status_code!=200 or not raw:
                      print(f"PCA_CLASS_BODY={code}|{raw[:240].decode('utf-8',errors='replace')!r}")
                      continue
                  p=r.json()
                  print(f"PCA_CLASS_META={code}|"+repr({k:p.get(k) for k in ("numeroPagina","paginasRestantes","totalPaginas","totalRegistros","empty") if isinstance(p,dict) and k in p}))
                  data=p.get("data",[]) if isinstance(p,dict) else (p if isinstance(p,list) else [])
                  print(f"PCA_CLASS_ROWS={code}|{len(data)}")
                  cats={}; nitems=0
                  for row in data:
                      if not isinstance(row,dict): continue
                      candidates=row.get("itens") if isinstance(row.get("itens"),list) else [row]
                      for it in candidates:
                          if not isinstance(it,dict): continue
                          nitems+=1
                          name=it.get("categoriaItemPcaNome")
                          cls=it.get("classificacaoSuperiorCodigo")
                          cats[(str(name),str(cls))]=cats.get((str(name),str(cls)),0)+1
                          if nitems<=5:
                              print(f"PCA_CLASS_ITEM={code}|"+repr({k:it.get(k) for k in ("numeroItem","categoriaItemPcaNome","classificacaoSuperiorCodigo","classificacaoSuperiorNome","descricaoItem","pdmDescricao","valorTotal","dataDesejada","dataAtualizacao","grupoContratacaoCodigo","grupoContratacaoNome")}))
                  print(f"PCA_CLASS_COUNTS={code}|ITEMS={nitems}|CATS={cats!r}")
              except Exception as exc:
                  print(f"PCA_CLASS_EXCEPTION={code}|{type(exc).__name__}:{exc}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
