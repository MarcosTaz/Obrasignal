name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA OpenAPI contract probe
        run: |
          python - <<'PY'
          import requests
          url = "https://pncp.gov.br/api/consulta/v3/api-docs"
          r = requests.get(url, headers={"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA contract probe/1.0"}, timeout=20)
          print(f"PNCP_SPEC_HTTP={r.status_code}")
          r.raise_for_status()
          spec = r.json()
          paths = spec.get("paths") or {}
          found = 0
          for path, methods in sorted(paths.items()):
              if "pca" not in path.lower():
                  continue
              op = (methods or {}).get("get") or {}
              if not op:
                  continue
              params=[]
              for p in op.get("parameters",[]):
                  if not isinstance(p,dict): continue
                  s=p.get("schema") or {}
                  params.append({"name":p.get("name"),"in":p.get("in"),"required":p.get("required",False),"type":s.get("type"),"format":s.get("format"),"example":p.get("example",s.get("example"))})
              print(f"PNCP_PCA_OPENAPI={path}|SUMMARY={op.get('summary') or op.get('operationId')!r}|PARAMS={params!r}")
              found += 1
          print(f"PNCP_PCA_GET_OPERATIONS={found}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
