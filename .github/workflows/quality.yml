name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP integration OpenAPI PCA introspection
        run: |
          python - <<'PY'
          import requests

          S=requests.Session()
          S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP integration contract probe/1.8"})
          candidates=[
              "https://pncp.gov.br/api/pncp/v3/api-docs",
              "https://pncp.gov.br/api/pncp/v3/api-docs/swagger-config",
              "https://pncp.gov.br/pncp-api/v3/api-docs",
          ]
          specs=[]
          for url in candidates:
              try:
                  r=S.get(url,timeout=20)
                  print(f"PNCP_INTROSPECT={url}|HTTP={r.status_code}|CTYPE={r.headers.get('content-type')!r}|BYTES={len(r.content or b'')}|BODY={(r.text or '')[:180]!r}")
                  if r.status_code==200 and r.content:
                      try:
                          p=r.json()
                          if isinstance(p,dict): specs.append((url,p))
                      except Exception as exc:
                          print(f"PNCP_INTROSPECT_JSON_ERROR={url}|{type(exc).__name__}:{exc}")
              except Exception as exc:
                  print(f"PNCP_INTROSPECT_EXCEPTION={url}|{type(exc).__name__}:{exc}")

          seen=set(); count=0
          for url,spec in specs:
              for path,methods in sorted((spec.get("paths") or {}).items()):
                  if "/pca" not in path.lower(): continue
                  for method,op in (methods or {}).items():
                      if method.lower()!="get" or not isinstance(op,dict): continue
                      key=(path,method)
                      if key in seen: continue
                      seen.add(key); count+=1
                      params=[]
                      for p in op.get("parameters",[]):
                          if not isinstance(p,dict): continue
                          schema=p.get("schema") or {}
                          params.append({"name":p.get("name"),"in":p.get("in"),"required":p.get("required",False),"type":schema.get("type"),"minimum":schema.get("minimum"),"maximum":schema.get("maximum")})
                      security=op.get("security")
                      print(f"PNCP_PCA_INTEGRATION_GET={path}|SUMMARY={op.get('summary') or op.get('operationId')!r}|SECURITY={security!r}|PARAMS={params!r}")
          print(f"PNCP_PCA_INTEGRATION_GET_COUNT={count}")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
