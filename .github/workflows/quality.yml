name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP freeze PNCP PCA search ordering contract
        run: |
          python - <<'PY'
          import re, requests
          BASE="https://pncp.gov.br/app/"
          PAGE=BASE+"pca"
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0 ObraSignal source audit","Referer":PAGE})
          html=S.get(PAGE,timeout=25).text
          scripts=[BASE+x.split('/')[-1] for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,flags=re.I)]
          runtime_url=next(x for x in scripts if '/runtime.' in x)
          runtime=S.get(runtime_url,timeout=25).text
          target="default-src_app_pages_pcaPage_planejamento_module_ts"
          h=re.search(re.escape(target)+r'["\']?\s*:\s*["\']([a-f0-9]{8,40})["\']',runtime); assert h
          chunk=S.get(BASE+f"{target}.{h.group(1)}.js",timeout=25).text
          print(f"CHUNK_BYTES={len(chunk)}")
          contexts=[]
          for needle in ("ordenacao","data_atualizacao_pncp","Mais recentes","mais recentes","recentes","relevancia"):
              for m in re.finditer(re.escape(needle),chunk,flags=re.I):
                  a=max(0,m.start()-700); b=min(len(chunk),m.end()+900)
                  ctx=re.sub(r'\s+',' ',chunk[a:b])
                  if ctx not in contexts:
                      contexts.append(ctx)
                      print(f"ORDER_CONTEXT_{needle}="+repr(ctx[:1700]))
          # Extract compact literal candidates related to ordering.
          vals=set()
          for raw in re.findall(r'["\']([^"\']{1,120})["\']',chunk):
              low=raw.lower()
              if any(x in low for x in ("ordena","atualizacao","recente","relev")):
                  vals.add(raw)
          print("ORDER_LITERALS="+repr(sorted(vals)[:200]))

          URL="https://pncp.gov.br/api/search/"
          variants=[
              {},
              {"ordenacao":"data_atualizacao_pncp"},
              {"ordenacao":"-data_atualizacao_pncp"},
              {"ordenacao":"data_atualizacao_pncp_desc"},
              {"ordenacao":"mais_recente"},
          ]
          for extra in variants:
              params={"q":"","tipos_documento":"pcaorgao","pagina":1,"tam_pagina":5,**extra}
              r=S.get(URL,params=params,timeout=25,headers={"Accept":"application/json"})
              print(f"ORDER_PROBE={extra!r}|HTTP={r.status_code}|BYTES={len(r.content)}")
              if r.status_code!=200: continue
              try:data=r.json()
              except Exception: continue
              rows=data.get("items",[]) if isinstance(data,dict) else []
              print("ORDER_UPDATES="+repr([x.get("data_atualizacao_pncp") for x in rows]))
              print("ORDER_YEARS="+repr([x.get("ano") for x in rows]))
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
