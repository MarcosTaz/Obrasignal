name: ObraSignal Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Main pushes are intentionally covered so the exact post-merge tree is tested,
# not only the pre-merge pull-request commit.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: TEMP PNCP PCA known-plan Works control
        run: |
          python - <<'PY'
          import requests, time

          BASE="https://pncp.gov.br/api/pncp/v1/orgaos"
          S=requests.Session(); S.headers.update({"Accept":"application/json","User-Agent":"ObraSignal PNCP-PCA known-plan Works control/1.7"})
          plans=[
              ("10651417000178",2026,1,"IF Goiano"),
              ("00394429000100",2026,1,"Comando Aeronautica"),
              ("10792928000100",2026,1,"IF Amazonas"),
          ]
          target_ids={3,4,8}
          found=[]

          def request(url,params=None,timeout=20):
              t0=time.monotonic()
              try:
                  r=S.get(url,params=params,timeout=timeout)
                  sec=time.monotonic()-t0
                  raw=r.content or b""
                  print(f"PCA_CONTROL_HTTP={url}|PARAMS={params!r}|HTTP={r.status_code}|SEC={sec:.3f}|BYTES={len(raw)}")
                  if r.status_code!=200 or not raw:
                      print("PCA_CONTROL_BODY="+repr((r.text or "")[:220])); return None
                  return r.json()
              except Exception as exc:
                  print(f"PCA_CONTROL_EXCEPTION={url}|{type(exc).__name__}:{exc}"); return None

          for cnpj,year,seq,label in plans:
              root=f"{BASE}/{cnpj}/pca/{year}/{seq}"
              agg=request(root+"/valorcategoriaitem")
              print(f"PCA_CATEGORY_AGG={label}|{agg!r}")
              rows=agg if isinstance(agg,list) else (agg.get("data") if isinstance(agg,dict) and isinstance(agg.get("data"),list) else [])
              present=[]
              for row in rows:
                  if not isinstance(row,dict): continue
                  cid=row.get("categoriaItemId")
                  if str(cid).isdigit() and int(cid) in target_ids:
                      present.append((int(cid),row.get("categoriaItemNome"),row.get("quantidadeItens"),row.get("valorTotal")))
              print(f"PCA_WORK_CATEGORIES_PRESENT={label}|{present!r}")
              for cid,cname,qty,total in present:
                  items=request(root+"/itens",{"categoria":cid,"pagina":1,"tamanhoPagina":10})
                  its=items if isinstance(items,list) else (items.get("data") if isinstance(items,dict) and isinstance(items.get("data"),list) else [])
                  print(f"PCA_WORK_ITEMS={label}|CATEGORY={cid}:{cname}|ROWS={len(its)}")
                  for it in its[:3]:
                      if not isinstance(it,dict): continue
                      sample={k:it.get(k) for k in (
                          "cnpj","codigoUnidade","nomeUnidade","anoPca","sequencialPca","numeroItem",
                          "categoriaItemPcaId","categoriaItemPcaNome","classificacaoSuperiorCodigo","classificacaoSuperiorNome",
                          "codigoItem","descricaoItem","quantidade","valorUnitario","valorTotal","valorOrcamentoExercicio",
                          "dataDesejada","unidadeRequisitante","grupoContratacaoCodigo","grupoContratacaoNome",
                          "dataPublicacaoPncp","dataInclusao","dataAtualizacao"
                      ) if k in it}
                      print(f"PCA_WORK_CONTROL_ITEM={label}|{sample!r}")
                      found.append((label,cid,cname,sample))
              if found: break

          print(f"PCA_WORK_CONTROL_FOUND={len(found)}")
          if not found:
              raise SystemExit("Known public PCA controls did not expose a Works-category item")
          PY
      - name: Compile root Python modules
        run: python -m py_compile $(find . -maxdepth 1 -type f -name '*.py' -printf '%f\n' | sort)
      - name: Run repository tests
        run: PYTHONPATH=. pytest -q --import-mode=importlib tests test_*.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install --no-audit --no-fund
      - run: npx expo-doctor
      - name: Verify critical detail wiring
        run: npm run smoke:detail
      - name: Smoke-test Expo bundle
        run: npm run smoke:web
