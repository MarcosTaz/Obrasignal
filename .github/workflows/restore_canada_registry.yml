name: Restore Canada Registry

on:
  push:
    branches:
      - codex/canadabuys-production
    paths:
      - .github/workflows/restore_canada_registry.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canadabuys-production
          fetch-depth: 0
      - name: Restore prior canonical registry and add only Canada wave assignment
        shell: bash
        run: |
          git checkout 75d8453a87844c38cce851ab7e9811f26273d8da -- source_registry.py
          python - <<'PY'
          from pathlib import Path
          p = Path('source_registry.py')
          s = p.read_text()
          marker = '''        signal_types=("TENDER",),
        adapter="CanadaBuysConnector",
        realtime_capable=False,
    ),
'''
          replacement = '''        signal_types=("TENDER",),
        wave=1,
        adapter="CanadaBuysConnector",
        realtime_capable=False,
    ),
'''
          if s.count(marker) != 1:
              raise SystemExit(f'expected one Canada marker, found {s.count(marker)}')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source_registry.py
          git commit -m "Restore canonical registry and Canada Wave-1 metadata"
          git push origin HEAD:codex/canadabuys-production
