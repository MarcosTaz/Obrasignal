name: Israel GPA Live Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'israel_gpa.py'
      - 'test_israel_gpa.py'
      - 'source_registry.py'
      - '.github/workflows/israel_gpa_live.yml'
      - 'research/MENA_ISRAEL_GPA_IMPLEMENTATION_RECORD_20260825.md'

env:
  OBRASIGNAL_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OBRASIGNAL_TEST_SHA }}
      - name: Confirm exact revision under test
        run: test "$(git rev-parse HEAD)" = "$OBRASIGNAL_TEST_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32,<3'
      - name: Observe source, parse, conservatively filter, normalize
        run: |
          python - <<'PY'
          from israel_gpa import fetch_recent_notices, normalize_construction_notices

          notices = fetch_recent_notices(timeout=20, max_details=25)
          assert notices, 'official search yielded no parsed detail notices'
          ids = [n.serial for n in notices]
          assert len(ids) == len(set(ids)), 'publisher serial collision before normalization'
          signals = normalize_construction_notices(notices)
          for signal in signals:
              assert signal['source'] == 'IL_GPA'
              assert signal['signal_type'] == 'TENDER'
              assert signal['source_reference'] == signal['external_id']
              assert signal['country'] == 'ISR'
              assert signal['publication_date']
              assert signal['source_updated_at']
              assert signal['title']
          state = 'MATCHING_OPPORTUNITIES' if signals else 'EMPTY_VALID_RESULT'
          print(f"LIVE_OK state={state} notices={len(notices)} construction={len(signals)} sample={[s['external_id'] for s in signals[:5]]}")
          PY
