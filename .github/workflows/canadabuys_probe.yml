name: CanadaBuys Probe

on:
  push:
    branches:
      - codex/canadabuys-production

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official CanadaBuys files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, urllib.request, xml.etree.ElementTree as ET

          urls = {
              'new': 'https://canadabuys.canada.ca/opendata/pub/newTenderNotice-nouvelAvisAppelOffres.csv',
              'open': 'https://canadabuys.canada.ca/opendata/pub/openTenderNotice-ouvertAvisAppelOffres.csv',
              'dictionary': 'https://donnees-data.tpsgc-pwgsc.gc.ca/ba2/ac-cb/achatscanada-canadabuys-dd.xml',
          }

          for name, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent': 'ObraSignal CanadaBuys probe/1.0'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  body = r.read()
                  print(f'=== {name.upper()} ===')
                  print('status=', r.status)
                  print('content-type=', r.headers.get('content-type'))
                  print('content-length-header=', r.headers.get('content-length'))
                  print('bytes=', len(body))
                  print('etag=', r.headers.get('etag'))
                  print('last-modified=', r.headers.get('last-modified'))
                  if name in {'new','open'}:
                      text = body.decode('utf-8-sig')
                      reader = csv.reader(io.StringIO(text, newline=''))
                      rows=[]
                      for i,row in enumerate(reader):
                          rows.append(row)
                          if i >= 3:
                              break
                      print('header-count=', len(rows[0]) if rows else 0)
                      print('header=', rows[0] if rows else [])
                      for idx,row in enumerate(rows[1:], start=1):
                          print(f'row{idx}-count=', len(row))
                          print(f'row{idx}=', row)
                  else:
                      text = body.decode('utf-8-sig')
                      print('xml-prefix=', text[:1200].replace('\n',' '))
                      root = ET.fromstring(text)
                      print('xml-root=', root.tag)
                      # Print only elements/attrs containing target semantic keywords.
                      keys=('solicitation','reference','procurementcategory','closing','status','organization','region','location','value','currency','publication','amend')
                      seen=0
                      for elem in root.iter():
                          blob=' '.join([elem.tag, *(f'{k}={v}' for k,v in elem.attrib.items()), elem.text or ''])
                          if any(k in blob.lower() for k in keys):
                              print('DICT:', blob[:1200].replace('\n',' '))
                              seen += 1
                              if seen >= 120:
                                  break
          PY
