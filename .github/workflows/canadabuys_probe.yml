name: CanadaBuys Probe

on:
  push:
    branches:
      - codex/canadabuys-production

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze official CanadaBuys files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee canadabuys-probe.txt
          import csv, io, urllib.request, collections, json

          urls = {
              'new': 'https://canadabuys.canada.ca/opendata/pub/newTenderNotice-nouvelAvisAppelOffres.csv',
              'open': 'https://canadabuys.canada.ca/opendata/pub/openTenderNotice-ouvertAvisAppelOffres.csv',
          }

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent':'ObraSignal CanadaBuys probe/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read()
                  return r, body

          for name,url in urls.items():
              r,body=fetch(url)
              text=body.decode('utf-8-sig')
              rows=list(csv.DictReader(io.StringIO(text,newline='')))
              print(f'=== {name.upper()} ===')
              print('status=',r.status,'bytes=',len(body),'etag=',r.headers.get('etag'),'last-modified=',r.headers.get('last-modified'))
              print('rows=',len(rows),'fields=',len(rows[0]) if rows else 0)
              cats=collections.Counter((x.get('procurementCategory-categorieApprovisionnement') or '').strip() for x in rows)
              sts=collections.Counter((x.get('tenderStatus-appelOffresStatut-eng') or '').strip() for x in rows)
              print('category_counts=',dict(cats))
              print('status_counts=',dict(sts))
              cn=[x for x in rows if (x.get('procurementCategory-categorieApprovisionnement') or '').strip()=='*CNST']
              print('cnst_rows=',len(cn))
              print('cnst_missing_solicitation=',sum(not (x.get('solicitationNumber-numeroSollicitation') or '').strip() for x in cn))
              print('cnst_missing_reference=',sum(not (x.get('referenceNumber-numeroReference') or '').strip() for x in cn))
              print('cnst_missing_closing=',sum(not (x.get('tenderClosingDate-appelOffresDateCloture') or '').strip() for x in cn))
              print('cnst_missing_notice_url=',sum(not (x.get('noticeURL-URLavis-eng') or '').strip() for x in cn))
              sol=collections.defaultdict(list); ref=collections.defaultdict(list)
              for x in cn:
                  sol[(x.get('solicitationNumber-numeroSollicitation') or '').strip()].append(x)
                  ref[(x.get('referenceNumber-numeroReference') or '').strip()].append(x)
              sol_dups={k:v for k,v in sol.items() if k and len(v)>1}
              ref_dups={k:v for k,v in ref.items() if k and len(v)>1}
              print('cnst_duplicate_solicitation_keys=',len(sol_dups),'duplicate_rows=',sum(len(v) for v in sol_dups.values()))
              print('cnst_duplicate_reference_keys=',len(ref_dups),'duplicate_rows=',sum(len(v) for v in ref_dups.values()))
              for k,v in list(sol_dups.items())[:20]:
                  print('SOL_DUP',json.dumps({'solicitation':k,'rows':[{'reference':x.get('referenceNumber-numeroReference'),'amendment':x.get('amendmentNumber-numeroModification'),'amendmentDate':x.get('amendmentDate-dateModification'),'publicationDate':x.get('publicationDate-datePublication'),'closing':x.get('tenderClosingDate-appelOffresDateCloture'),'title':x.get('title-titre-eng')} for x in v]},ensure_ascii=False))
              amendments=collections.Counter((x.get('amendmentNumber-numeroModification') or '').strip() for x in cn)
              print('cnst_amendment_counts=',dict(amendments.most_common(20)))
              amended=[x for x in cn if (x.get('amendmentNumber-numeroModification') or '').strip() not in ('','000','0')]
              print('cnst_amended_rows=',len(amended))
              for x in amended[:20]:
                  print('AMENDED',json.dumps({'solicitation':x.get('solicitationNumber-numeroSollicitation'),'reference':x.get('referenceNumber-numeroReference'),'amendment':x.get('amendmentNumber-numeroModification'),'amendmentDate':x.get('amendmentDate-dateModification'),'publicationDate':x.get('publicationDate-datePublication'),'closing':x.get('tenderClosingDate-appelOffresDateCloture'),'status':x.get('tenderStatus-appelOffresStatut-eng')},ensure_ascii=False))
          PY
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: canadabuys-probe
          path: canadabuys-probe.txt
          retention-days: 1
