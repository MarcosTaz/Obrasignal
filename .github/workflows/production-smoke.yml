name: ObraSignal Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BUILD: ${{ github.sha }}
    steps:
      - name: Wake and check exact API deployment health
        id: backend
        run: |
          set -euo pipefail
          # Render services can cold-start or still be replacing the previous
          # instance. A smoke run is green only for the exact revision under test.
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 30 \
              https://obrasignal.onrender.com/api/v1/health > /tmp/health.json \
              && python - <<'PY'
          import json
          import os

          with open('/tmp/health.json', encoding='utf-8') as stream:
              health=json.load(stream)
          assert health.get('ok') is True
          assert health.get('service') == 'obrasignal-api'
          assert health.get('build') == os.environ['TARGET_BUILD']
          auth=health.get('auth') or {}
          # These fields are deliberately bounded by the API contract: no provider
          # URL, issuer, token, JWK material, credentials or exception strings.
          safe_auth={name: auth.get(name) for name in (
              'mode', 'config_present', 'provider_status', 'provider_kind', 'provider_error'
          )}
          print('auth_health=' + json.dumps(safe_auth, sort_keys=True, separators=(',', ':')))
          assert auth.get('mode') == 'provider'
          assert auth.get('config_present') is True
          assert auth.get('provider_status') in {'uninitialized', 'ready'}
          print('production_build=' + str(health.get('build')))
          print('auth_provider_status=' + str(auth.get('provider_status')))
          PY
            then
              echo "Exact production build and auth configuration are healthy on attempt $attempt/18."
              break
            fi
            if [ "$attempt" = 18 ]; then
              echo "Production never served a healthy target build ${TARGET_BUILD:0:7}."
              exit 1
            fi
            echo "Waiting for healthy target production build ${TARGET_BUILD:0:7} (attempt $attempt/18)…"
            sleep 10
          done

      - name: Check protected API boundary
        id: protected
        if: ${{ always() }}
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/body --write-out '%{http_code}' --max-time 30 \
            https://obrasignal.onrender.com/api/v1/profile)"
          test "$status" = "401"
          grep -q 'authentication_required' /tmp/body

      - name: Check browser CORS preflight
        id: cors
        if: ${{ always() }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -X OPTIONS \
            -H 'Origin: https://marcostaz.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: Authorization' \
            -D /tmp/headers -o /dev/null \
            https://obrasignal.onrender.com/api/v1/profile
          grep -qi '^Access-Control-Allow-Origin: https://marcostaz.github.io' /tmp/headers
          grep -qi '^Access-Control-Allow-Headers: .*Authorization' /tmp/headers

      - name: Check exact deployed Web build
        id: web
        if: ${{ always() }}
        run: |
          set -euo pipefail
          expected="${TARGET_BUILD:0:7}"
          marker="<meta name=\"obrasignal-build\" content=\"${expected}\">"
          # The Pages deploy runs independently from the backend rollout. Retry a
          # bounded window so a normal concurrent rollout does not become a false
          # negative, but never accept an old/stale Web shell as production-green.
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 30 \
              https://marcostaz.github.io/Obrasignal/ > /tmp/web.html \
              && grep -Fq "$marker" /tmp/web.html; then
              echo "GitHub Pages is serving exact Web build $expected on attempt $attempt/18."
              exit 0
            fi
            if [ "$attempt" = 18 ]; then
              echo "GitHub Pages never served exact target Web build $expected."
              exit 1
            fi
            echo "Waiting for exact Web build $expected (attempt $attempt/18)…"
            sleep 10
          done

      - name: Write bounded production release evidence
        if: ${{ always() }}
        env:
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          PROTECTED_OUTCOME: ${{ steps.protected.outcome }}
          CORS_OUTCOME: ${{ steps.cors.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          target = os.environ['TARGET_BUILD']
          outcomes = {
              'backend_exact_build_and_auth': os.environ.get('BACKEND_OUTCOME'),
              'protected_api_boundary': os.environ.get('PROTECTED_OUTCOME'),
              'cors_preflight': os.environ.get('CORS_OUTCOME'),
              'web_exact_build': os.environ.get('WEB_OUTCOME'),
          }
          verified = all(value == 'success' for value in outcomes.values())

          health = {}
          health_path = Path('/tmp/health.json')
          if health_path.exists():
              try:
                  health = json.loads(health_path.read_text(encoding='utf-8'))
              except Exception:
                  health = {}

          auth = health.get('auth') if isinstance(health, dict) else {}
          if not isinstance(auth, dict):
              auth = {}
          safe_auth = {name: auth.get(name) for name in (
              'mode', 'config_present', 'provider_status', 'provider_kind', 'provider_error'
          )}

          web_build = None
          web_path = Path('/tmp/web.html')
          if web_path.exists():
              match = re.search(
                  r'<meta\s+name=["\']obrasignal-build["\']\s+content=["\']([^"\']+)["\']',
                  web_path.read_text(encoding='utf-8', errors='replace'),
                  flags=re.I,
              )
              if match:
                  web_build = match.group(1)

          proof = {
              'schema_version': 1,
              'verification': 'VERIFIED' if verified else 'FAILED',
              'failure_class': None if verified else 'UNKNOWN',
              'target_sha': target,
              'backend_sha': health.get('build') if isinstance(health, dict) else None,
              'web_sha_short': web_build,
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'event': os.environ.get('EVENT_NAME'),
              'github_run_id': os.environ.get('RUN_ID'),
              'scope': ['backend', 'auth-config', 'protected-api-boundary', 'cors', 'web'],
              'outcomes': outcomes,
              'safe_auth': safe_auth,
              'known_limitations': [
                  'does_not_prove_authenticated_customer_journey',
                  'does_not_prove_billing_or_entitlement_lifecycle',
                  'does_not_prove_source_freshness_or_market_completeness',
                  'does_not_prove_native_mobile_or_physical_device_delivery',
              ],
              'rollback': {
                  'status': 'UNPROVEN',
                  'target_sha': None,
                  'reason': 'No rollback target is inferred from deploy history; data/config compatibility must be proven before rollback.',
              },
          }
          Path('release-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(proof, sort_keys=True, separators=(',', ':')))
          PY

      - name: Upload production release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: obrasignal-production-proof-${{ github.sha }}
          path: release-proof.json
          if-no-files-found: error
