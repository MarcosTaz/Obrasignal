name: ObraSignal Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake and check API health
        run: |
          set -euo pipefail
          # Render services can cold-start. Allow up to ~3 minutes before
          # declaring production unavailable.
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 30 \
              https://obrasignal.onrender.com/api/v1/health \
              | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("service") == "obrasignal-api"; print(d)'; then
              echo "API healthy on attempt $attempt/18."
              exit 0
            fi
            echo "API not ready yet; waiting 10s (attempt $attempt/18)…"
            sleep 10
          done
          echo "Production API did not become healthy after warm-up retries."
          exit 1

      - name: Check protected API boundary
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/body --write-out '%{http_code}' --max-time 30 \
            https://obrasignal.onrender.com/api/v1/profile)"
          test "$status" = "401"
          grep -q 'authentication_required' /tmp/body

      - name: Check browser CORS preflight
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -X OPTIONS \
            -H 'Origin: https://marcostaz.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: Authorization' \
            -D /tmp/headers -o /dev/null \
            https://obrasignal.onrender.com/api/v1/profile
          grep -qi '^Access-Control-Allow-Origin: https://marcostaz.github.io' /tmp/headers
          grep -qi '^Access-Control-Allow-Headers: .*Authorization' /tmp/headers

      - name: Check deployed Web shell
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            https://marcostaz.github.io/Obrasignal/ \
            | grep -q 'ObraSignal'
