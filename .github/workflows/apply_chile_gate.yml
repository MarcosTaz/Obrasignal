name: Apply Chile Credential Gate

on:
  push:
    branches: [codex/chile-mercadopublico-q060]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chile-mercadopublico-q060
      - name: Apply canonical registry and queue state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('chile_mercadopublico.py')
          s=p.read_text().replace('from urllib.parse import urlencode\n','')
          p.write_text(s)

          p=Path('source_registry.py'); s=p.read_text()
          marker='''    "US_SAM": _source(\n'''
          entry='''    "CL_MERCADOPUBLICO": _source(\n        country="CHL",\n        source_id="cl_mercadopublico_licitaciones_api",\n        kind="OFFICIAL_PUBLIC_PROCUREMENT_API",\n        access="personal_ticket_required",\n        status="planned",\n        priority=1,\n        legal_reuse="GREEN",\n        machine_access="CREDENTIAL_REQUIRED",\n        expected_refresh_minutes=60,\n        stale_after_minutes=180,\n        capabilities=("incremental_sync", "detail", "lifecycle"),\n        signal_types=("TENDER",),\n        adapter="MercadoPublicoConnector",\n        realtime_capable=True,\n    ),\n'''
          if '"CL_MERCADOPUBLICO": _source(' not in s:
              if marker not in s: raise SystemExit('registry insertion marker missing')
              s=s.replace(marker,entry+marker,1)
          p.write_text(s)

          p=Path('master_execution_queue.py'); s=p.read_text()
          s=s.replace('CURRENT_ITEM_ID = "Q060_CHILE_MERCADOPUBLICO"','CURRENT_ITEM_ID = "Q070_SHARED_FAMILIES"',1)
          old='''    _q("Q060_CHILE_MERCADOPUBLICO", "Chile Mercado Público construction connector", "SIGNAL", "ACTIVE", "PRODUCTION",\n       ("Q020_SIGNAL_CONTRACT_V1",), "Strong official API and favourable value-to-effort ratio."),\n    _q("Q070_SHARED_FAMILIES", "Harden TED/eForms and OCDS shared-coverage families", "SIGNAL", "QUEUED", "PRODUCTION",\n       ("Q040_CANADA_BUYS", "Q050_US_SAM", "Q060_CHILE_MERCADOPUBLICO"),\n       "Maximise supported markets per maintained connector and remove country-specific duplication; a blocked Brazil source must not freeze unrelated shared coverage."),\n'''
          new='''    _q("Q060_CHILE_MERCADOPUBLICO", "Chile Mercado Público construction connector", "SIGNAL", "GATED", "PRODUCTION",\n       ("Q020_SIGNAL_CONTRACT_V1",),\n       "Connector, publisher-native construction taxonomy, amount visibility, lifecycle and 429 controls are implemented and test-ticket validated; production activation is blocked until a real individual MERCADOPUBLICO_TICKET is provisioned. The public documentation ticket is test-only."),\n    _q("Q070_SHARED_FAMILIES", "Harden TED/eForms and OCDS shared-coverage families", "SIGNAL", "ACTIVE", "PRODUCTION",\n       ("Q040_CANADA_BUYS", "Q050_US_SAM"),\n       "Maximise supported markets per maintained connector and remove country-specific duplication; country-specific external gates such as Brazil transport reliability or Chile credentials must not freeze independent shared-family hardening."),\n'''
          if old not in s: raise SystemExit('Q060/Q070 queue target missing')
          p.write_text(s.replace(old,new,1))

          Path('CHILE_MERCADOPUBLICO_EVIDENCE.md').write_text('''# Chile Mercado Público — Q060 evidence\n\nStatus: **GATED — external production credential required**.\n\n## Official source contract\n\n- ChileCompra publishes the Mercado Público procurement API as public procurement-data infrastructure. Normal use requires an individual ticket. The ticket printed in the official documentation is explicitly for testing and is not a production credential.\n- `CodigoExterno` is the durable tender identity used by the API.\n- Publisher lifecycle states used by ObraSignal: 5 Publicada → open, 6 Cerrada → closed, 7 Desierta → unsuccessful, 8 Adjudicada → awarded, 18 Revocada → revoked, 19 Suspendida → suspended.\n- Publisher construction admission is `Obras == 2` OR an item `CodigoCategoria` in UNSPSC segment 72 (building/construction/maintenance services). This avoids keyword admission and preserves genuine maintenance/construction tenders observed with `Obras == 0`. Construction-material goods such as UNSPSC 30101700 are not admitted to the contractor-works feed.\n- `MontoEstimado` is exposed only when `VisibilidadMonto == 1`; otherwise ObraSignal leaves value/currency empty.\n\n## Live validation — 2026-08-25\n\n- Classic API `estado=activas` returned 4,408 active opportunities using the official documentation test ticket in explicit validation mode.\n- Live detail `1002588-92-LE26` returned a published building-maintenance tender with `Obras=0`, CLP estimated amount and UNSPSC 72131700, proving that `Obras` alone is insufficient.\n- A steel-beam goods tender used UNSPSC 30101700 and is deliberately excluded from the works feed.\n- The API returned HTTP 429 / code 10500 for closely spaced requests; the connector is strictly sequential and uses bounded exponential backoff.\n- The no-registration OCDS monthly endpoint was not selected for current discovery: 2026-08 returned no records while 2026-07 returned 8,004. Current tender detail lookups on that OCDS endpoint also returned no result.\n- Deterministic tests plus a live detail smoke passed on branch validation run #1.\n\n## Production gate\n\nThe adapter is intentionally not wired into preload while `MERCADOPUBLICO_TICKET` is unavailable. Registry state is `planned` / `CREDENTIAL_REQUIRED`; this prevents a test credential from becoming commercial infrastructure. Once a real ticket is provisioned, rerun the full production-path live gate before changing the source to `ready`.\n''')

          p=Path('test_source_registry.py'); s=p.read_text()
          addition='''\n\ndef test_chile_mercadopublico_is_prebuilt_but_credential_gated():\n    source = SOURCES["CL_MERCADOPUBLICO"]\n    assert source["status"] == "planned"\n    assert source["machine_access"] == "CREDENTIAL_REQUIRED"\n    assert source["access"] == "personal_ticket_required"\n    assert source["adapter"] == "MercadoPublicoConnector"\n    assert set(source["capabilities"]) == {"incremental_sync", "detail", "lifecycle"}\n    assert "CL_MERCADOPUBLICO" not in production_ready_sources()\n    assert set(production_gate_reasons("CL_MERCADOPUBLICO")) == {\n        "machine_access_not_verified", "runtime_not_enabled"\n    }\n'''
          if 'test_chile_mercadopublico_is_prebuilt_but_credential_gated' not in s:
              s += addition
          p.write_text(s)

          p=Path('test_master_execution_queue.py'); s=p.read_text()
          s=s.replace('assert active[0].id == CURRENT_ITEM_ID == "Q060_CHILE_MERCADOPUBLICO"','assert active[0].id == CURRENT_ITEM_ID == "Q070_SHARED_FAMILIES"',1)
          s=s.replace('def test_brazil_remains_gated_canada_and_us_are_done_and_chile_is_active():','def test_country_specific_external_gates_do_not_block_shared_families():',1)
          s=s.replace('assert items["Q060_CHILE_MERCADOPUBLICO"].state == "ACTIVE"','assert items["Q060_CHILE_MERCADOPUBLICO"].state == "GATED"',1)
          old_ready='''def test_single_master_priority_chooses_shared_families_after_current_chile():\n    ready = executable_after_current()\n    assert ready == next_executable_after_current()\n    assert "Q030_BR_PNCP_PCA" not in {item.id for item in ready}\n    assert all(item.state == "QUEUED" for item in ready)\n    assert [item.id for item in ready[:2]] == [\n        "Q070_SHARED_FAMILIES",\n        "Q080_EVIDENCE_GRAPH_V1",\n    ]\n    assert next_item_after_current().id == "Q070_SHARED_FAMILIES"\n'''
          new_ready='''def test_single_master_priority_continues_after_shared_families():\n    ready = executable_after_current()\n    assert ready == next_executable_after_current()\n    assert "Q030_BR_PNCP_PCA" not in {item.id for item in ready}\n    assert "Q060_CHILE_MERCADOPUBLICO" not in {item.id for item in ready}\n    assert all(item.state == "QUEUED" for item in ready)\n    assert ready[0].id == "Q080_EVIDENCE_GRAPH_V1"\n    assert next_item_after_current().id == "Q080_EVIDENCE_GRAPH_V1"\n'''
          if old_ready not in s: raise SystemExit('master queue ready test target missing')
          s=s.replace(old_ready,new_ready,1)
          p.write_text(s)

          p=Path('test_architecture_guardrail_queue.py'); s=p.read_text()
          s=s.replace('assert CURRENT_ITEM_ID == "Q060_CHILE_MERCADOPUBLICO"','assert items["Q060_CHILE_MERCADOPUBLICO"].state == "GATED"\n    assert CURRENT_ITEM_ID == "Q070_SHARED_FAMILIES"',1)
          s=s.replace('assert executable_after_current()[0].id == "Q070_SHARED_FAMILIES"','assert executable_after_current()[0].id == "Q080_EVIDENCE_GRAPH_V1"',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chile_mercadopublico.py source_registry.py master_execution_queue.py CHILE_MERCADOPUBLICO_EVIDENCE.md test_source_registry.py test_master_execution_queue.py test_architecture_guardrail_queue.py
          git diff --cached --quiet || git commit -m "Gate Chile credential and activate shared source families"
          git push origin HEAD:codex/chile-mercadopublico-q060
