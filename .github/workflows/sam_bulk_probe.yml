name: SAM.gov Bulk Probe

on:
  push:
    branches:
      - codex/us-sam-production
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - name: Probe public extract HEAD and validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee sam-bulk-probe.txt
          import requests
          url='https://sam.gov/api/prod/fileextractservices/v1/api/download/Contract%20Opportunities/datagov/ContractOpportunitiesFullCSV.csv?privacy=Public'
          headers={'User-Agent':'ObraSignal SAM.gov probe/1.0'}
          r=requests.head(url,headers=headers,allow_redirects=True,timeout=60)
          print('HEAD status=',r.status_code)
          print('HEAD final_host=',requests.utils.urlparse(r.url).netloc)
          print('HEAD content_length=',r.headers.get('Content-Length'))
          print('HEAD last_modified=',r.headers.get('Last-Modified'))
          print('HEAD etag=',r.headers.get('ETag'))
          r.raise_for_status()
          validators={
              'If-None-Match':r.headers.get('ETag',''),
              'If-Modified-Since':r.headers.get('Last-Modified',''),
              'User-Agent':'ObraSignal SAM.gov probe/1.0',
          }
          c=requests.get(url,headers=validators,allow_redirects=True,stream=True,timeout=60)
          print('COND status=',c.status_code)
          print('COND final_host=',requests.utils.urlparse(c.url).netloc)
          print('COND content_length=',c.headers.get('Content-Length'))
          print('COND last_modified=',c.headers.get('Last-Modified'))
          print('COND etag=',c.headers.get('ETag'))
          c.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sam-bulk-transport-probe
          path: sam-bulk-probe.txt
          retention-days: 1
