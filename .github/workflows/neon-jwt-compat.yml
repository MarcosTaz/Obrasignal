name: ObraSignal Neon JWT Compatibility
on:
  pull_request:
    paths:
      - 'tests/test_neon_jwt_compat.py'
      - 'auth_context_jwt.py'
      - '.github/workflows/neon-jwt-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]>=2.10,<3' 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_neon_jwt_compat.py
