name: ObraSignal Neon JWT Compatibility
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - feature/invite-only-v27-public
# No file-path filter: every update to the integration branch must run this
# tenant-isolation security regression, even if only frontend files change.
permissions:
  contents: read
jobs:
  synthetic-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Compile authorization and tenant-boundary modules
        run: python -m py_compile api.py auth_context.py auth_context_jwt.py neon_company_access.py tests/test_neon_radar_real_http.py
      - name: Run staged Neon identity and real Radar HTTP regressions
        run: python -m pytest -q --junitxml=neon-radar-tests.xml tests/test_neon_jwt_compat.py tests/test_neon_company_access.py tests/test_neon_company_probe.py tests/test_neon_radar_identity_gate.py tests/test_neon_radar_routes.py tests/test_neon_radar_real_http.py
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-radar-synthetic-test-evidence
          path: neon-radar-tests.xml
          if-no-files-found: warn
          retention-days: 14
