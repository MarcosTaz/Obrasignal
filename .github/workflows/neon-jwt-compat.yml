name: ObraSignal Neon JWT Compatibility
on:
  pull_request:
    paths:
      - 'tests/test_neon_jwt_compat.py'
      - 'auth_context_jwt.py'
      - 'neon_company_access.py'
      - 'tests/test_neon_company_access.py'
      - 'neon_company_probe.py'
      - 'api.py'
      - 'tests/test_neon_radar_identity_gate.py'
      - 'tests/test_neon_radar_routes.py'
      - 'tests/test_neon_company_probe.py'
      - '.github/workflows/neon-jwt-compat.yml'
  workflow_dispatch:
  push:
    branches: [feature/invite-only-v27-public]
    paths:
      - 'tests/test_neon_jwt_compat.py'
      - 'auth_context_jwt.py'
      - 'neon_company_access.py'
      - 'neon_company_probe.py'
      - 'tests/test_neon_company_access.py'
      - 'tests/test_neon_company_probe.py'
      - '.github/workflows/neon-jwt-compat.yml'
permissions:
  contents: read
jobs:
  synthetic-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - run: python -m pytest -q tests/test_neon_jwt_compat.py tests/test_neon_company_access.py tests/test_neon_company_probe.py tests/test_neon_radar_identity_gate.py tests/test_neon_radar_routes.py
