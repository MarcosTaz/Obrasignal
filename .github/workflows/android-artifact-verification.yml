name: ObraSignal Android Artifact Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Require EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN" || { echo '::error::MOBILE_BLOCKED EXPO_TOKEN is not configured.'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify exact build provenance
        env:
          BUILD_ID: 33e3a915-1330-40ba-9e02-2c10c5a1e148
          BUILD_GIT_SHA: 11cbc5a527680759fe003132a902aa8164f4b156
          EAS_PROJECT_ID: c277466b-a418-45f7-b070-4fc3f96386b7
          ANDROID_PACKAGE: pt.obrasignal.app
        run: |
          set -euo pipefail
          eas build:view "$BUILD_ID" --json > /tmp/eas-build.json
          python - <<'PY'
          import json, os

          target = json.load(open('/tmp/eas-build.json', encoding='utf-8'))
          if not isinstance(target, dict):
              raise SystemExit('EAS build:view did not return one build object')

          build_id = str(target.get('id') or '')
          status = str(target.get('status') or '').upper().replace('-', '_')
          platform = str(target.get('platform') or '').upper()
          profile = str(target.get('buildProfile') or target.get('profile') or '').lower()
          git_sha = str(target.get('gitCommitHash') or '')
          project_id = str((target.get('app') or {}).get('id') or '')
          app_identifier = str(target.get('appIdentifier') or '')

          if build_id != os.environ['BUILD_ID']:
              raise SystemExit(f"Wrong EAS build id: {build_id or 'missing'}")
          if status != 'FINISHED':
              raise SystemExit(f"Android production build not finished: {status or 'missing'}")
          if platform != 'ANDROID':
              raise SystemExit(f"Wrong EAS platform: {platform or 'missing'}")
          if profile != 'production':
              raise SystemExit(f"Wrong EAS build profile: {profile or 'missing'}")
          if git_sha != os.environ['BUILD_GIT_SHA']:
              raise SystemExit(f"Wrong EAS git commit: {git_sha or 'missing'}")
          if project_id != os.environ['EAS_PROJECT_ID']:
              raise SystemExit(f"Wrong EAS project: {project_id or 'missing'}")
          if app_identifier != os.environ['ANDROID_PACKAGE']:
              raise SystemExit(f"Wrong Android package: {app_identifier or 'missing'}")

          print(
              'ANDROID_BUILD_PROVENANCE_VERIFIED '
              f"id={build_id} source={git_sha} project={project_id} package={app_identifier}"
          )
          PY

      - name: Download and fingerprint exact Android production artifact
        env:
          BUILD_ID: 33e3a915-1330-40ba-9e02-2c10c5a1e148
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cd "$out"
          eas build:download --build-id "$BUILD_ID" --json --non-interactive > /tmp/eas-download.json
          cat /tmp/eas-download.json
          artifact="$(find "$out" -type f -size +0c | head -n 1)"
          test -n "$artifact" || { echo "::error::Android build $BUILD_ID has no downloadable artifact."; exit 1; }
          echo "artifact_name=$(basename "$artifact")"
          stat -c 'artifact_bytes=%s' "$artifact"
          sha256sum "$artifact"
          file "$artifact"
          echo "ANDROID_ARTIFACT_VERIFIED build_id=$BUILD_ID"
