name: ObraSignal Mobile Release Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA authorized for the production build
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      RELEASE_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Confirm exact revision under test
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET_SHA"

      - name: Refuse stale or non-canonical manual release target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          canonical="$(git rev-parse origin/main)"
          test "$canonical" = "$RELEASE_TARGET_SHA" || {
            echo "Refusing production build: target $RELEASE_TARGET_SHA is not current canonical main $canonical."
            exit 1
          }
          echo "canonical_release_sha=$RELEASE_TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package.json

      # This repository intentionally does not commit a package-lock.json.
      # npm ci therefore cannot work here; use npm install to resolve the
      # declared Expo/RN dependency graph reproducibly enough for preflight.
      - run: npm install --no-audit --no-fund

      - name: Validate native release contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const envExample = fs.readFileSync('.env.example', 'utf8');

          const failures = [];
          if (app?.android?.package !== 'pt.obrasignal.app') failures.push('android.package');
          if (app?.ios?.bundleIdentifier !== 'pt.obrasignal.app') failures.push('ios.bundleIdentifier');
          if (!app?.extra?.eas?.projectId) failures.push('expo.extra.eas.projectId');
          if (!eas?.build?.production) failures.push('eas.build.production');
          if (pkg?.dependencies?.['react-native-purchases'] !== '10.7.0') failures.push('react-native-purchases');
          if (pkg?.dependencies?.['expo-notifications'] !== '~57.0.6') failures.push('expo-notifications');
          for (const key of [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'EXPO_PUBLIC_API_URL',
            'EXPO_PUBLIC_REVENUECAT_ANDROID_KEY',
            'EXPO_PUBLIC_REVENUECAT_IOS_KEY',
          ]) {
            if (!envExample.includes(`${key}=`)) failures.push(`.env.example:${key}`);
          }

          if (failures.length) {
            console.error('Native release contract failures:', failures.join(', '));
            process.exit(1);
          }
          console.log('Native release contract is valid.');
          NODE

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Verify production profile
        run: node -e "const e=require('./eas.json'); if(!e.build?.production) process.exit(1); console.log(JSON.stringify(e.build.production))"

      - name: Require EAS token for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN GitHub secret is required for a manual production release.'; exit 1; }

      - name: Authenticated EAS production build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.7.1 build --platform android --profile production --non-interactive --wait --json > eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const builds = Array.isArray(raw) ? raw : [raw];
          if (!builds.length || builds.some((build) => !build || !build.id)) {
            console.error('EAS build report does not contain a build id.');
            process.exit(1);
          }
          fs.writeFileSync('eas-build-report.json', JSON.stringify(raw, null, 2));
          const evidence = {
            target_sha: process.env.RELEASE_TARGET_SHA,
            platform: 'android',
            eas_cli: '21.7.1',
            build_ids: builds.map((build) => build.id),
          };
          fs.writeFileSync('release-build-evidence.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload EAS build report
        if: ${{ github.event_name == 'workflow_dispatch' && always() && hashFiles('mobile/eas-build-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: obrasignal-eas-android-build-report-${{ inputs.target_sha }}
          path: |
            mobile/eas-build-report.json
            mobile/release-build-evidence.json
          if-no-files-found: error
